// ── CAMPO CON COMPLETAMENTO AUTOMATICO ──────────────────────────────────────────
// Sostituisce il <datalist> nativo (poco affidabile su Safari/iOS: spesso non mostra
// i suggerimenti mentre si scrive). Mostra un piccolo menu sotto il campo che si
// filtra in tempo reale in base a quello che si sta digitando, restando visibile
// finché non si sceglie un suggerimento o non si tocca/clicca altrove.
function AutocompleteInput({ value, onChange, options, placeholder, onEnter, className, autoCapitalize }) {
  const [open, setOpen] = useState(false);
  const [highlightIdx, setHighlightIdx] = useState(-1);
  const wrapRef = useRef(null);
  // Tracciano il tocco in corso per distinguere un tap (selezione) da uno scorrimento
  // del menu: prima, selezionare accadeva già su onTouchStart, quindi il primo tocco
  // per iniziare a scorrere selezionava subito la voce toccata, impedendo lo scroll.
  const touchStartYRef = useRef(null);
  const touchMovedRef = useRef(false);

  // Se il campo è vuoto, mostra comunque tutte le opzioni disponibili (fino a 10): prima questa
  // correzione il menu restava vuoto finché non si iniziava a digitare, facendo sembrare il
  // campo "morto" al primo tocco.
  // Quando invece si sta scrivendo, le voci che INIZIANO con il testo digitato vengono mostrate
  // prima di quelle che lo contengono solo a metà parola (es. scrivendo "cio" deve comparire
  // subito "Cioccolato" prima di "Formaggio cioccolatoso"). Prima di questa correzione l'ordine
  // seguiva semplicemente la posizione nell'elenco salvato, e le categorie/prodotti aggiunti
  // più di recente (che finiscono sempre in fondo all'elenco) restavano fuori dalle prime 8
  // voci mostrate finché non si scriveva abbastanza da eliminare tutte le altre alternative.
  const q = value.trim().toLowerCase();
  let filtered;
  if (q) {
    const iniziaCon = [];
    const contiene = [];
    for (const o of options) {
      const ol = o.toLowerCase();
      if (ol === q) continue; // non suggerire ciò che è già stato scritto identico
      if (ol.startsWith(q)) iniziaCon.push(o);
      else if (ol.includes(q)) contiene.push(o);
    }
    filtered = [...iniziaCon, ...contiene].slice(0, 10);
  } else {
    filtered = options.slice(0, 10);
  }

  useEffect(() => {
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', handleOutside);
    document.addEventListener('touchstart', handleOutside);
    return () => {
      document.removeEventListener('mousedown', handleOutside);
      document.removeEventListener('touchstart', handleOutside);
    };
  }, []);

  function selectOption(opt) {
    onChange(opt);
    setOpen(false);
    setHighlightIdx(-1);
  }

  function handleKeyDown(e) {
    if (open && filtered.length > 0) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setHighlightIdx(i => Math.min(i + 1, filtered.length - 1)); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); setHighlightIdx(i => Math.max(i - 1, 0)); return; }
      if (e.key === 'Enter' && highlightIdx >= 0) { e.preventDefault(); selectOption(filtered[highlightIdx]); return; }
    }
    if (e.key === 'Enter') { setOpen(false); if (onEnter) onEnter(); }
    if (e.key === 'Escape') { setOpen(false); }
  }

  return (
    <div ref={wrapRef} style={{ position: 'relative' }}>
      <input
        type="text"
        className={className}
        placeholder={placeholder}
        value={value}
        autoComplete="off"
        autoCapitalize={autoCapitalize}
        onChange={e => { onChange(e.target.value); setOpen(true); setHighlightIdx(-1); }}
        onFocus={() => setOpen(true)}
        onKeyDown={handleKeyDown}
      />
      {open && filtered.length > 0 && (
        <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 50, background: '#fff', border: '1px solid var(--border2)', borderRadius: '8px', marginTop: '3px', boxShadow: 'var(--shadow)', maxHeight: '180px', overflowY: 'auto' }}>
          {filtered.map((opt, i) => (
            <div
              key={opt}
              onMouseDown={e => { e.preventDefault(); selectOption(opt); }}
              onTouchStart={e => { touchStartYRef.current = e.touches[0].clientY; touchMovedRef.current = false; }}
              onTouchMove={e => {
                if (touchStartYRef.current !== null && Math.abs(e.touches[0].clientY - touchStartYRef.current) > 8) {
                  touchMovedRef.current = true;
                }
              }}
              onTouchEnd={e => {
                if (!touchMovedRef.current) { e.preventDefault(); selectOption(opt); }
                touchStartYRef.current = null;
              }}
              style={{ padding: '9px 12px', fontSize: '14px', cursor: 'pointer', background: i === highlightIdx ? 'var(--accent-light)' : 'transparent' }}
            >
              {opt}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── SPESA TAB ──────────────────────────────────────────────────────────────────
function SpesaTab({ data, saveData, addItems, removeItems, updateItem, applyUpdate, aggiornaVoceMappa, askConfirm }) {
  // ── LISTA DELLA SPESA COMPATTA (v54) ─────────────────────────────────────────
  // Pensata per l'uso in negozio con una mano sola: per ogni prodotto servono solo
  // nome, quantità (testo libero: "2", "2 etti", "1 kg") e negozio. Il prezzo NON si
  // scrive più prodotto per prodotto: si scrive una volta sola il totale dello scontrino
  // alla cassa di ogni negozio, con l'eventuale parte pagata in buoni pasto.
  // "Negozio" e "tappa" sono la stessa cosa: l'elenco (e l'ordine del giro) è quello
  // di Impostazioni → Negozi del giro spesa.
  const tappaListSalvata = (data.tappeLista && data.tappeLista.length) ? data.tappeLista : DEFAULT_TAPPE;
  // "Altro" era una tappa di riserva delle versioni precedenti: non è un negozio vero,
  // quindi non si propone più e viene tolta una volta sola anche dai dati salvati (v55).
  const tappaList = tappaListSalvata.filter(t => t !== 'Altro').length ? tappaListSalvata.filter(t => t !== 'Altro') : DEFAULT_TAPPE;
  useEffect(() => {
    if ((data.tappeLista || []).includes('Altro')) {
      applyUpdate({ tappeLista: firebase.firestore.FieldValue.arrayRemove('Altro') });
    }
  }, [data.tappeLista]);
  const ultimoNegozio = (() => { try { return localStorage.getItem('fcc-ultimo-negozio') || ''; } catch (e) { return ''; } })();
  const [form, setForm] = useState({ nome: '', qta: '', tappa: tappaList.includes(ultimoNegozio) ? ultimoNegozio : tappaList[0] });
  // Bozze locali per i campi cassa (si salvano su Firebase solo all'uscita dal campo)
  const [cassaDrafts, setCassaDrafts] = useState({});
  const [qtaDrafts, setQtaDrafts] = useState({});
  // v60: "➕ Nuovo negozio…" direttamente dal riquadro di aggiunta
  const [nuovoNeg, setNuovoNeg] = useState(false);
  const [nuovoNegNome, setNuovoNegNome] = useState('');
  const [avvisoNeg, setAvvisoNeg] = useState('');
  // v60: prodotto di cui è aperto il menu "Sposta in…"
  const [spostaId, setSpostaId] = useState(null);

  // v60: negozi in cui è stato messo ogni prodotto (il più recente per primo), salvati su
  // Firebase in prodottiNegozi. Se un prodotto non è ancora lì, si guarda la lista attuale.
  const prodottiNegozi = data.prodottiNegozi || {};
  function negoziDelProdotto(nome) {
    const k = nomeProdotto(nome).toLowerCase();
    if (!k) return [];
    let arr = prodottiNegozi[k] || [];
    if (!arr.length) arr = (data.listaSpesa || []).filter(i => nomeProdotto(i.nome).toLowerCase() === k).map(i => i.tappa);
    return [...new Set(arr)].filter(t => tappaList.includes(t));
  }
  function ricordaNegozio(nome, tappa) {
    const k = nomeProdotto(nome).toLowerCase();
    if (!k || !tappa) return;
    const prev = prodottiNegozi[k] || [];
    if (prev[0] === tappa) return;
    aggiornaVoceMappa('prodottiNegozi', k, [tappa, ...prev.filter(t => t !== tappa)].slice(0, 6));
  }

  const prodottiNote = (() => {
    const visti = new Map();
    for (const n of [...(data.storicoProdotti || []), ...((data.listaSpesa || []).map(i => i.nome))]) {
      const nn = nomeProdotto(n);
      if (nn && !visti.has(nn.toLowerCase())) visti.set(nn.toLowerCase(), nn);
    }
    return Array.from(visti.values()).sort((a, b) => a.localeCompare(b, 'it'));
  })();
  const lista = data.listaSpesa || [];
  const casse = data.casseSpesa || [];

  function cassaDi(t) { return casse.find(c => c.tappa === t); }

  function add() {
    const nomeTrim = nomeProdotto(form.nome);
    if (!nomeTrim) return;
    let tappa;
    if (nuovoNeg) {
      // v60: negozio nuovo scritto qui. Se esiste già (anche con maiuscole diverse) si usa
      // quello, così non nascono doppioni; altrimenti si aggiunge anche in Impostazioni.
      const nn = nuovoNegNome.trim().replace(/\s+/g, ' ');
      if (!nn) { setAvvisoNeg('Scrivi il nome del nuovo negozio'); return; }
      const esistente = tappaList.find(t => t.toLowerCase() === nn.toLowerCase());
      if (esistente) {
        tappa = esistente;
        setAvvisoNeg(`"${esistente}" esiste già: uso quello`);
      } else {
        tappa = nn;
        setAvvisoNeg('');
        if (data.tappeLista && data.tappeLista.length) applyUpdate({ tappeLista: firebase.firestore.FieldValue.arrayUnion(nn) });
        else applyUpdate({ tappeLista: [...DEFAULT_TAPPE, nn] });
      }
      setNuovoNeg(false);
      setNuovoNegNome('');
    } else {
      tappa = (tappaList.includes(form.tappa) || form.tappa) ? form.tappa : tappaList[0];
      setAvvisoNeg('');
    }
    const item = { id: Date.now(), nome: nomeTrim, qta: form.qta.trim(), tappa, checked: false };
    addItems('listaSpesa', [item]);
    if (!(data.storicoProdotti || []).some(n => (n || '').toLowerCase() === nomeTrim.toLowerCase())) addItems('storicoProdotti', [nomeTrim]);
    ricordaNegozio(nomeTrim, tappa);
    try { localStorage.setItem('fcc-ultimo-negozio', tappa); } catch (e) {}
    setForm({ nome: '', qta: '', tappa });
  }
  // v60: sposta un prodotto già in lista in un altro negozio (con la sua quantità)
  function spostaProdotto(item, tappa) {
    setSpostaId(null);
    if (!tappa || tappa === item.tappa) return;
    updateItem('listaSpesa', item, { ...item, tappa });
    ricordaNegozio(item.nome, tappa);
  }
  function toggle(item) {
    updateItem('listaSpesa', item, { ...item, checked: !item.checked });
  }
  async function del(item) {
    const ok = await askConfirm(`Eliminare "${item.nome}" dalla lista?`);
    if (!ok) return;
    removeItems('listaSpesa', [item]);
  }
  // Prodotti rimasti su un negozio che non è (più) nell'elenco di Impostazioni, ad es. il
  // vecchio "Altro": si spostano tutti insieme su un negozio vero con un solo tocco.
  function spostaNegozio(daNegozio, aNegozio) {
    if (!aNegozio) return;
    const daSpostare = lista.filter(i => (i.tappa || 'Altro') === daNegozio);
    if (!daSpostare.length) return;
    const spostati = daSpostare.map(i => ({ ...i, tappa: aNegozio }));
    const vecchiaCassa = cassaDi(daNegozio);
    applyUpdate({ listaSpesa: firebase.firestore.FieldValue.arrayRemove(...daSpostare) })
      .then(() => applyUpdate({ listaSpesa: firebase.firestore.FieldValue.arrayUnion(...spostati) }));
    if (vecchiaCassa) applyUpdate({ casseSpesa: firebase.firestore.FieldValue.arrayRemove(vecchiaCassa) });
  }
  // Tocco su una tappa in alto → scorre direttamente ai prodotti di quel negozio
  function vaiANegozio(t) {
    const el = document.getElementById('negozio-' + t);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function qtaVal(item) {
    return qtaDrafts[item.id] !== undefined ? qtaDrafts[item.id] : (item.qta || '');
  }
  function commitQta(item) {
    const v = qtaDrafts[item.id];
    setQtaDrafts(d => { const p = { ...d }; delete p[item.id]; return p; });
    if (v === undefined || v.trim() === (item.qta || '')) return;
    updateItem('listaSpesa', item, { ...item, qta: v.trim() });
  }

  // ── Cassa di ogni negozio: totale scontrino + parte pagata con buoni pasto ──
  function cassaVal(t, campo) {
    const d = cassaDrafts[t];
    if (d && d[campo] !== undefined) return d[campo];
    const c = cassaDi(t);
    return c && c[campo] ? Number(c[campo]).toFixed(2).replace('.', ',') : '';
  }
  function setCassaDraft(t, campo, val) {
    setCassaDrafts(d => ({ ...d, [t]: { ...d[t], [campo]: val } }));
  }
  function commitCassa(t) {
    const d = cassaDrafts[t];
    setCassaDrafts(prev => { const p = { ...prev }; delete p[t]; return p; });
    if (!d) return;
    const vecchia = cassaDi(t);
    let totale = parseNumIT(d.totale !== undefined ? d.totale : (vecchia ? String(vecchia.totale) : '')) || 0;
    const buoni = parseNumIT(d.buoni !== undefined ? d.buoni : (vecchia ? String(vecchia.buoni || '') : '')) || 0;
    // v58: spesa pagata tutta con i buoni → se la cassa è vuota si riempie con lo stesso importo
    if (totale <= 0 && buoni > 0) totale = buoni;
    const nuova = { id: vecchia ? vecchia.id : Date.now(), tappa: t, totale: Math.round(totale * 100) / 100, buoni: Math.round(buoni * 100) / 100 };
    if (vecchia && vecchia.totale === nuova.totale && (vecchia.buoni || 0) === nuova.buoni) return;
    if (vecchia && totale <= 0 && buoni <= 0) {
      applyUpdate({ casseSpesa: firebase.firestore.FieldValue.arrayRemove(vecchia) });
      return;
    }
    if (vecchia) {
      updateItem('casseSpesa', vecchia, nuova);
    } else if (totale > 0 || buoni > 0) {
      addItems('casseSpesa', [nuova]);
    }
  }

  // ── Categoria Budget di ogni negozio (impostabile in Impostazioni) ──
  function categoriaBudgetDi(t) {
    const mappa = data.tappeCategorieBudget || {};
    if (mappa[t]) return mappa[t];
    return categoriaBudgetDefault(t, data.categorie || DEFAULT_CATS);
  }

  // ── Tappe del giro: negozi con prodotti in lista o con uno scontrino inserito ──
  const negoziUsati = new Set([...lista.map(i => i.tappa || 'Altro'), ...casse.map(c => c.tappa)]);
  const tappeGiro = [
    ...tappaList.filter(t => negoziUsati.has(t)),
    ...Array.from(negoziUsati).filter(t => !tappaList.includes(t)),
  ];
  // v57: le tappe di oggi sono numerate in modo consecutivo (1, 2, 3…) seguendo l'ordine
  // di Impostazioni, saltando i negozi senza prodotti.
  const tappaFatta = t => { const c = cassaDi(t); return !!(c && c.totale > 0); };
  const numFatte = tappeGiro.filter(tappaFatta).length;
  const giroCompleto = tappeGiro.length > 0 && numFatte === tappeGiro.length;
  const totaleGiro = casse.reduce((a, c) => a + (Number(c.totale) || 0), 0);
  const totaleBuoniGiro = casse.reduce((a, c) => a + (Number(c.buoni) || 0), 0);
  const presi = lista.filter(i => i.checked);
  const casseValide = casse.filter(c => (Number(c.totale) || 0) > 0);

  // A fine giro: una spesa nel Budget per ogni negozio (totale meno buoni, con la
  // categoria Budget del negozio) e un movimento "speso" nei Buoni Pasto per la parte
  // pagata con i buoni. Poi toglie gli articoli presi e gli scontrini. I prodotti non
  // trovati (non spuntati) restano in lista per la prossima volta.
  async function registraSpesa() {
    if (!casseValide.length) return;
    const righe = casseValide.map(c => `• ${c.tappa}: ${formatEuro(c.totale)}${c.buoni > 0 ? ` (di cui buoni ${formatEuro(c.buoni)})` : ''} → ${categoriaBudgetDi(c.tappa)}`).join('\n');
    const mancanti = tappeGiro.filter(t => !tappaFatta(t));
    const avviso = mancanti.length ? `\n\nSenza totale cassa (restano in lista): ${mancanti.join(', ')}` : '';
    const ok = await askConfirm(`Registrare nel Budget?\n\n${righe}${avviso}`);
    if (!ok) return;
    const oggi = localDateStr();
    const base = Date.now();
    const nuoveSpese = [];
    const nuoviBP = [];
    casseValide.forEach((c, idx) => {
      const buoni = Math.min(Number(c.buoni) || 0, Number(c.totale) || 0);
      const netto = Math.round(((Number(c.totale) || 0) - buoni) * 100) / 100;
      if (netto > 0) nuoveSpese.push({ id: base + idx, desc: `Spesa – ${c.tappa}`, amount: netto, cat: categoriaBudgetDi(c.tappa), subcat: '', date: oggi });
      if (buoni > 0) nuoviBP.push({ id: base + 500 + idx, tipo: 'speso', desc: `Spesa – ${c.tappa}`, qty: null, amount: Math.round(buoni * 100) / 100, date: oggi });
    });
    const negoziChiusi = new Set(casseValide.map(c => c.tappa));
    const daTogliere = presi.filter(i => negoziChiusi.has(i.tappa || 'Altro'));
    const updateObj = {};
    if (nuoveSpese.length) updateObj.spese = firebase.firestore.FieldValue.arrayUnion(...nuoveSpese);
    if (nuoviBP.length) updateObj.buoniPasto = firebase.firestore.FieldValue.arrayUnion(...nuoviBP);
    if (daTogliere.length) updateObj.listaSpesa = firebase.firestore.FieldValue.arrayRemove(...daTogliere);
    updateObj.casseSpesa = firebase.firestore.FieldValue.arrayRemove(...casseValide);
    applyUpdate(updateObj);
    setCassaDrafts({});
  }
  async function svuotaSenzaRegistrare() {
    const ok = await askConfirm(`Togliere i ${presi.length} prodotti già presi e i totali cassa SENZA registrarli nel Budget? L'azione non è annullabile.`);
    if (!ok) return;
    const updateObj = {};
    if (presi.length) updateObj.listaSpesa = firebase.firestore.FieldValue.arrayRemove(...presi);
    if (casse.length) updateObj.casseSpesa = firebase.firestore.FieldValue.arrayRemove(...casse);
    applyUpdate(updateObj);
    setCassaDrafts({});
  }

  function renderItem(item) {
    return (
      <React.Fragment key={item.id}>
      <div className={`ls-item${item.checked ? ' presa' : ''}`}>
        <button className="ls-check" onClick={() => toggle(item)} aria-label={item.checked ? 'Rimetti da prendere' : 'Segna come preso'}>
          {item.checked ? '✓' : ''}
        </button>
        <button className="ls-nome ls-nome-btn" onClick={() => setSpostaId(spostaId === item.id ? null : item.id)} aria-label={`Sposta ${nomeProdotto(item.nome)} in un altro negozio`}>{nomeProdotto(item.nome)}</button>
        <input type="text" inputMode="decimal" className="ls-qta" placeholder="–" value={qtaVal(item)}
          onChange={e => setQtaDrafts(d => ({ ...d, [item.id]: e.target.value }))}
          onBlur={() => commitQta(item)}
          onKeyDown={e => e.key === 'Enter' && e.target.blur()} />
        <button className="ls-del" onClick={() => del(item)} aria-label="Elimina">✕</button>
      </div>
      {spostaId === item.id && (
        <div className="ls-sposta">
          <span className="ls-sposta-label">Sposta in:</span>
          <select className="ls-input" value="" onChange={e => spostaProdotto(item, e.target.value)}>
            <option value="" disabled>Scegli il negozio…</option>
            {tappaList.filter(t => t !== item.tappa).map(t => <option key={t} value={t}>{t}</option>)}
          </select>
          <button className="btn small" onClick={() => setSpostaId(null)} aria-label="Chiudi">✕</button>
        </div>
      )}
      </React.Fragment>
    );
  }

  return (
    <div className="section active">
      <div className="print-title">💜 Family CC — Lista della spesa</div>

      {tappeGiro.length > 0 && (
        <div className={`ls-tappe${giroCompleto ? ' completo' : ''}`}>
          <div className="ls-tappe-head">
            <span>{giroCompleto ? '✅ Tappe completate' : '📍 Tappe'}</span>
            <span>{giroCompleto ? `Totale ${formatEuro(totaleGiro)}` : `${numFatte} di ${tappeGiro.length} fatte`}</span>
          </div>
          {!giroCompleto && (
            <div className="ls-chips">
              {tappeGiro.map((t, n) => (
                <button key={t} type="button" onClick={() => vaiANegozio(t)} className={`ls-chip${tappaFatta(t) ? ' fatta' : ''}`}>{tappaFatta(t) ? '✓ ' : ''}{n + 1}. {t}</button>
              ))}
            </div>
          )}
          {giroCompleto && totaleBuoniGiro > 0 && (
            <div className="ls-tappe-sub">di cui 🍱 buoni pasto {formatEuro(totaleBuoniGiro)}</div>
          )}
        </div>
      )}

      <div className="ls-add">
        <AutocompleteInput
          className="ls-input"
          autoCapitalize="sentences"
          placeholder="Prodotto"
          value={form.nome}
          options={prodottiNote}
          onChange={val => {
            // v60: prodotto già conosciuto → il menu si mette sul negozio usato l'ultima volta
            const neg = negoziDelProdotto(val);
            setForm(f => ({ ...f, nome: val, tappa: (!nuovoNeg && neg.length) ? neg[0] : f.tappa }));
            setAvvisoNeg('');
          }}
          onEnter={add}
        />
        {!nuovoNeg ? (
          <div className="ls-add-row">
            <input type="text" inputMode="decimal" className="ls-input ls-add-qta" placeholder="Qtà" value={form.qta}
              onChange={e => setForm(f => ({ ...f, qta: e.target.value }))}
              onKeyDown={e => e.key === 'Enter' && add()} />
            <select className="ls-input ls-add-negozio" value={form.tappa} onChange={e => {
              if (e.target.value === '__nuovo__') { setNuovoNeg(true); setNuovoNegNome(''); setAvvisoNeg(''); }
              else setForm(f => ({ ...f, tappa: e.target.value }));
            }}>
              {form.tappa && !tappaList.includes(form.tappa) && <option value={form.tappa}>{form.tappa}</option>}
              {tappaList.map(t => <option key={t} value={t}>{t}</option>)}
              <option value="__nuovo__">➕ Nuovo negozio…</option>
            </select>
            <button className="btn primary ls-add-btn" onClick={add} aria-label="Aggiungi">＋</button>
          </div>
        ) : (
          <>
            <div className="ls-add-row">
              <input type="text" inputMode="decimal" className="ls-input ls-add-qta" placeholder="Qtà" value={form.qta}
                onChange={e => setForm(f => ({ ...f, qta: e.target.value }))} />
              <input type="text" className="ls-input ls-add-negozio ls-nuovo-neg" placeholder="Nome nuovo negozio" autoFocus
                autoCapitalize="words" value={nuovoNegNome}
                onChange={e => { setNuovoNegNome(e.target.value); setAvvisoNeg(''); }}
                onKeyDown={e => e.key === 'Enter' && add()} />
              <button className="btn ls-add-btn" style={{fontSize:'18px'}} onClick={() => { setNuovoNeg(false); setNuovoNegNome(''); setAvvisoNeg(''); }} aria-label="Annulla nuovo negozio">✕</button>
            </div>
            <button className="btn primary" style={{width:'100%',minHeight:'46px',fontSize:'16px'}} onClick={add}>＋ Aggiungi con nuovo negozio</button>
            <div style={{fontSize:'13px',color:'var(--text2)'}}>Il negozio verrà aggiunto anche in Impostazioni.</div>
          </>
        )}
        {(() => {
          const sugg = nuovoNeg ? [] : negoziDelProdotto(form.nome);
          if (sugg.length < 2) return null;
          return (
            <div className="ls-sugg">
              <span className="ls-sposta-label">Comprato da:</span>
              {sugg.map(t => (
                <button key={t} className={`ls-chip${form.tappa === t ? ' attivo' : ''}`} onClick={() => setForm(f => ({ ...f, tappa: t }))}>{t}</button>
              ))}
            </div>
          );
        })()}
        {avvisoNeg && <div style={{fontSize:'13px',fontWeight:600,color:'var(--orange)'}}>{avvisoNeg}</div>}
      </div>

      {lista.length === 0 && casse.length === 0 && <div className="empty">Lista vuota — scrivi un prodotto qui sopra</div>}

      {tappeGiro.map(t => {
        const pos = tappaList.indexOf(t);
        const prodotti = lista.filter(i => (i.tappa || 'Altro') === t);
        const daPrendere = prodotti.filter(i => !i.checked);
        const giaPresi = prodotti.filter(i => i.checked);
        const fatta = tappaFatta(t);
        return (
          <div key={t} id={'negozio-' + t} className={`ls-negozio${fatta ? ' fatto' : ''}`}>
            <div className="ls-negozio-head">
              <span>{fatta ? '✓ ' : ''}{tappeGiro.indexOf(t) + 1}. {t}</span>
              <span className="ls-negozio-count">
                {fatta ? formatEuro(cassaDi(t).totale) : (daPrendere.length ? `${daPrendere.length} da prendere` : 'tutto preso')}
              </span>
            </div>
            {pos < 0 && (
              <div className="ls-orfano">
                <span>Negozio non presente in Impostazioni. Sposta questi prodotti in:</span>
                <select className="ls-input" value="" onChange={e => spostaNegozio(t, e.target.value)}>
                  <option value="">Scegli negozio…</option>
                  {tappaList.map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
            )}
            {daPrendere.map(renderItem)}
            {giaPresi.map(renderItem)}
            <div className="ls-cassa">
              <label>
                <span>Cassa €</span>
                <input type="text" inputMode="decimal" placeholder="0,00" className="ls-input"
                  value={cassaVal(t, 'totale')}
                  onChange={e => setCassaDraft(t, 'totale', e.target.value)}
                  onBlur={() => commitCassa(t)}
                  onKeyDown={e => e.key === 'Enter' && e.target.blur()} />
              </label>
              <label>
                <span>🍱 buoni €</span>
                <input type="text" inputMode="decimal" placeholder="0,00" className="ls-input"
                  value={cassaVal(t, 'buoni')}
                  onChange={e => setCassaDraft(t, 'buoni', e.target.value)}
                  onBlur={() => commitCassa(t)}
                  onKeyDown={e => e.key === 'Enter' && e.target.blur()} />
              </label>
            </div>
          </div>
        );
      })}

      {casseValide.length > 0 && (
        <button className="btn primary ls-registra" onClick={registraSpesa}>
          💾 Registra spesa ({formatEuro(totaleGiro)})
        </button>
      )}
      {(presi.length > 0 || casse.length > 0) && (
        <button className="btn small danger" style={{width:'100%',marginTop:'10px'}} onClick={svuotaSenzaRegistrare}>
          🗑 Svuota presi e casse senza registrare
        </button>
      )}
    </div>
  );
}

// ── REPORT TAB ─────────────────────────────────────────────────────────────────
function ReportTab({ data, addItems, removeItems, askConfirm }) {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const [expandedCats, setExpandedCats] = useState({});
  const [scadFiltroMese, setScadFiltroMese] = useState(false); // false = tutto lo storico, true = solo mese selezionato
  // Buoni pasto: voce puramente informativa, NON è una spesa reale (non viene pagata),
  // quindi vive in un campo separato (buoniPasto) e non entra mai nei totali di Budget/Report.
  // Ogni buono pasto vale un importo fisso (VALORE_BUONO_PASTO); ogni voce è di tipo
  // "ricevuto" (entrata, es. accredito mensile dall'azienda) o "speso" (uscita, es. usato al supermercato).
  // Il saldo residuo = totale ricevuti - totale spesi, calcolato su tutta la storia (non solo il mese in vista).
  const VALORE_BUONO_PASTO = 8;
  const [showBP, setShowBP] = useState(false);
  const [formBP, setFormBP] = useState({ tipo: 'ricevuto', desc: '', qty: '', amount: '', date: localDateStr() });

  const speseMese = (data.spese || []).filter(s => {
    const [sy, sm] = s.date.split('-').map(Number);
    return sy === year && sm === month;
  });
  const totale = speseMese.reduce((a, s) => a + Number(s.amount), 0);

  const byCat = {};
  for (const s of speseMese) {
    byCat[s.cat] = (byCat[s.cat] || 0) + Number(s.amount);
  }
  const catSort = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

  // Raggruppa le spese del mese per descrizione esatta (es. "Conad", "Laura"): a differenza
  // del raggruppamento per categoria qui sopra, questo mostra ogni descrizione UNA sola volta
  // con il totale sommato di tutte le spese con quella stessa descrizione in quel mese —
  // utile per capire a colpo d'occhio quanto si è speso complessivamente da un certo negozio
  // o per una certa persona/voce ricorrente, indipendentemente dalla categoria/data.
  const byDesc = {};
  for (const s of speseMese) {
    byDesc[s.desc] = (byDesc[s.desc] || 0) + Number(s.amount);
  }
  const descSort = Object.entries(byDesc).sort((a, b) => b[1] - a[1]);

  // Raggruppa le spese per categoria, con elenco delle singole voci ordinate per data (più recenti prima)
  const speseByCat = {};
  for (const s of speseMese) {
    if (!speseByCat[s.cat]) speseByCat[s.cat] = [];
    speseByCat[s.cat].push(s);
  }
  for (const cat in speseByCat) {
    speseByCat[cat].sort((a, b) => b.date.localeCompare(a.date) || (b.id || 0) - (a.id || 0));
  }

  function toggleCat(cat) {
    setExpandedCats(prev => ({ ...prev, [cat]: !prev[cat] }));
  }

  // Storico scadenze pagate: tutto per default, filtrabile per il mese selezionato
  const scadenzePagate = (data.scadenze || [])
    .filter(s => s.pagato)
    .filter(s => {
      if (!scadFiltroMese) return true;
      const [scy, scm] = s.date.split('-').map(Number);
      return scy === year && scm === month;
    })
    .sort((a, b) => b.date.localeCompare(a.date));
  const totScadPagate = scadenzePagate.reduce((a, s) => a + Number(s.amount || 0), 0);

  // Raggruppamento per mese dello storico pagate (v50), stesso schema visivo già usato
  // nella tab Scadenze: un riquadro per mese con etichetta e totale del mese, mesi
  // ordinati dal più recente al più vecchio. Dentro ogni mese l'ordine resta quello
  // già calcolato sopra (per data di scadenza, più recente in cima).
  const scadPagateByMese = {};
  for (const s of scadenzePagate) {
    const chiaveMese = s.date.slice(0, 7); // "yyyy-mm"
    if (!scadPagateByMese[chiaveMese]) scadPagateByMese[chiaveMese] = [];
    scadPagateByMese[chiaveMese].push(s);
  }
  const mesiPagateOrdinati = Object.keys(scadPagateByMese).sort((a, b) => b.localeCompare(a));

  function prevMonth() { if (month === 1) { setMonth(12); setYear(y => y - 1); } else setMonth(m => m - 1); }
  function nextMonth() { if (month === 12) { setMonth(1); setYear(y => y + 1); } else setMonth(m => m + 1); }

  // Buoni pasto del mese selezionato: solo informativo, non sommato a nessun altro totale
  const buoniPastoMese = (data.buoniPasto || []).filter(b => {
    const [by, bm] = b.date.split('-').map(Number);
    return by === year && bm === month;
  }).sort((a, b) => b.date.localeCompare(a.date));
  const totBuoniPasto = buoniPastoMese.reduce((a, b) => a + (b.tipo === 'speso' ? -Number(b.amount || 0) : Number(b.amount || 0)), 0);

  // Saldo residuo su tutta la storia: entrate (ricevuti, incluse le voci vecchie senza "tipo",
  // trattate come ricevute per compatibilità) meno uscite (spesi)
  const tuttiBP = data.buoniPasto || [];
  const totRicevutiStorico = tuttiBP.filter(b => (b.tipo || 'ricevuto') === 'ricevuto').reduce((a, b) => a + Number(b.amount || 0), 0);
  const totSpesiStorico = tuttiBP.filter(b => b.tipo === 'speso').reduce((a, b) => a + Number(b.amount || 0), 0);
  const saldoBP = totRicevutiStorico - totSpesiStorico;
  const qtyResidua = VALORE_BUONO_PASTO ? saldoBP / VALORE_BUONO_PASTO : 0;

  function setFormBPQty(qty) {
    setFormBP(f => ({ ...f, qty, amount: qty === '' ? '' : (importoIT(qty) * VALORE_BUONO_PASTO).toFixed(2).replace('.', ',') }));
  }
  function setFormBPAmount(amount) {
    setFormBP(f => ({ ...f, amount, qty: amount === '' ? '' : String(Math.round(importoIT(amount) / VALORE_BUONO_PASTO * 100) / 100).replace('.', ',') }));
  }
  function addBP() {
    if (!formBP.desc || !formBP.amount) return;
    const b = { id: Date.now(), tipo: formBP.tipo, desc: formBP.desc, qty: formBP.qty ? importoIT(formBP.qty) : null, amount: importoIT(formBP.amount), date: formBP.date };
    addItems('buoniPasto', [b]);
    setFormBP({ tipo: 'ricevuto', desc: '', qty: '', amount: '', date: localDateStr() });
    setShowBP(false);
  }
  async function delBP(item) {
    const ok = await askConfirm(`Eliminare il movimento "${item.desc}"?`);
    if (!ok) return;
    removeItems('buoniPasto', [item]);
  }

  return (
    <div className="section active">
      <div className="print-title">💜 Family CC — Report — {monthLabel(year, month)}</div>
      <div className="budget-header">
        <div className="month-nav">
          <button onClick={prevMonth}>‹</button>
          <div className="month-label">{monthLabel(year, month)}</div>
          <button onClick={nextMonth}>›</button>
        </div>
      </div>

      <div className="card">
        <div className="card-title">📊 Spese per categoria</div>
        {catSort.length === 0 && <div className="empty">Nessuna spesa questo mese</div>}
        {catSort.map(([cat, amt]) => (
          <div className="report-cat-bar" key={cat}>
            <div className="report-cat-label">
              <span>{cat}</span>
              <span>{formatEuro(amt)} <span style={{color:'var(--text3)',fontSize:'12px'}}>({totale ? Math.round(amt/totale*100) : 0}%)</span></span>
            </div>
            <div className="bar-bg">
              <div className="bar-fill" style={{width: totale ? `${amt/totale*100}%` : '0%'}}></div>
            </div>
          </div>
        ))}
        {totale > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Totale</span><span style={{color:'var(--red)'}}>{formatEuro(totale)}</span>
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-title">📋 Dettaglio movimenti per categoria</div>
        {catSort.length === 0 && <div className="empty">Nessuna spesa questo mese</div>}
        {catSort.map(([cat, amt]) => (
          <div key={cat} style={{marginBottom:'10px'}}>
            <div
              onClick={() => toggleCat(cat)}
              style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 12px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'8px',cursor:'pointer'}}
            >
              <span style={{fontWeight:'600',display:'flex',alignItems:'center',gap:'6px'}}>
                <span style={{fontSize:'11px',color:'var(--text3)'}}>{expandedCats[cat] ? '▾' : '▸'}</span>
                {cat}
                <span style={{fontSize:'12px',color:'var(--text3)',fontWeight:'400'}}>({speseByCat[cat].length})</span>
              </span>
              <span style={{fontWeight:'700',color:'var(--red)'}}>{formatEuro(amt)}</span>
            </div>
            {expandedCats[cat] && (
              <div style={{marginTop:'6px',paddingLeft:'8px'}}>
                {speseByCat[cat].map(s => (
                  <div className="spesa-item" key={s.id}>
                    <div style={{flex:1}}>
                      <div className="spesa-desc">{s.desc}</div>
                      <div className="spesa-cat">{formatDataIT(s.date)}{s.subcat ? ` · ${s.subcat}` : ''}</div>
                    </div>
                    <div className="spesa-amount">{formatEuro(s.amount)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
        {totale > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Totale movimenti</span><span style={{color:'var(--red)'}}>{formatEuro(totale)}</span>
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-title">🏷️ Spese per descrizione</div>
        {descSort.length === 0 && <div className="empty">Nessuna spesa questo mese</div>}
        {descSort.map(([desc, amt]) => (
          <div className="spesa-item" key={desc}>
            <div style={{flex:1}}>
              <div className="spesa-desc">{desc}</div>
            </div>
            <div className="spesa-amount">{formatEuro(amt)}</div>
          </div>
        ))}
        {totale > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Totale</span><span style={{color:'var(--red)'}}>{formatEuro(totale)}</span>
          </div>
        )}
      </div>

      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0}}>🧾 Storico scadenze pagate</div>
          <button className="btn small" onClick={() => setScadFiltroMese(v => !v)}>
            {scadFiltroMese ? `📅 ${monthLabel(year, month)}` : '📋 Tutto lo storico'}
          </button>
        </div>
        {scadenzePagate.length === 0 && <div className="empty">Nessuna scadenza pagata{scadFiltroMese ? ' in questo mese' : ''}</div>}
        {mesiPagateOrdinati.map(chiaveMese => {
          const [meseAnno, meseNum] = chiaveMese.split('-').map(Number);
          const rateDelMese = scadPagateByMese[chiaveMese];
          const totMese = rateDelMese.reduce((a, s) => a + Number(s.amount || 0), 0);
          return (
            <div key={chiaveMese} style={{border:'2px solid var(--green)',borderRadius:'14px',padding:'10px',marginBottom:'12px'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'2px 6px 8px'}}>
                <span style={{fontSize:'11px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'0.07em',color:'var(--green)'}}>
                  {monthLabel(meseAnno, meseNum)}
                </span>
                <span style={{fontSize:'12px',fontWeight:'700',color:'var(--green)'}}>{formatEuro(totMese)}</span>
              </div>
              {rateDelMese.map(s => (
                <div className="scad-item pagato" key={s.id}>
                  <div className="scad-info">
                    <div className="scad-name">{s.nome} {s.numerata && s.rataNum ? <span style={{fontSize:'11px',color:'var(--accent-dark)',fontWeight:'700'}}>Rata {s.rataNum}</span> : null}</div>
                    <div className="scad-date">
                      Scadenza: {formatDataIT(s.date)}
                      {s.dataPagamento && <span> · Pagata il {formatDataIT(s.dataPagamento)}</span>}
                    </div>
                  </div>
                  <div className="scad-amount">{s.amount ? formatEuro(s.amount) : ''}</div>
                </div>
              ))}
            </div>
          );
        })}
        {scadenzePagate.length > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Totale</span><span style={{color:'var(--green)'}}>{formatEuro(totScadPagate)}</span>
          </div>
        )}
      </div>

      <div className="card" style={{background:'var(--salmon-bg)',borderColor:'var(--salmon-border)'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0,color:'var(--salmon)'}}>🍱 Buoni Pasto</div>
          <button className="btn small" style={{borderColor:'var(--salmon)',color:'var(--salmon)'}} onClick={() => setShowBP(v => !v)}>
            {showBP ? '✕ Annulla' : '+ Aggiungi'}
          </button>
        </div>
        <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'12px',lineHeight:'1.5'}}>
          Dato puramente informativo: i buoni pasto non vengono pagati, quindi <strong>non sono conteggiati</strong> in nessun totale di Budget o Report.
        </div>

        <div style={{background:'#fff',border:'1px solid var(--salmon-border)',borderRadius:'10px',padding:'12px 14px',marginBottom:'14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:'12px',color:'var(--text3)'}}>Saldo residuo (ricevuti − spesi, storico completo)</div>
            <div style={{fontSize:'20px',fontWeight:'800',color:'var(--salmon)'}}>{formatEuro(saldoBP)}</div>
          </div>
          <div style={{textAlign:'right',fontSize:'13px',color:'var(--text2)'}}>
            ≈ {qtyResidua.toFixed(2)} buoni<br/>
            <span style={{fontSize:'11px',color:'var(--text3)'}}>1 buono = {formatEuro(VALORE_BUONO_PASTO)}</span>
          </div>
        </div>

        {showBP && (
          <div className="add-spesa-form" style={{background:'#fff',borderColor:'var(--salmon-border)'}}>
            <div className="form-row">
              <div className="form-group">
                <label>Tipo movimento</label>
                <select value={formBP.tipo} onChange={e => setFormBP(f => ({...f, tipo: e.target.value}))}>
                  <option value="ricevuto">➕ Ricevuto (entrata)</option>
                  <option value="speso">➖ Speso (uscita)</option>
                </select>
              </div>
              <div className="form-group" style={{flex:2}}>
                <label>Descrizione</label>
                <input type="text" placeholder="Es. Accredito mensile lavoro" value={formBP.desc} onChange={e => setFormBP(f => ({...f, desc: e.target.value}))} />
              </div>
            </div>
            <div className="form-row" style={{alignItems:'flex-end'}}>
              <div className="form-group">
                <label>Quantità (unità)</label>
                <input type="text" inputMode="numeric" pattern="[0-9]*" placeholder="Es. 20" value={formBP.qty} onChange={e => setFormBPQty(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Valore €</label>
                <input type="text" inputMode="decimal" placeholder="0,00" value={formBP.amount} onChange={e => setFormBPAmount(e.target.value)} />
              </div>
              {formBP.qty !== '' && (
                <div style={{display:'flex',alignItems:'center',paddingBottom:'2px'}}>
                  <span style={{fontSize:'15px',fontWeight:'800',color:'var(--salmon)',background:'#fff',border:'1.5px solid var(--salmon)',borderRadius:'20px',padding:'6px 14px',whiteSpace:'nowrap'}}>
                    🍱 {formBP.qty} buon{importoIT(formBP.qty) === 1 ? 'o' : 'i'}
                  </span>
                </div>
              )}
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Data</label>
                <input type="date" value={formBP.date} onChange={e => setFormBP(f => ({...f, date: e.target.value}))} />
              </div>
            </div>
            <button className="btn" style={{background:'var(--salmon)',borderColor:'var(--salmon)',color:'#fff'}} onClick={addBP}>💾 Salva movimento</button>
          </div>
        )}

        {buoniPastoMese.length === 0 && <div className="empty">Nessun movimento in {monthLabel(year, month)}</div>}
        {buoniPastoMese.map(b => {
          const isSpeso = b.tipo === 'speso';
          return (
            <div className="spesa-item" key={b.id} style={{borderColor:'var(--salmon-border)'}}>
              <div style={{flex:1}}>
                <div className="spesa-desc" style={{color:'var(--salmon)',display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}}>
                  <span>{isSpeso ? '➖' : '➕'} {b.desc}</span>
                  {b.qty ? <span style={{fontSize:'12px',fontWeight:'800',color:'var(--salmon)',background:'#fff',border:'1.5px solid var(--salmon)',borderRadius:'20px',padding:'2px 10px',whiteSpace:'nowrap'}}>🍱 {b.qty} buon{b.qty === 1 ? 'o' : 'i'}</span> : null}
                </div>
                <div className="spesa-cat">{formatDataIT(b.date)}</div>
              </div>
              <div className="spesa-amount" style={{color:'var(--salmon)'}}>{isSpeso ? '−' : '+'}{formatEuro(b.amount)}</div>
              <button className="spesa-delete" onClick={() => delBP(b)}>🗑</button>
            </div>
          );
        })}
        {buoniPastoMese.length > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--salmon-border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Movimento del mese (informativo, non incluso nei totali)</span><span style={{color:'var(--salmon)'}}>{formatEuro(totBuoniPasto)}</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ── IMPOSTAZIONI TAB ───────────────────────────────────────────────────────────
// Valori di default per gli orari/intervalli delle notifiche scadenze, usati finché
// Giorgio non li personalizza dalla tab Impostazioni.
const DEFAULT_NOTIFICHE = { orario: '10:00', intervalloOre: '3', fasciaInizio: '08:00', fasciaFine: '20:00' };

function ImpostazioniTab({ data, saveData, applyUpdate }) {
  const [newCat, setNewCat] = useState('');
  const [newTappa, setNewTappa] = useState('');
  const [newProdotto, setNewProdotto] = useState('');
  // Attivazione notifiche push su questo dispositivo: stato del pulsante e messaggio
  // d'errore da mostrare se qualcosa va storto (es. permesso negato).
  const [notifStato, setNotifStato] = useState('idle'); // idle | loading | ok | errore
  const [notifMsg, setNotifMsg] = useState('');
  async function handleAttivaNotifiche() {
    setNotifStato('loading');
    setNotifMsg('');
    const risultato = await attivaNotifichePush();
    if (risultato.ok) {
      await applyUpdate({ notificheTokens: firebase.firestore.FieldValue.arrayUnion(risultato.token) });
      setNotifStato('ok');
    } else {
      setNotifStato('errore');
      setNotifMsg(risultato.motivo || 'Errore sconosciuto.');
    }
  }
  const permessoAttuale = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported';
  // Impostazioni notifiche scadenze: orario base per l'avviso giorno-prima/giorno-stesso,
  // e intervallo/fascia oraria per la ripetizione extra delle scadenze marcate "prioritarie".
  const [notificheForm, setNotificheForm] = useState({ ...DEFAULT_NOTIFICHE, ...(data.notificheImpostazioni || {}) });
  function salvaNotificheCampo(campo, valore) {
    const aggiornate = { ...notificheForm, [campo]: valore };
    setNotificheForm(aggiornate);
    saveData({ notificheImpostazioni: aggiornate });
  }

  function addCat() {
    if (!newCat.trim()) return;
    saveData({ categorie: [...(data.categorie || DEFAULT_CATS), newCat.trim()] });
    setNewCat('');
  }
  function delCat(c) {
    saveData({ categorie: (data.categorie || DEFAULT_CATS).filter(x => x !== c) });
  }
  // Categorie usate nella Lista della spesa (es. Frutta e Verdura, Latticini...): elenco
  // separato da "categorie" del Budget, perché classificano il TIPO di prodotto alimentare
  // e non la voce di spesa familiare. Prima si potevano gestire solo scrivendole nel form
  // della Lista della spesa; qui si possono aggiungere/eliminare a mente fredda.
  const [newCatSpesa, setNewCatSpesa] = useState('');
  function addCatSpesa() {
    if (!newCatSpesa.trim()) return;
    saveData({ categorieLista: [...(data.categorieLista || DEFAULT_SPESA_CATS), newCatSpesa.trim()] });
    setNewCatSpesa('');
  }
  function delCatSpesa(c) {
    saveData({ categorieLista: (data.categorieLista || DEFAULT_SPESA_CATS).filter(x => x !== c) });
  }
  // Database Prodotti: stesso elenco (storicoProdotti) che alimenta il completamento
  // automatico del campo "Prodotto" nella Lista della spesa. Un prodotto scritto per la
  // prima volta lì si aggiunge da solo qui; da qui puoi anche ripulirlo manualmente
  // (es. refusi o articoli che non comprerai più) o aggiungerne uno in anticipo.
  function addProdotto() {
    if (!newProdotto.trim()) return;
    const attuali = data.storicoProdotti || [];
    if (!attuali.includes(newProdotto.trim())) {
      saveData({ storicoProdotti: [...attuali, newProdotto.trim()] });
    }
    setNewProdotto('');
  }
  function delProdotto(p) {
    saveData({ storicoProdotti: (data.storicoProdotti || []).filter(x => x !== p) });
  }
  function addTappa() {
    if (!newTappa.trim()) return;
    saveData({ tappeLista: [...(data.tappeLista || DEFAULT_TAPPE), newTappa.trim()] });
    setNewTappa('');
  }
  // Categoria Budget di ogni negozio (v54): dove finisce lo scontrino con "Registra spesa"
  function catBudgetNegozio(t) {
    const mappa = data.tappeCategorieBudget || {};
    return mappa[t] || categoriaBudgetDefault(t, data.categorie || DEFAULT_CATS);
  }
  function setCatBudgetNegozio(t, cat) {
    saveData({ tappeCategorieBudget: { ...(data.tappeCategorieBudget || {}), [t]: cat } });
  }
  function delTappa(t) {
    saveData({ tappeLista: (data.tappeLista || DEFAULT_TAPPE).filter(x => x !== t) });
  }
  // Riordino delle tappe tramite numero digitato (invece delle freccette ▲▼):
  // l'ORDINE di questo elenco è quello che la Lista della spesa usa per raggruppare
  // gli articoli (prima tappa dell'elenco = prima da fare), quindi cambiare qui il
  // numero di posizione di una tappa equivale a spostarla nel percorso del giro di spesa.
  // Bozza locale mentre si digita: il riordino vero e proprio avviene su blur/Invio
  // oppure (v56) da solo 1 secondo dopo l'ultima cifra, e comunque se si lascia la
  // schermata Impostazioni. Prima, uscendo da Impostazioni senza "chiudere" il campo,
  // il numero restava solo a video e non veniva salvato: per questo l'ordine della
  // barra gialla Tappe poteva non corrispondere a quello visto qui.
  const [tappaPosDrafts, setTappaPosDrafts] = useState({});
  const tappaPosTimers = useRef({});
  const tappaPosRef = useRef({ drafts: {}, commit: null });
  function tappaPosVal(t, idx) {
    return tappaPosDrafts[t] !== undefined ? tappaPosDrafts[t] : String(idx + 1);
  }
  function setTappaPosDraft(t, val) {
    setTappaPosDrafts(d => ({ ...d, [t]: val }));
    clearTimeout(tappaPosTimers.current[t]);
    tappaPosTimers.current[t] = setTimeout(() => {
      if (tappaPosRef.current.commit) tappaPosRef.current.commit(t);
    }, 1000);
  }
  function commitTappaPos(t) {
    clearTimeout(tappaPosTimers.current[t]);
    const raw = tappaPosRef.current.drafts[t];
    setTappaPosDrafts(d => { const p = { ...d }; delete p[t]; return p; });
    if (raw === undefined) return;
    const lista = [...(data.tappeLista || DEFAULT_TAPPE)];
    const idx = lista.indexOf(t);
    if (idx < 0) return;
    let nuovaPos = parseInt(raw, 10);
    if (isNaN(nuovaPos)) return;
    nuovaPos = Math.max(1, Math.min(lista.length, nuovaPos));
    const targetIdx = nuovaPos - 1;
    if (targetIdx === idx) return;
    const [item] = lista.splice(idx, 1);
    lista.splice(targetIdx, 0, item);
    saveData({ tappeLista: lista });
  }
  tappaPosRef.current.drafts = tappaPosDrafts;
  tappaPosRef.current.commit = commitTappaPos;
  // Uscendo da Impostazioni: salva subito l'eventuale numero rimasto in sospeso
  useEffect(() => () => {
    Object.values(tappaPosTimers.current).forEach(clearTimeout);
    const r = tappaPosRef.current;
    Object.keys(r.drafts).forEach(t => r.commit && r.commit(t));
  }, []);

  return (
    <div className="section active">
      <div className="card">
        <div className="setting-section">
          <div className="setting-label">Categorie Spese Budget</div>
          <div>{(data.categorie || DEFAULT_CATS).map(c => (
            <span className="cat-chip" key={c}>{c}<button onClick={() => delCat(c)}>✕</button></span>
          ))}</div>
          <div className="form-row" style={{marginTop:'10px'}}>
            <input type="text" placeholder="Nuova categoria..." value={newCat} onChange={e => setNewCat(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCat()} style={{flex:1}} />
            <button className="btn primary" onClick={addCat}>Aggiungi</button>
          </div>
        </div>

        <div className="setting-section" style={{marginTop:'20px'}}>
          <div className="setting-label">Database Prodotti</div>
          <div style={{fontSize:'12px',color:'var(--text3)',marginBottom:'8px'}}>
            Elenco dei prodotti già scritti nella Lista della spesa: quando digiti un prodotto nuovo lì, si aggiunge qui da solo; da qui puoi anche ripulire refusi o aggiungerne uno in anticipo. Questo elenco è quello usato per i suggerimenti del campo "Prodotto".
          </div>
          <div>{[...(data.storicoProdotti || [])].sort((a, b) => a.localeCompare(b, 'it')).map(p => (
            <span className="cat-chip" key={p}>{p}<button onClick={() => delProdotto(p)}>✕</button></span>
          ))}</div>
          {(!data.storicoProdotti || data.storicoProdotti.length === 0) && <div className="empty" style={{padding:'12px'}}>Ancora nessun prodotto registrato</div>}
          <div className="form-row" style={{marginTop:'10px'}}>
            <input type="text" placeholder="Nuovo prodotto..." value={newProdotto} onChange={e => setNewProdotto(e.target.value)} onKeyDown={e => e.key === 'Enter' && addProdotto()} style={{flex:1}} />
            <button className="btn primary" onClick={addProdotto}>Aggiungi</button>
          </div>
        </div>

        <div className="setting-section" style={{marginTop:'20px'}}>
          <div className="setting-label">Negozi del giro spesa</div>
          <div style={{fontSize:'12px',color:'var(--text3)',marginBottom:'8px'}}>L'ordine qui sotto è quello del tuo giro di spesa: il primo negozio è quello da fare per primo (scrivi il numero per spostarlo). Accanto a ogni negozio scegli in quale categoria del Budget finisce il suo scontrino quando premi "Registra spesa".</div>
          <div>{(data.tappeLista || DEFAULT_TAPPE).map((t, idx, arr) => (
            <div key={t} style={{display:'flex',alignItems:'center',gap:'8px',background:'var(--surface2)',border:'1px solid var(--border2)',borderRadius:'8px',padding:'8px 10px',marginBottom:'6px'}}>
              <input
                type="text"
                inputMode="numeric"
                pattern="[0-9]*"
                value={tappaPosVal(t, idx)}
                onChange={e => setTappaPosDraft(t, e.target.value)}
                onBlur={() => commitTappaPos(t)}
                onKeyDown={e => e.key === 'Enter' && e.target.blur()}
                style={{width:'44px',padding:'6px 4px',fontSize:'13px',textAlign:'center',flexShrink:0}}
                title="Posizione nel giro di spesa"
              />
              <span style={{flex:1,fontSize:'15px',minWidth:0,overflowWrap:'anywhere'}}>{t}</span>
              <select value={catBudgetNegozio(t)} onChange={e => setCatBudgetNegozio(t, e.target.value)} title="Categoria Budget" style={{width:'112px',flexShrink:0,fontSize:'16px',padding:'6px 4px'}}>
                {(data.categorie || DEFAULT_CATS).map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <button className="btn small danger" onClick={() => delTappa(t)} title="Elimina negozio">✕</button>
            </div>
          ))}</div>
          <div className="form-row" style={{marginTop:'10px'}}>
            <input type="text" placeholder="Nuovo negozio..." value={newTappa} onChange={e => setNewTappa(e.target.value)} onKeyDown={e => e.key === 'Enter' && addTappa()} style={{flex:1}} />
            <button className="btn primary" onClick={addTappa}>Aggiungi</button>
          </div>
        </div>
      </div>

      <div className="card" style={{marginTop:'8px'}}>
        <div className="setting-label" style={{marginBottom:'8px'}}>🔔 Notifiche scadenze</div>
        <div style={{fontSize:'12px',color:'var(--text3)',marginBottom:'14px',lineHeight:'1.5'}}>
          Ogni scadenza avvisa il giorno prima e il giorno stesso, all'orario base qui sotto.
          Le scadenze marcate 🔔 <strong>Prioritaria</strong> (dalla tab Scadenze) ripetono l'avviso
          ogni tot ore, solo nella fascia oraria che indichi.
        </div>
        <div className="form-row">
          <div className="form-group">
            <label>Orario avviso base</label>
            <input type="time" value={notificheForm.orario} onChange={e => salvaNotificheCampo('orario', e.target.value)} />
          </div>
          <div className="form-group">
            <label>Ripeti ogni (ore, solo prioritarie)</label>
            <input type="text" inputMode="numeric" pattern="[0-9]*" value={notificheForm.intervalloOre} onChange={e => setNotificheForm(f => ({...f, intervalloOre: e.target.value}))} onBlur={() => salvaNotificheCampo('intervalloOre', notificheForm.intervalloOre)} onKeyDown={e => e.key === 'Enter' && e.target.blur()} />
          </div>
        </div>
        <div className="form-row">
          <div className="form-group">
            <label>Fascia oraria ripetizioni — da</label>
            <input type="time" value={notificheForm.fasciaInizio} onChange={e => salvaNotificheCampo('fasciaInizio', e.target.value)} />
          </div>
          <div className="form-group">
            <label>a</label>
            <input type="time" value={notificheForm.fasciaFine} onChange={e => salvaNotificheCampo('fasciaFine', e.target.value)} />
          </div>
        </div>

        <div style={{marginTop:'16px',paddingTop:'16px',borderTop:'1px solid var(--border)'}}>
          <div style={{fontSize:'13px',fontWeight:'700',marginBottom:'8px'}}>Notifiche su questo dispositivo</div>
          <div style={{fontSize:'12px',color:'var(--text3)',marginBottom:'10px',lineHeight:'1.5'}}>
            {permessoAttuale === 'granted' && '✅ Le notifiche sono attive su questo dispositivo/browser.'}
            {permessoAttuale === 'denied' && '🚫 Le notifiche sono bloccate. Per riattivarle vai in Impostazioni iOS → FCC (o Safari) → Notifiche.'}
            {(permessoAttuale === 'default' || permessoAttuale === 'unsupported') && 'Le notifiche non sono ancora attive su questo dispositivo. Su iPhone funzionano solo se hai aggiunto FCC alla schermata Home (non nel browser Safari) e hai iOS 16.4 o superiore.'}
          </div>
          <button className="btn primary small" onClick={handleAttivaNotifiche} disabled={notifStato === 'loading'}>
            {notifStato === 'loading' ? 'Attivazione...' : '🔔 Attiva notifiche su questo dispositivo'}
          </button>
          {notifStato === 'ok' && <div style={{fontSize:'12px',color:'var(--green)',marginTop:'8px'}}>✅ Notifiche attivate su questo dispositivo.</div>}
          {notifStato === 'errore' && <div style={{fontSize:'12px',color:'var(--red)',marginTop:'8px'}}>{notifMsg}</div>}
        </div>
      </div>

      <div className="card" style={{marginTop:'8px'}}>
        <div className="setting-label" style={{marginBottom:'8px'}}>ℹ️ Informazioni</div>
        <div style={{fontSize:'13px',color:'var(--text2)',lineHeight:'1.6'}}>
          <p>I dati sono sincronizzati automaticamente via Firebase.</p>
          <p style={{marginTop:'6px'}}>Repository: <code style={{background:'var(--surface2)',padding:'1px 6px',borderRadius:'4px'}}>giorgiolucciola-lang/fcc</code></p>
        </div>
      </div>
    </div>
  );
}

// ── RENDER ─────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/fcc/sw.js').catch(() => {});
  });
}
</script>
</body>
