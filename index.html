<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Control Center</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9B59B6">
<!-- Librerie ospitate in locale (cartella /vendor) per funzionamento offline -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<!-- Firebase (locale) -->
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="vendor/firebase-messaging-compat.js"></script>
<style>
:root {
  --bg: #f8f5fc;
  --surface: #ffffff;
  --surface2: #f2edf8;
  --border: #e2d9f0;
  --border2: #c8b8e0;
  --accent: #9B59B6;
  --accent-light: #f0e8f8;
  --accent-dark: #7d3f9e;
  --text: #1a1520;
  --text2: #6a5878;
  --text3: #8a7799;
  --green: #16c462;
  --green-bg: #eafaf1;
  --green-border: #a9dfbf;
  --red: #e8312b;
  --red-bg: #fdf0ee;
  --red-border: #e8b0a8;
  --orange: #ff9f1c;
  --giallo: #c99a06;
  --giallo-bg: #fdf6e0;
  --giallo-border: #e8d38a;
  --orange-bg: #fef5ec;
  --salmon: #e2685a;
  --salmon-bg: #fff1ef;
  --salmon-border: #f5c2ba;
  --blue: #2f7dd1;
  --blue-bg: #eaf2fb;
  --blue-border: #a9c9ec;
  --radius: 10px;
  --shadow: 0 2px 8px rgba(155,89,182,0.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* NAV */
nav {
  background: var(--accent);
  padding: 0;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(155,89,182,0.3);
}
.nav-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  max-width: 700px; margin: 0 auto;
}
.nav-title { color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 0.3px; display: flex; align-items: baseline; gap: 6px; }
.nav-version {
  color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 0.3px;
  background: rgba(255,255,255,0.22); padding: 2px 9px; border-radius: 10px;
}
.nav-user { color: rgba(255,255,255,0.85); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.nav-tabs {
  display: flex; overflow-x: auto;
  padding: 0 8px 0;
  gap: 2px;
  scrollbar-width: none;
  max-width: 684px; margin: 0 auto;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 9px 14px; border: none; background: transparent;
  color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 500;
  cursor: pointer; border-bottom: 3px solid transparent;
  white-space: nowrap; transition: all 0.2s; flex-shrink: 0;
}
.tab-btn:hover { color: #fff; }
.tab-btn.active { color: #fff; border-bottom-color: #fff; }

/* SYNC BTN */
.sync-btn {
  padding: 5px 11px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.5);
  background: transparent; color: #fff;
  font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.sync-btn:hover { background: rgba(255,255,255,0.15); }
.sync-btn.syncing { opacity: 0.6; }
.print-btn {
  padding: 5px 11px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.5);
  background: transparent; color: #fff;
  font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.print-btn:hover { background: rgba(255,255,255,0.15); }

/* STAMPA: nasconde menu/pulsanti e mostra solo il contenuto della scheda attiva */
@media print {
  nav, .btn, .print-btn, .sync-btn, .spesa-delete, .tab-btn,
  .add-spesa-form, input, select { display: none !important; }
  body { background: #fff; color: #000; }
  .section { display: none; padding: 0; }
  .section.active { display: block !important; max-width: 100%; }
  .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; margin-bottom: 10px; }
  .print-title { display: block !important; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
}
.print-title { display: none; }

/* LAYOUT */
.section { display: none; padding: 16px; max-width: 700px; margin: 0 auto; }
.section.active { display: block; }

/* CARDS */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text); }

/* FORM ELEMENTS */
.form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.form-row label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); display: block; margin-bottom: 4px; }
.form-group { display: flex; flex-direction: column; flex: 1; min-width: 100px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  padding: 9px 12px; background: #ffffff;
  border: 1px solid var(--border2); border-radius: 8px;
  color: var(--text); font-size: 15px; font-family: inherit;
  outline: none; width: 100%; transition: background-color 0.2s, border-color 0.2s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #fff; }
/* Campi data: ingranditi rispetto agli altri input, per renderli più leggibili e più
   facili da toccare (richiesta di Giorgio: "calendari più grandi e più visibili") */
input[type=date] { padding: 12px 12px; font-size: 17px; min-height: 46px; }
/* Campo compilato: sfondo verdino, come le entrate (solo un vezzo estetico) */
input[type=text]:not(:placeholder-shown):not(:focus),
input[type=number]:not(:placeholder-shown):not(:focus) {
  background: var(--green-bg); border-color: var(--green-border);
}
select:required:valid:not(:focus) {
  background: var(--green-bg); border-color: var(--green-border);
}

/* BUTTONS */
.btn {
  padding: 8px 16px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--surface);
  color: var(--text); font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn.danger { border-color: var(--red-border); color: var(--red); }
.btn.danger:hover { background: var(--red-bg); }
.btn.small { padding: 4px 10px; font-size: 12px; }

/* BUDGET TAB */
.budget-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
}
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-nav button { background: none; border: 1px solid var(--border2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 16px; color: var(--text2); }
.month-nav button:hover { border-color: var(--accent); color: var(--accent); }
.month-label { font-size: 16px; font-weight: 600; min-width: 140px; text-align: center; }

.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.summary-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 12px; text-align: center;
  box-shadow: var(--shadow);
}
.summary-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 6px; }
.summary-card .amount { font-size: 20px; font-weight: 700; }
.summary-card.entrate .amount { color: var(--green); }
.summary-card.uscite .amount { color: var(--red); }
.summary-card.saldo .amount { color: var(--accent); }
.uscite-split { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border2); font-size: 11px; color: var(--text2); }
.uscite-split div { display: flex; justify-content: space-between; gap: 4px; line-height: 1.6; }
.uscite-split span:last-child { font-weight: 600; white-space: nowrap; }
.scad-tipo-box { border: 1.5px solid var(--border2); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
.scad-tipo-header { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 13px; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
.scad-tipo-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.scad-tipo-row + .scad-tipo-row { border-top: 1px solid var(--border); }

/* SPESE per giorno */
.day-group { margin-bottom: 18px; }
.day-header {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--accent);
  color: #fff;
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.day-header .day-total {
  margin-left: auto;
  font-size: 13px; font-weight: 700;
  opacity: 0.9;
}
.spesa-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 14px;
}
.spesa-cat { font-size: 11px; color: var(--text3); }
.spesa-desc { flex: 1 1 120px; font-weight: 500; min-width: 0; }
.spesa-amount { font-weight: 700; color: var(--red); white-space: nowrap; }
.spesa-delete { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 17px; padding: 6px 8px; border-radius: 6px; }
.spesa-delete:hover { color: var(--red); background: var(--red-bg); }

.add-spesa-form {
  background: var(--accent-light); border: 1px solid var(--border2);
  border-radius: 12px; padding: 14px; margin-bottom: 16px;
}

/* SCADENZE */
.scad-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 8px;
}
.scad-item.pagato { opacity: 0.85; }
.scad-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.scad-dot.verde { background: var(--green); }
.scad-dot.arancio { background: var(--orange); }
.scad-dot.rosso { background: var(--red); }
.scad-dot.giallo { background: #f4d03f; box-shadow: 0 0 0 2px rgba(244,208,63,0.35); }
.scad-info { flex: 1 1 150px; min-width: 0; }
.scad-name { font-size: 14px; font-weight: 600; }
.scad-date { font-size: 12px; color: var(--text3); }
.scad-amount { font-weight: 700; font-size: 15px; }
.scad-actions {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  justify-content: flex-end; margin-left: auto;
}

/* LISTA DELLA SPESA COMPATTA (v54) — caratteri grandi per iPhone; tutti i campi
   hanno font ≥16px, altrimenti iOS ingrandisce la pagina quando li tocchi */
.ls-tappe { background: var(--giallo-bg); border: 1.5px solid var(--giallo-border); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
.ls-tappe.completo { background: var(--green-bg); border-color: var(--green); }
.ls-tappe-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: #8a6a00; }
.ls-tappe.completo .ls-tappe-head { color: #0e7a3d; }
.ls-tappe-sub { font-size: 14px; color: #0e7a3d; margin-top: 4px; }
.ls-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ls-chip { font-family: inherit; cursor: pointer; font-size: 15px; padding: 6px 12px; border-radius: 8px; background: #fff; border: 1px solid var(--giallo-border); color: var(--text); }
.ls-chip.fatta { background: var(--green-bg); border-color: var(--green-border); color: #0e7a3d; font-weight: 600; }
.ls-add { background: var(--accent-light); border: 1px solid var(--border2); border-radius: 12px; padding: 10px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
.ls-add-row { display: flex; gap: 8px; }
.ls-input, input.ls-input[type=text], select.ls-input { font-size: 17px; padding: 10px 10px; min-height: 46px; }
.ls-add-qta { width: 90px !important; flex-shrink: 0; }
.ls-add-negozio { flex: 1; min-width: 0; }
.ls-add-btn { font-size: 24px; padding: 0 16px; min-width: 52px; line-height: 1; }
.ls-orfano { background: var(--orange-bg); border-radius: 8px; padding: 8px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--text2); }
.ls-negozio { scroll-margin-top: 110px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px 12px 10px; margin-bottom: 12px; }
.ls-negozio.fatto { border-color: var(--green-border); background: #fbfefc; }
.ls-negozio-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: var(--accent-dark); padding: 10px 0 6px; border-bottom: 1px solid var(--border); }
.ls-negozio.fatto .ls-negozio-head { color: #0e7a3d; }
.ls-negozio-count { font-size: 14px; font-weight: 600; color: var(--text2); white-space: nowrap; }
.ls-negozio.fatto .ls-negozio-count { color: #0e7a3d; }
.ls-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); min-height: 54px; }
.ls-check { width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; border: 2px solid var(--border2); background: #fff; color: #fff; font-size: 22px; font-weight: 700; line-height: 1; cursor: pointer; padding: 0; }
.ls-item.presa .ls-check { background: var(--green); border-color: var(--green); }
.ls-nome { flex: 1; min-width: 0; font-size: 18px; color: var(--text); overflow-wrap: anywhere; }
.ls-nome-btn { background: none; border: none; padding: 4px 0; text-align: left; font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ls-sposta { display: flex; align-items: center; gap: 8px; background: var(--accent-light); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; margin: 4px 0 6px; }
.ls-sposta select { flex: 1; min-width: 0; }
.ls-sposta-label { font-size: 14px; color: var(--text2); white-space: nowrap; }
.ls-sugg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ls-chip { font-size: 15px; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-family: inherit; }
.ls-chip.attivo { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.ls-nuovo-neg { border: 2px solid var(--accent) !important; }
.ls-item.presa .ls-nome { color: var(--text3); text-decoration: line-through; }
input.ls-qta[type=text] { width: 78px; flex-shrink: 0; font-size: 16px; padding: 7px 6px; text-align: center; color: var(--text2); background: var(--surface2); border-color: var(--border); }
.ls-del { background: none; border: none; color: var(--text3); font-size: 18px; padding: 8px 2px 8px 6px; cursor: pointer; flex-shrink: 0; }
.ls-cassa { display: flex; gap: 10px; padding-top: 10px; }
.ls-cassa label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; font-weight: 600; color: var(--text2); }
.btn.primary.ls-registra { width: 100%; color: #fff; font-size: 17px; padding: 14px; background: var(--green); border-color: var(--green); }

/* REPORT */
.report-cat-bar { margin-bottom: 10px; }
.report-cat-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.bar-bg { height: 8px; background: var(--border); border-radius: 4px; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s; }

/* IMPOSTAZIONI */
.setting-section { margin-bottom: 20px; }
.setting-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 10px; }
.cat-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 20px; padding: 4px 10px; margin: 4px;
  font-size: 13px;
}
.cat-chip button { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 14px; line-height: 1; }
.cat-chip button:hover { color: var(--red); }

/* LOGIN */
.login-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 80vh; gap: 20px; padding: 24px;
  text-align: center;
}
.login-title { font-size: 28px; font-weight: 700; color: var(--accent); }
.login-sub { color: var(--text2); font-size: 15px; max-width: 300px; }
.btn-google {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 24px; border-radius: 10px;
  border: 1px solid var(--border2); background: var(--surface);
  font-size: 15px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shadow); transition: all 0.2s;
}
.btn-google:hover { box-shadow: 0 4px 16px rgba(155,89,182,0.15); border-color: var(--accent); }

.empty { text-align: center; color: var(--text3); padding: 32px 16px; font-size: 14px; }

/* RIQUADRO DI CONFERMA PERSONALIZZATO ────────────────────────────────────────
   Sostituisce window.confirm(): su iOS, quando l'app è aperta dall'icona
   installata sulla schermata Home (modalità "standalone"), i riquadri nativi
   confirm/alert spesso NON vengono mostrati e il codice riceve comunque "OK"
   senza che l'utente veda nulla, causando cancellazioni indesiderate. Questo
   riquadro è disegnato dall'app stessa, quindi funziona sempre, anche da app
   installata. */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(26,21,32,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.confirm-box {
  background: #fff; border-radius: 14px; padding: 22px 20px;
  max-width: 340px; width: 100%; box-shadow: 0 8px 32px rgba(26,21,32,0.25);
  text-align: center;
}
.confirm-msg { font-size: 15px; color: var(--text); margin-bottom: 18px; line-height: 1.5; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-actions .btn { flex: 1; }
.badge-entrata { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); border-radius: 5px; font-size: 11px; font-weight: 600; padding: 2px 6px; }
.badge-uscita { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); border-radius: 5px; font-size: 11px; font-weight: 600; padding: 2px 6px; }

/* Entrate list */
.entrata-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 12px; background: var(--green-bg);
  border: 1px solid var(--green-border); border-radius: 8px;
  margin-bottom: 6px;
}
.entrata-item .spesa-desc { color: var(--green); }
.entrata-item .spesa-amount { color: var(--green); }

/* ── SCHERMI STRETTI (iPhone) ─────────────────────────────────────────── */
@media (max-width: 480px) {
  .nav-top { padding: 9px 12px; }
  .nav-title { font-size: 14px; }
  .nav-credit { display: none; }
  .nav-user { gap: 6px; font-size: 12px; }
  .print-btn, .sync-btn { padding: 6px 10px; font-size: 11px; }
  .nav-tabs { padding: 0 4px 0; }
  .tab-btn { padding: 9px 10px; font-size: 12px; }

  .section { padding: 12px; }
  .card { padding: 13px; }

  .summary-grid { gap: 8px; }
  .summary-card { padding: 11px 6px; }
  .summary-card .label { font-size: 10px; }
  .summary-card .amount { font-size: 16px; word-break: break-word; }
  .uscite-split { font-size: 10px; }
  .uscite-split div { flex-direction: column; align-items: center; gap: 0; line-height: 1.3; margin-bottom: 3px; }

  .month-label { font-size: 14px; min-width: 0; }

  .btn.small { padding: 7px 11px; font-size: 12px; }
  .scad-actions .btn.small { padding: 7px 10px; }

  .form-group { min-width: 90px; }
  input[type=date] { padding: 14px 12px; font-size: 18px; min-height: 50px; }

  .ls-nome { font-size: 18px; }
}
</style>
</head>

<div id="root"></div>
<script type="text/babel">

const APP_VERSION = "v60";

// ⚠️ SOSTITUISCI questi valori con le tue credenziali Firebase

// ── NOTIFICHE PUSH (Cloud Messaging) ─────────────────────────────────────────
// Chiave pubblica generata in Firebase Console → Impostazioni progetto → Cloud
// Messaging → Certificati web push. Serve per autorizzare il browser/telefono a
// registrarsi presso Firebase e ricevere notifiche anche ad app chiusa.
const VAPID_KEY = "BCo3EU98dvNShbsk7h2MJ61ATM6KJDEb9pOZ3QIDqL3VunYmJqVUM0dOdm7ljF487MJ-XD6qpYFOwwAvHUvc52Q";
// Non tutti i browser supportano le notifiche push (es. Safari fuori da una PWA
// installata su iPhone): questo blocco evita che l'intera app si blocchi se
// firebase.messaging() non è disponibile, lasciando "messaging" a null.
let messaging = null;
try {
  if (!firebase.messaging.isSupported || firebase.messaging.isSupported()) {
    messaging = firebase.messaging();
  }
} catch (e) {
  messaging = null;
}
// Chiede il permesso di notifica e, se concesso, registra questo dispositivo presso
// Firebase Cloud Messaging, restituendo un "token" univoco da salvare in Firestore
// (la Cloud Function userà quel token per sapere a chi mandare gli avvisi).
async function attivaNotifichePush() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) {
    return { ok: false, motivo: 'Questo browser non supporta le notifiche push.' };
  }
  if (!messaging) {
    return { ok: false, motivo: 'Le notifiche push non sono disponibili su questo dispositivo/browser (su iPhone servono iOS 16.4+ e l\'app aggiunta alla schermata Home).' };
  }
  try {
    const permesso = await Notification.requestPermission();
    if (permesso !== 'granted') {
      return { ok: false, motivo: 'Permesso di notifica non concesso.' };
    }
    const registration = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
    if (!token) return { ok: false, motivo: 'Impossibile ottenere il token di notifica.' };
    return { ok: true, token };
  } catch (e) {
    return { ok: false, motivo: 'Errore durante l\'attivazione: ' + (e && e.message ? e.message : e) };
  }
}

// ── UTILS ──────────────────────────────────────────────────────────────────────
function localDateStr(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
// Converte una data in formato ISO (yyyy-mm-dd) nel formato italiano breve gg/mm/aaaa
function formatDataIT(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}
function formatEuro(n) {
  return '€ ' + Number(n || 0).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// Converte in numero un valore scritto "all'italiana" (virgola come separatore decimale,
// es. "0,500" o "3,5"): senza questa conversione, JavaScript si ferma alla virgola e legge
// solo la parte intera (es. "0,500" diventa 0 invece di 0.5), causando calcoli sbagliati
// nei totali di quantità × prezzo unitario.
function parseNumIT(v) {
  if (v === null || v === undefined) return NaN;
  const s = String(v).trim().replace(',', '.');
  if (s === '') return NaN;
  return parseFloat(s);
}
// v60: importi scritti col tastierino italiano ("12,50"). Converte in numero (0 se vuoto/non valido)
function importoIT(v) {
  if (typeof v === 'number') return isNaN(v) ? 0 : v;
  const n = parseNumIT(String(v || '').replace(/\./g, (m, i, str) => str.includes(',') ? '' : m));
  return isNaN(n) ? 0 : Math.round(n * 100) / 100;
}
// v60: numero salvato → testo per il campo, con la virgola ("12.5" → "12,5")
function numPerCampo(n) {
  if (n === null || n === undefined || n === '') return '';
  return String(n).replace('.', ',');
}
function monthLabel(y, m) {
  return new Date(y, m - 1, 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
}
function dayLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - date) / 86400000);
  if (diff === 0) return 'Oggi';
  if (diff === 1) return 'Ieri';
  return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
}
// Il parametro "tolleranza" (giorni) permette a scadenze che ammettono un margine di pagamento
// oltre la data naturale (es. Rottamazione Quater: 5 giorni solari extra senza decadenza) di restare
// in stato "giallo" (scaduta ma ancora pagabile senza rischio) invece di passare subito a "rosso",
// finché non sono trascorsi anche quei giorni di tolleranza.
function scadenzaColor(dateStr, tolleranza) {
  const tol = Number(tolleranza || 0);
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((date - today) / 86400000);
  if (diff < 0) {
    if (tol > 0 && -diff <= tol) return 'giallo';
    return 'rosso';
  }
  if (diff <= 5) return 'arancio';
  return 'verde';
}
// Verifica se una data (yyyy-mm-dd) cade nel mese solare corrente (oggi)
function isMeseCorrente(dateStr) {
  const [y, m] = dateStr.split('-').map(Number);
  const oggi = new Date();
  return y === oggi.getFullYear() && m === (oggi.getMonth() + 1);
}
function addMonthsToDateStr(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  date.setMonth(date.getMonth() + n);
  return localDateStr(date);
}
// Aggiunge un numero di giorni a una data (yyyy-mm-dd)
function addDaysToDateStr(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  date.setDate(date.getDate() + n);
  return localDateStr(date);
}
// Ultimo giorno del mese "m" (1-12) dell'anno "y"
function lastDayOfMonthStr(y, m) {
  const date = new Date(y, m, 0); // giorno 0 del mese successivo = ultimo giorno del mese corrente
  return localDateStr(date);
}
// Legge la frequenza di una scadenza in formato unificato { unita, valore, fineMese },
// leggendo sia il formato nuovo (unitaRicorrenza/intervalloValore/fineMese) sia il vecchio
// formato pre-v14 (tipoRicorrenza 'fissa'|'periodica' + intervalloMesi), per compatibilità
// con le scadenze già create in passato.
function normalizzaRicorrenza(s) {
  if (s.unitaRicorrenza) {
    return { unita: s.unitaRicorrenza, valore: Number(s.intervalloValore || 1), fineMese: !!s.fineMese };
  }
  if (s.tipoRicorrenza === 'periodica') return { unita: 'mesi', valore: Number(s.intervalloMesi || 1), fineMese: false };
  return { unita: 'mesi', valore: 1, fineMese: false }; // 'fissa' oppure assente
}
// Calcola la data risultante spostando "valore" unità (giorni o mesi) da una data di partenza.
// Se fineMese è true (solo per unità "mesi"), il risultato viene sempre riportato
// all'ultimo giorno del mese target, calcolato su anno/mese (ignorando il giorno di
// partenza) per evitare il bug di overflow di JavaScript: sommare mesi a un giorno alto
// (es. 31 gennaio + 1 mese) farebbe "sforare" al mese successivo invece di fermarsi a febbraio.
function addIntervalloADataStr(dateStr, unita, valore, fineMese) {
  if (unita === 'giorni') return addDaysToDateStr(dateStr, valore);
  if (fineMese) {
    const [y, m] = dateStr.split('-').map(Number);
    const totale = (m - 1) + valore;
    const targetYear = y + Math.floor(totale / 12);
    const targetMonth = ((totale % 12) + 12) % 12 + 1;
    return lastDayOfMonthStr(targetYear, targetMonth);
  }
  return addMonthsToDateStr(dateStr, valore);
}
// Genera occorrenze future per una scadenza ricorrente, qualunque sia la frequenza
// (ogni N giorni, ogni N mesi, con o senza "sempre fine mese").
// Se la scadenza è "numerata", ogni occorrenza riceve un numero di rata progressivo
// (rataNum), a partire dal numero di rata della scadenza di origine.
function generaOccorrenze(scadenza, count = 12) {
  const occorrenze = [];
  const rataBase = Number(scadenza.rataNum || 1);
  const { unita, valore, fineMese } = normalizzaRicorrenza(scadenza);
  for (let i = 1; i <= count; i++) {
    occorrenze.push({
      id: scadenza.id + i, // id derivato, univoco e stabile
      nome: scadenza.nome,
      amount: scadenza.amount,
      date: addIntervalloADataStr(scadenza.date, unita, valore * i, fineMese),
      ricorrente: true,
      unitaRicorrenza: unita,
      intervalloValore: valore,
      fineMese: fineMese,
      gruppoId: scadenza.id,
      pagato: false,
      numerata: !!scadenza.numerata,
      rataNum: scadenza.numerata ? rataBase + i : null,
      tolleranzaGiorni: Number(scadenza.tolleranzaGiorni || 0),
    });
  }
  return occorrenze;
}

// Tappe (negozi) del giro spesa: servono a sapere quante "fermate" restano da fare

// Nomi prodotto uniformi (v55): iPhone mette la maiuscola iniziale, il Mac no. Qui si
// normalizza sempre: prima lettera maiuscola, il resto come scritto.
function nomeProdotto(s) {
  const t = (s || '').trim().replace(/\s+/g, ' ');
  return t ? t.charAt(0).toLocaleUpperCase('it') + t.slice(1) : '';
}
// Categoria Budget proposta per un negozio, se non è stata scelta in Impostazioni (v54):
// alimentari → Cibo, farmacia → Salute, tutto il resto → Altro (solo se la categoria esiste).
function categoriaBudgetDefault(negozio, categorieBudget) {

  else if (/superm|fruttiv|macell|panific|forno|alimentar|discount|pescher|salumer|ortofrutt|mercato/.test(n)) proposta = 'Cibo';
  if ((categorieBudget || []).includes(proposta)) return proposta;
  return (categorieBudget || []).includes('Altro') ? 'Altro' : ((categorieBudget || [])[0] || 'Altro');
}

function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('budget');
  const [syncing, setSyncing] = useState(false);
  const [data, setData] = useState(null);
  // Riquadro di conferma personalizzato (sostituisce window.confirm, che su iOS
  // in modalità app installata da Home Screen non viene mostrato). askConfirm
  // restituisce una Promise<boolean>, usabile con "await" come window.confirm.
  const [confirmDialog, setConfirmDialog] = useState(null);
  function askConfirm(message) {
    return new Promise(resolve => {
      setConfirmDialog({ message, resolve });
    });
  }
  function risolviConfirm(esito) {
    if (confirmDialog) confirmDialog.resolve(esito);
    setConfirmDialog(null);
  }

  useEffect(() => {
    const timeout = setTimeout(() => setLoading(false), 6000);
    const unsub = auth.onAuthStateChanged(u => {
      clearTimeout(timeout);
      setUser(u || null);
      setLoading(false);
    }, () => {
      clearTimeout(timeout);
      setLoading(false);
    });
    return () => { unsub(); clearTimeout(timeout); };
  }, []);

  useEffect(() => {
    if (!user) return;
    const ref = db.collection('users').doc(user.uid);
    // includeMetadataChanges: true → il listener viene richiamato anche quando
    // cambia solo la "provenienza" dello snapshot (cache locale → server),
    // anche se i dati non sono cambiati. Serve per poter distinguere con
    // certezza un documento davvero inesistente da un semplice "non ancora
    // arrivato dal server" (es. dopo aver svuotato la cache o reinstallato la PWA).
    const unsub = ref.onSnapshot({ includeMetadataChanges: true }, snap => {
      if (snap.exists) {
        setData(snap.data());
      } else if (!snap.metadata.fromCache) {
        // Il server ha confermato che il documento non esiste davvero:
        // solo ora è sicuro creare i dati iniziali vuoti.
        const init = {
          spese: [],
          entrate: [],
          scadenze: [],
          listaSpesa: [],
          categorie: DEFAULT_CATS,
          categorieLista: DEFAULT_SPESA_CATS,
          tappeLista: DEFAULT_TAPPE,
          budgetMensile: 2000,
          buoniPasto: [],
          storicoProdotti: [],
        };
        ref.set(init);
        setData(init);
      }
      // else: lo snapshot "vuoto" arriva dalla cache locale, non dal server.
      // Non facciamo nulla e aspettiamo la conferma reale, per non rischiare
      // di sovrascrivere dati veri già presenti sul server.
    }, () => {
      // Errore di lettura (es. offline senza cache locale): non facciamo nulla,
      // resta la schermata di caricamento invece di creare dati vuoti.
    });
    return unsub;
  }, [user]);

  async function saveData(newData) {
    if (!user) return;
    const merged = { ...data, ...newData };
    setData(merged);
    setSyncing(true);
    try {
      await db.collection('users').doc(user.uid).set(merged);
    } finally {
      setSyncing(false);
    }
  }

  // ── Aggiornamenti "sicuri" per gli elenchi critici (spese, entrate, scadenze, listaSpesa) ──
  // A differenza di saveData (che riscrive TUTTO il documento con i dati che l'app ha in quel
  // momento), queste funzioni usano le operazioni atomiche di Firebase arrayUnion/arrayRemove:
  // agiscono solo sulla singola voce toccata, quindi due salvataggi ravvicinati (anche da
  // dispositivi diversi, anche offline) non possono più cancellarsi a vicenda.
  async function applyUpdate(updateObj) {
    if (!user || !Object.keys(updateObj).length) return;
    setSyncing(true);
    try {
      await db.collection('users').doc(user.uid).update(updateObj);
    } finally {
      setSyncing(false);
    }
  }
  function addItems(field, items) {
    if (!items || !items.length) return Promise.resolve();
    return applyUpdate({ [field]: firebase.firestore.FieldValue.arrayUnion(...items) });
  }
  function removeItems(field, items) {
    if (!items || !items.length) return Promise.resolve();
    return applyUpdate({ [field]: firebase.firestore.FieldValue.arrayRemove(...items) });
  }
  // v60: aggiorna UNA sola voce di una mappa salvata (es. prodottiNegozi["pane"]) senza
  // riscrivere tutto il documento: niente rischio di cancellare modifiche fatte altrove.
  async function aggiornaVoceMappa(campo, chiave, valore) {
    if (!user || !chiave) return;
    setSyncing(true);
    try {
      await db.collection('users').doc(user.uid).update(new firebase.firestore.FieldPath(campo, chiave), valore);
    } finally {
      setSyncing(false);
    }
  }
  // v59: togli + rimetti la voce in UN solo salvataggio (batch). Prima erano due
  // salvataggi separati: tra l'uno e l'altro l'app vedeva per un attimo la voce
  // sparita e poi ricomparsa (sull'iPhone gli ultimi "già presi" lampeggiavano).
  async function updateItem(field, oldItem, newItem) {
    if (!user) return;
    const ref = db.collection('users').doc(user.uid);
    const batch = db.batch();
    batch.update(ref, { [field]: firebase.firestore.FieldValue.arrayRemove(oldItem) });
    batch.update(ref, { [field]: firebase.firestore.FieldValue.arrayUnion(newItem) });
    setSyncing(true);
    try {
      await batch.commit();
    } finally {
      setSyncing(false);
    }
  }

  function login() { auth.signInWithPopup(provider); }
  function logout() { auth.signOut(); setData(null); }

  if (loading) return <div style={{textAlign:'center',padding:'60px',color:'var(--text3)'}}>Caricamento...</div>;

  if (!user) return (
    <div className="login-screen">
      <div style={{fontSize:'48px'}}>💜</div>
      <div className="login-title">Family Control Center</div>
      <div className="login-sub">Accedi per gestire budget, spese, scadenze e lista della spesa</div>
      <button className="btn-google" onClick={login}>
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Accedi con Google
      </button>
    </div>
  );

  if (!data && user) return <div style={{textAlign:'center',padding:'60px',color:'var(--text3)'}}>Caricamento dati...</div>;

  const tabs = [
    { id: 'budget', label: '💰 Budget' },
    { id: 'scadenze', label: '📅 Scadenze' },
    { id: 'spesa', label: '🛒 Lista della Spesa' },
    { id: 'report', label: '📊 Report' },
    { id: 'impostazioni', label: '⚙️ Impostazioni' },
  ];

  return (
    <div>
      <nav>
        <div className="nav-top">
          <div className="nav-title">💜 Family Control Centre <span className="nav-credit" style={{fontSize:'11px',fontWeight:400,opacity:0.75}}>by Claude</span> <span className="nav-version">{APP_VERSION}</span></div>
          <div className="nav-user">
            <span style={{display:'none',fontSize:'12px'}}>{user.displayName?.split(' ')[0]}</span>
            <button className="print-btn" onClick={() => window.print()} title="Stampa la scheda corrente">
              🖨️ Stampa
            </button>
            <button className={`sync-btn${syncing?' syncing':''}`} onClick={logout}>
              {syncing ? '🔄 Sync...' : '☁️ Esci'}
            </button>
          </div>
        </div>
        <div className="nav-tabs">
          {tabs.map(t => (
            <button key={t.id} className={`tab-btn${tab===t.id?' active':''}`} onClick={() => setTab(t.id)}>
              {t.label}
            </button>
          ))}
        </div>
      </nav>

      {tab === 'budget' && <BudgetTab data={data} saveData={saveData} addItems={addItems} removeItems={removeItems} updateItem={updateItem} askConfirm={askConfirm} />}
      {tab === 'scadenze' && <ScadenzeTab data={data} saveData={saveData} addItems={addItems} removeItems={removeItems} updateItem={updateItem} askConfirm={askConfirm} />}
      {tab === 'spesa' && <SpesaTab data={data} saveData={saveData} addItems={addItems} removeItems={removeItems} updateItem={updateItem} applyUpdate={applyUpdate} aggiornaVoceMappa={aggiornaVoceMappa} askConfirm={askConfirm} />}
      {tab === 'report' && <ReportTab data={data} addItems={addItems} removeItems={removeItems} askConfirm={askConfirm} />}
      {tab === 'impostazioni' && <ImpostazioniTab data={data} saveData={saveData} applyUpdate={applyUpdate} />}

      {confirmDialog && (
        <div className="confirm-overlay" onClick={() => risolviConfirm(false)}>
          <div className="confirm-box" onClick={e => e.stopPropagation()}>
            <div className="confirm-msg">{confirmDialog.message}</div>
            <div className="confirm-actions">
              <button className="btn" onClick={() => risolviConfirm(false)}>Annulla</button>
              <button className="btn danger" onClick={() => risolviConfirm(true)}>🗑 Elimina</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
