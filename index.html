// ── CAMPO CON COMPLETAMENTO AUTOMATICO ──────────────────────────────────────────
// Sostituisce il <datalist> nativo (poco affidabile su Safari/iOS: spesso non mostra
// i suggerimenti mentre si scrive). Mostra un piccolo menu sotto il campo che si
// filtra in tempo reale in base a quello che si sta digitando, restando visibile
// finché non si sceglie un suggerimento o non si tocca/clicca altrove.
function AutocompleteInput({ value, onChange, options, placeholder, onEnter, className }) {
  const [open, setOpen] = useState(false);
  const [highlightIdx, setHighlightIdx] = useState(-1);
  const wrapRef = useRef(null);
  // Tracciano il tocco in corso per distinguere un tap (selezione) da uno scorrimento
  // del menu: prima, selezionare accadeva già su onTouchStart, quindi il primo tocco
  // per iniziare a scorrere selezionava subito la voce toccata, impedendo lo scroll.
  const touchStartYRef = useRef(null);
  const touchMovedRef = useRef(false);

  // Se il campo è vuoto, mostra comunque tutte le opzioni disponibili (fino a 8): prima questa
  // correzione il menu restava vuoto finché non si iniziava a digitare, facendo sembrare il
  // campo "morto" al primo tocco.
  const filtered = value.trim()
    ? options.filter(o => o.toLowerCase().includes(value.trim().toLowerCase()) && o.toLowerCase() !== value.trim().toLowerCase()).slice(0, 8)
    : options.slice(0, 8);

  useEffect(() => {
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', handleOutside);
    document.addEventListener('touchstart', handleOutside);
    return () => {
      document.removeEventListener('mousedown', handleOutside);
      document.removeEventListener('touchstart', handleOutside);
    };
  }, []);

  function selectOption(opt) {
    onChange(opt);
    setOpen(false);
    setHighlightIdx(-1);
  }

  function handleKeyDown(e) {
    if (open && filtered.length > 0) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setHighlightIdx(i => Math.min(i + 1, filtered.length - 1)); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); setHighlightIdx(i => Math.max(i - 1, 0)); return; }
      if (e.key === 'Enter' && highlightIdx >= 0) { e.preventDefault(); selectOption(filtered[highlightIdx]); return; }
    }
    if (e.key === 'Enter') { setOpen(false); if (onEnter) onEnter(); }
    if (e.key === 'Escape') { setOpen(false); }
  }

  return (
    <div ref={wrapRef} style={{ position: 'relative' }}>
      <input
        type="text"
        className={className}
        placeholder={placeholder}
        value={value}
        autoComplete="off"
        onChange={e => { onChange(e.target.value); setOpen(true); setHighlightIdx(-1); }}
        onFocus={() => setOpen(true)}
        onKeyDown={handleKeyDown}
      />
      {open && filtered.length > 0 && (
        <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 50, background: '#fff', border: '1px solid var(--border2)', borderRadius: '8px', marginTop: '3px', boxShadow: 'var(--shadow)', maxHeight: '180px', overflowY: 'auto' }}>
          {filtered.map((opt, i) => (
            <div
              key={opt}
              onMouseDown={e => { e.preventDefault(); selectOption(opt); }}
              onTouchStart={e => { touchStartYRef.current = e.touches[0].clientY; touchMovedRef.current = false; }}
              onTouchMove={e => {
                if (touchStartYRef.current !== null && Math.abs(e.touches[0].clientY - touchStartYRef.current) > 8) {
                  touchMovedRef.current = true;
                }
              }}
              onTouchEnd={e => {
                if (!touchMovedRef.current) { e.preventDefault(); selectOption(opt); }
                touchStartYRef.current = null;
              }}
              style={{ padding: '9px 12px', fontSize: '14px', cursor: 'pointer', background: i === highlightIdx ? 'var(--accent-light)' : 'transparent' }}
            >
              {opt}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── SPESA TAB ──────────────────────────────────────────────────────────────────
function SpesaTab({ data, saveData, addItems, removeItems, updateItem, applyUpdate, askConfirm }) {
  const [show, setShow] = useState(false);
  const [form, setForm] = useState({ nome: '', cat: '', sottocat: '', tappa: '', qta: '1', unita: 'pz', prezzoUnitario: '', prezzoTotale: '' });
  const [newCatInline, setNewCatInline] = useState('');
  const [showNewCat, setShowNewCat] = useState(false);
  const [newSottocatInline, setNewSottocatInline] = useState('');
  const [showNewSottocat, setShowNewSottocat] = useState(false);
  const [newTappaInline, setNewTappaInline] = useState('');
  const [showNewTappa, setShowNewTappa] = useState(false);
  // Articolo per cui è aperto il riquadro "prezzo rapido" (flusso spunta+prezzo in un solo tocco)
  const [quickPriceId, setQuickPriceId] = useState(null);
  const [quickPrice, setQuickPrice] = useState('');
  const quickPriceInputRef = useRef(null);
  // Articolo per cui è aperto il riquadro "cambia tappa" (per spostarlo su un altro negozio)
  const [tappaEditId, setTappaEditId] = useState(null);
  const [tappaEditVal, setTappaEditVal] = useState('');

  // Nomi prodotto già usati in passato (storico persistente + articoli attualmente in lista),
  // per il completamento automatico del campo "Prodotto"
  const prodottiNote = Array.from(new Set([...(data.storicoProdotti || []), ...((data.listaSpesa || []).map(i => i.nome))].filter(Boolean)));

  // Elenco categorie robusto: se l'array è vuoto o assente, usa i default
  const catList = (data.categorieLista && data.categorieLista.length) ? data.categorieLista : DEFAULT_SPESA_CATS;
  // Elenco tappe (negozi) robusto: se l'array è vuoto o assente, usa i default
  const tappaList = (data.tappeLista && data.tappeLista.length) ? data.tappeLista : DEFAULT_TAPPE;
  // Sottocategorie disponibili per la categoria attualmente selezionata nel form
  const sottocatList = ((data.sottocategorieLista || {})[form.cat]) || [];

  useEffect(() => {
    if (quickPriceId && quickPriceInputRef.current) {
      quickPriceInputRef.current.focus();
    }
  }, [quickPriceId]);

  // Aggiunta di categoria/sottocategoria/tappa "al volo" dal form: usa scritture ATOMICHE
  // (arrayUnion, anche su campo annidato per le sottocategorie tramite dot-notation)
  // invece di saveData (che riscrive tutto il documento). Prima di questa correzione,
  // se si aggiungeva una nuova categoria e subito dopo una nuova sottocategoria (o si
  // aggiungeva un articolo alla lista quasi nello stesso istante), la seconda scrittura
  // "vecchio stile" poteva sovrascrivere e far sparire la modifica appena fatta dalla prima
  // (bug segnalato da Giorgio: la categoria "Cibo" spariva al secondo inserimento).
  function addCatInline() {
    const nuova = newCatInline.trim();
    if (!nuova) return;
    applyUpdate({ categorieLista: firebase.firestore.FieldValue.arrayUnion(nuova) });
    setForm(f => ({ ...f, cat: nuova }));
    setNewCatInline('');
    setShowNewCat(false);
  }

  function addSottocatInline() {
    const nuova = newSottocatInline.trim();
    if (!nuova || !form.cat) return;
    applyUpdate({ [`sottocategorieLista.${form.cat}`]: firebase.firestore.FieldValue.arrayUnion(nuova) });
    setForm(f => ({ ...f, sottocat: nuova }));
    setNewSottocatInline('');
    setShowNewSottocat(false);
  }

  function addTappaInline() {
    const nuova = newTappaInline.trim();
    if (!nuova) return;
    applyUpdate({ tappeLista: firebase.firestore.FieldValue.arrayUnion(nuova) });
    setForm(f => ({ ...f, tappa: nuova }));
    setNewTappaInline('');
    setShowNewTappa(false);
  }

  function add() {
    if (!form.nome) return;
    const nomeTrim = form.nome.trim();
    const catTrim = form.cat.trim();
    const sottocatTrim = form.sottocat.trim();
    const item = { id: Date.now(), nome: nomeTrim, cat: catTrim || 'Altro', sottocat: sottocatTrim, tappa: form.tappa || 'Altro', qta: form.qta || '1', unita: form.unita || 'pz', prezzoUnitario: form.prezzoUnitario || '', prezzoTotale: form.prezzoTotale || '', checked: false, buonoPasto: false };
    addItems('listaSpesa', [item]);
    // Salva il nome nello storico prodotti (persiste anche dopo "Registra spesa", a differenza
    // della lista stessa), così il completamento automatico funziona anche per articoli già acquistati
    if (nomeTrim && !(data.storicoProdotti || []).includes(nomeTrim)) {
      addItems('storicoProdotti', [nomeTrim]);
    }
    // Il campo Categoria ora è testo libero con suggerimenti: se è stata digitata una
    // categoria nuova (non ancora in archivio), la aggiunge da sola all'elenco, così
    // sarà suggerita anche la prossima volta. Scrittura atomica (arrayUnion): non
    // rischia più di essere persa se parte insieme ad altre scritture (es. la
    // sottocategoria qui sotto, o l'articolo appena aggiunto sopra).
    if (catTrim && !catList.includes(catTrim)) {
      applyUpdate({ categorieLista: firebase.firestore.FieldValue.arrayUnion(catTrim) });
    }
    // Stessa logica per la sottocategoria, archiviata sotto la categoria scelta.
    // Anche qui scrittura atomica su campo annidato (dot-notation), invece di
    // saveData: era proprio questa la causa del bug segnalato da Giorgio (la
    // categoria appena salvata spariva al secondo inserimento).
    if (catTrim && sottocatTrim && !sottocatList.includes(sottocatTrim)) {
      applyUpdate({ [`sottocategorieLista.${catTrim}`]: firebase.firestore.FieldValue.arrayUnion(sottocatTrim) });
    }
    setForm({ nome: '', cat: '', sottocat: '', tappa: form.tappa || '', qta: '1', unita: form.unita || 'pz', prezzoUnitario: '', prezzoTotale: '' });
  }
  // Quando cambia il prezzo unitario nel form di aggiunta, ricalcola in automatico il totale (Qtà × prezzo unit.)
  // Usa parseNumIT (non parseFloat) per capire correttamente anche i valori scritti con la virgola (es. "0,500")
  function handleFormUnitChange(val) {
    const totaleCalc = calcolaTotaleSpesa(form.qta, form.unita, val);
    setForm(f => ({ ...f, prezzoUnitario: val, prezzoTotale: totaleCalc !== null ? totaleCalc : f.prezzoTotale }));
  }
  // Quando cambia la QUANTITÀ nel form di aggiunta, ricalcola anch'essa il totale in automatico
  // (prima il totale si aggiornava solo cambiando il prezzo unitario, non la quantità)
  function handleFormQtaChange(val) {
    const totaleCalc = calcolaTotaleSpesa(val, form.unita, form.prezzoUnitario);
    setForm(f => ({ ...f, qta: val, prezzoTotale: totaleCalc !== null ? totaleCalc : f.prezzoTotale }));
  }
  // Quando cambia l'UNITÀ (es. da "kg" a "gr"), cambia anche il significato del prezzo
  // unitario (al kg vs all'etto): ricalcola subito il totale con la nuova unità.
  function handleFormUnitaChange(val) {
    const totaleCalc = calcolaTotaleSpesa(form.qta, val, form.prezzoUnitario);
    setForm(f => ({ ...f, unita: val, prezzoTotale: totaleCalc !== null ? totaleCalc : f.prezzoTotale }));
  }
  function toggle(item) {
    if (item.checked) {
      // Da "già preso" a "da prendere": semplice riapertura, nessun prezzo da chiedere
      updateItem('listaSpesa', item, { ...item, checked: false });
      return;
    }
    // Da "da prendere" a "preso": se ha già un prezzo, spunta subito senza chiedere altro.
    // Altrimenti apre il riquadro "prezzo rapido" per inserirlo e confermare in un solo tocco.
    if ((parseNumIT(item.prezzoTotale) || 0) > 0) {
      updateItem('listaSpesa', item, { ...item, checked: true });
    } else {
      setQuickPrice('');
      setQuickPriceId(item.id);
    }
  }
  // Conferma del riquadro "prezzo rapido": salva il prezzo (se inserito) e spunta l'articolo, in un solo aggiornamento
  function confermaQuickPrice(item) {
    const totaleCalc = calcolaTotaleSpesa(item.qta, item.unita, quickPrice);
    const totaleFinale = totaleCalc !== null ? totaleCalc : (quickPrice || item.prezzoTotale || '');
    updateItem('listaSpesa', item, { ...item, prezzoUnitario: quickPrice || item.prezzoUnitario, prezzoTotale: totaleFinale, checked: true });
    setQuickPriceId(null);
    setQuickPrice('');
  }
  // Spunta senza inserire un prezzo (utile se non lo conosci ancora, lo aggiungerai dopo tra i "Già presi")
  function confermaSenzaPrice(item) {
    updateItem('listaSpesa', item, { ...item, checked: true });
    setQuickPriceId(null);
    setQuickPrice('');
  }
  function annullaQuickPrice() {
    setQuickPriceId(null);
    setQuickPrice('');
  }
  async function del(item) {
    const ok = await askConfirm(`Eliminare "${item.nome}" dalla lista?`);
    if (!ok) return;
    removeItems('listaSpesa', [item]);
  }
  async function clearChecked() {
    const ok = await askConfirm(`Svuotare ${presi.length} articolo${presi.length > 1 ? 'i' : ''} già pres${presi.length > 1 ? 'i' : 'o'} SENZA registrarli come spesa? L'azione non è annullabile.`);
    if (!ok) return;
    removeItems('listaSpesa', presi);
  }
  // ── BOZZE LOCALI per quantità/prezzi ──────────────────────────────────────
  // Problema risolto: prima, ogni singolo tasto premuto in questi campi scriveva
  // SUBITO su Firebase (rimozione + reinserimento dell'articolo). Digitando in
  // fretta un numero con la virgola, il giro di andata/ritorno col database a
  // volte "perdeva" l'ultima cifra digitata (es. i decimali del prezzo).
  // Ora invece: mentre scrivi, il valore resta solo in memoria locale (istantaneo,
  // nessuna cifra persa); il salvataggio su Firebase avviene solo quando esci dal
  // campo (tocchi altrove / chiudi la tastiera) o premi Invio.
  const [drafts, setDrafts] = useState({});
  function draftVal(item, field) {
    const d = drafts[item.id];
    if (d && d[field] !== undefined) return d[field];
    if (field === 'qta') return item[field] || '1';
    if (field === 'unita') return item[field] || 'pz';
    return item[field] || '';
  }
  function setDraftUnita(item, val) {
    // Cambiare l'unità cambia anche il significato del prezzo unitario (es. da "al kg" a
    // "all'etto"): ricalcola subito il totale con la nuova unità, usando i valori di quantità
    // e prezzo unitario attuali (bozza in corso se presente, altrimenti quelli già salvati).
    const qtaAttuale = draftVal(item, 'qta');
    const prezzoAttuale = draftVal(item, 'prezzoUnitario');
    const totaleCalc = calcolaTotaleSpesa(qtaAttuale, val, prezzoAttuale);
    const nuovoTotale = totaleCalc !== null ? totaleCalc : draftVal(item, 'prezzoTotale');
    setDrafts(d => { const p = { ...d }; delete p[item.id]; return p; });
    // L'unità non richiede conferma separata: si salva subito, non c'è calcolo da aspettare
    updateItem('listaSpesa', item, { ...item, unita: val, qta: qtaAttuale, prezzoUnitario: prezzoAttuale, prezzoTotale: nuovoTotale });
  }
  function setDraftQta(item, val) {
    const totaleCalc = calcolaTotaleSpesa(val, draftVal(item, 'unita'), draftVal(item, 'prezzoUnitario'));
    setDrafts(d => ({ ...d, [item.id]: { ...d[item.id], qta: val, prezzoTotale: totaleCalc !== null ? totaleCalc : draftVal(item, 'prezzoTotale') } }));
  }
  function setDraftUnit(item, val) {
    const totaleCalc = calcolaTotaleSpesa(draftVal(item, 'qta'), draftVal(item, 'unita'), val);
    setDrafts(d => ({ ...d, [item.id]: { ...d[item.id], prezzoUnitario: val, prezzoTotale: totaleCalc !== null ? totaleCalc : draftVal(item, 'prezzoTotale') } }));
  }
  function setDraftTotale(item, val) {
    setDrafts(d => ({ ...d, [item.id]: { ...d[item.id], prezzoTotale: val } }));
  }
  // Invia a Firebase la bozza accumulata per un articolo (chiamata su blur/Invio)
  function commitDraft(item) {
    const d = drafts[item.id];
    if (!d) return;
    const newItem = { ...item, ...d };
    updateItem('listaSpesa', item, newItem);
    setDrafts(prev => { const p = { ...prev }; delete p[item.id]; return p; });
  }
  // Marca/smarca un articolo come pagabile con i buoni pasto (solo etichetta visiva + totale,
  // serve a Giorgio per non superare il limite giornaliero di spesa consentito dai buoni pasto).
  // Al momento di "Registra spesa", gli articoli marcati NON finiscono nel Budget: il loro
  // importo viene invece scalato dal saldo Buoni Pasto (tab Report).
  function toggleBuonoPasto(item) {
    updateItem('listaSpesa', item, { ...item, buonoPasto: !item.buonoPasto });
  }
  // Apre il riquadro per cambiare la tappa (negozio) di un articolo già in lista
  function apriCambiaTappa(item) {
    setTappaEditVal(item.tappa || 'Altro');
    setTappaEditId(item.id);
  }
  function confermaCambiaTappa(item) {
    updateItem('listaSpesa', item, { ...item, tappa: tappaEditVal || 'Altro' });
    setTappaEditId(null);
    setTappaEditVal('');
  }
  function annullaCambiaTappa() {
    setTappaEditId(null);
    setTappaEditVal('');
  }
  // A fine spesa: raggruppa per categoria gli articoli "presi" con un prezzo inserito,
  // li registra come spese di oggi nel Budget, poi svuota la lista dei presi
  // (un'unica operazione atomica: aggiunge le spese e rimuove gli articoli presi insieme)
  async function registraSpesa() {
    const conPrezzo = presi.filter(i => (parseNumIT(i.prezzoTotale) || 0) > 0);
    const senzaPrezzo = presi.filter(i => !((parseNumIT(i.prezzoTotale) || 0) > 0));
    if (senzaPrezzo.length > 0) {
      const nomi = senzaPrezzo.map(i => i.nome).join(', ');
      const ok = await askConfirm(
        `${senzaPrezzo.length} articolo${senzaPrezzo.length > 1 ? 'i' : ''} senza prezzo (${nomi}) ${senzaPrezzo.length > 1 ? 'non verranno registrati' : 'non verrà registrato'}.\n\nProcedere comunque?`
      );
      if (!ok) return;
    }
    // Gli articoli marcati "buono pasto" NON sono spesa reale: il loro importo va scalato
    // dal saldo Buoni Pasto (Report) invece di entrare nel Budget.
    const conPrezzoNormale = conPrezzo.filter(i => !i.buonoPasto);
    const conPrezzoBP = conPrezzo.filter(i => i.buonoPasto);

    const perCategoria = {};
    for (const item of conPrezzoNormale) {
      perCategoria[item.cat] = (perCategoria[item.cat] || 0) + (parseNumIT(item.prezzoTotale) || 0);
    }
    const oggi = localDateStr();
    const nuoveSpese = Object.entries(perCategoria).map(([cat, amount], idx) => ({
      id: Date.now() + idx,
      desc: cat === 'Altro' ? 'Spesa supermercato' : `Acquisti – ${cat}`,
      amount: Math.round(amount * 100) / 100,
      cat,
      subcat: '',
      date: oggi,
    }));
    const totBP = conPrezzoBP.reduce((a, i) => a + (parseNumIT(i.prezzoTotale) || 0), 0);
    const nuoviMovimentiBP = totBP > 0 ? [{
      id: Date.now() + 777,
      tipo: 'speso',
      desc: `Spesa supermercato (${conPrezzoBP.map(i => i.nome).join(', ')})`,
      qty: null,
      amount: Math.round(totBP * 100) / 100,
      date: oggi,
    }] : [];

    const updateObj = {};
    if (nuoveSpese.length) updateObj.spese = firebase.firestore.FieldValue.arrayUnion(...nuoveSpese);
    if (nuoviMovimentiBP.length) updateObj.buoniPasto = firebase.firestore.FieldValue.arrayUnion(...nuoviMovimentiBP);
    if (presi.length) updateObj.listaSpesa = firebase.firestore.FieldValue.arrayRemove(...presi);
    if (Object.keys(updateObj).length) applyUpdate(updateObj);
  }
  // Rendering di una riga articolo (usata sia per "da prendere" che per "già presi")
  function renderItem(item) {
    const bp = !!item.buonoPasto;
    return (
      <div key={item.id}>
        <div className={`spesa-lista-item${item.checked?' checked':''}`}
          style={bp ? {background:'var(--salmon-bg)', borderColor:'var(--salmon-border)'} : {}}>
          <div className="spesa-nome-row">
            <input type="checkbox" checked={item.checked} onChange={() => toggle(item)} />
            <div style={{flex:1, minWidth:0, cursor: item.checked ? 'default' : 'pointer'}} onClick={() => !item.checked && toggle(item)}>
              <div style={{overflowWrap:'break-word', wordBreak:'break-word'}}>{item.nome}</div>
              <div className="spesa-cat">{item.cat}{item.sottocat ? ` › ${item.sottocat}` : ''}</div>
            </div>
          </div>
          <input type="text" inputMode="numeric" pattern="[0-9]*" value={draftVal(item, 'qta')} title="Quantità"
            onChange={e => setDraftQta(item, e.target.value)}
            onBlur={() => commitDraft(item)}
            onKeyDown={e => e.key === 'Enter' && e.target.blur()}
            className="qta-input" />
          <select value={draftVal(item, 'unita')} title="Unità di misura" onChange={e => setDraftUnita(item, e.target.value)} className="unita-select">
            {UNITA_OPZIONI.map(u => <option key={u.v} value={u.v}>{u.label}</option>)}
          </select>
          <input type="text" inputMode="decimal" placeholder={etichettaPrezzoUnitario(draftVal(item, 'unita'))} title={etichettaPrezzoUnitario(draftVal(item, 'unita'))} value={draftVal(item, 'prezzoUnitario')}
            onChange={e => setDraftUnit(item, e.target.value)}
            onBlur={() => commitDraft(item)}
            onKeyDown={e => e.key === 'Enter' && e.target.blur()}
            className="prezzo-input" />
          <input type="text" inputMode="decimal" placeholder="€ tot." value={draftVal(item, 'prezzoTotale')}
            onChange={e => setDraftTotale(item, e.target.value)}
            onBlur={() => commitDraft(item)}
            onKeyDown={e => e.key === 'Enter' && e.target.blur()}
            className="prezzo-input tot" />
          <button
            className="btn small bp-btn"
            title="Cambia tappa (negozio)"
            onClick={() => apriCambiaTappa(item)}
          >📍</button>
          <button
            className="btn small bp-btn"
            title={bp ? 'Pagabile con buoni pasto (tocca per togliere)' : 'Segna come pagabile con buoni pasto'}
            onClick={() => toggleBuonoPasto(item)}
            style={bp ? {background:'var(--salmon)',borderColor:'var(--salmon)',color:'#fff'} : {}}
          >🍱</button>
          <button className="spesa-delete" onClick={() => del(item)}>✕</button>
        </div>
        {tappaEditId === item.id && (
          <div style={{display:'flex',alignItems:'center',gap:'8px',background:'var(--accent-light)',border:'1px solid var(--border2)',borderRadius:'8px',padding:'10px 12px',marginTop:'-4px',marginBottom:'6px',flexWrap:'wrap'}}>
            <span style={{fontSize:'13px',color:'var(--text2)',flex:'1 1 100px'}}>Sposta <strong>{item.nome}</strong> alla tappa:</span>
            <select value={tappaEditVal} onChange={e => setTappaEditVal(e.target.value)} style={{maxWidth:'160px'}}>
              {tappaList.map(t => <option key={t}>{t}</option>)}
            </select>
            <button className="btn primary small" onClick={() => confermaCambiaTappa(item)}>✓ Sposta</button>
            <button className="btn small" onClick={annullaCambiaTappa}>✕ Annulla</button>
          </div>
        )}
        {quickPriceId === item.id && (
          <div style={{display:'flex',alignItems:'center',gap:'8px',background:'var(--accent-light)',border:'1px solid var(--border2)',borderRadius:'8px',padding:'10px 12px',marginTop:'-4px',marginBottom:'6px',flexWrap:'wrap'}}>
            <span style={{fontSize:'13px',color:'var(--text2)',flex:'1 1 100px'}}>Quanto hai speso per <strong>{item.nome}</strong>?</span>
            <input
              ref={quickPriceInputRef}
              type="text" inputMode="decimal" placeholder={etichettaPrezzoUnitario(item.unita)}
              value={quickPrice}
              onChange={e => setQuickPrice(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && confermaQuickPrice(item)}
              style={{width:'80px',padding:'7px 8px',fontSize:'14px'}}
            />
            <button className="btn primary small" onClick={() => confermaQuickPrice(item)}>✓ Preso</button>
            <button className="btn small" onClick={() => confermaSenzaPrice(item)}>Senza prezzo</button>
            <button className="btn small" onClick={annullaQuickPrice}>✕ Annulla</button>
          </div>
        )}
      </div>
    );
  }

  const lista = data.listaSpesa || [];
  const daPrendere = lista.filter(i => !i.checked);
  const presi = lista.filter(i => i.checked);

  // Totale corrente degli articoli marcati "buono pasto" (presi + da prendere): serve per
  // controllare al volo, durante la spesa, di non superare il limite giornaliero dei buoni pasto
  const itemsBP = lista.filter(i => i.buonoPasto);
  const totBPLista = itemsBP.reduce((a, i) => a + (parseNumIT(draftVal(i, 'prezzoTotale')) || 0), 0);
  const totBPPresi = presi.filter(i => i.buonoPasto).reduce((a, i) => a + (parseNumIT(draftVal(i, 'prezzoTotale')) || 0), 0);

  // Raggruppa per tappa (negozio): l'ordine delle sezioni segue l'ordine delle tappe
  // definito in Impostazioni, così la lista rispecchia il giro che si vuole fare
  const bytappa = {};
  for (const item of daPrendere) {
    const t = item.tappa || 'Altro';
    if (!bytappa[t]) bytappa[t] = [];
    bytappa[t].push(item);
  }
  const tappeOrdinate = [
    ...tappaList.filter(t => bytappa[t]),
    ...Object.keys(bytappa).filter(t => !tappaList.includes(t)),
  ];
  const numTappeRimanenti = tappeOrdinate.length;

  return (
    <div className="section active">
      <div className="print-title">💜 Family CC — Lista della spesa</div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
        <div style={{fontSize:'17px',fontWeight:'700'}}>🛒 Lista della spesa</div>
        <div style={{display:'flex',gap:'6px'}}>
          {presi.length > 0 && <button className="btn small danger" onClick={clearChecked}>🗑 Svuota senza registrare</button>}
          <button className="btn primary small" onClick={() => setShow(v => !v)}>{show ? '✕' : '+ Aggiungi'}</button>
        </div>
      </div>

      {numTappeRimanenti > 0 && (
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--accent-light)',border:'1px solid var(--border2)',borderRadius:'10px',padding:'10px 14px',marginBottom:'14px'}}>
          <span style={{fontSize:'13px',color:'var(--accent-dark)',fontWeight:'600'}}>📍 Tappe rimanenti</span>
          <span style={{fontSize:'16px',fontWeight:'800',color:'var(--accent-dark)'}}>{numTappeRimanenti}</span>
        </div>
      )}

      {itemsBP.length > 0 && (
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--salmon-bg)',border:'1px solid var(--salmon-border)',borderRadius:'10px',padding:'10px 14px',marginBottom:'14px'}}>
          <span style={{fontSize:'13px',color:'var(--salmon)',fontWeight:'600'}}>🍱 Totale marcato buoni pasto ({itemsBP.length} articol{itemsBP.length === 1 ? 'o' : 'i'})</span>
          <span style={{fontSize:'16px',fontWeight:'800',color:'var(--salmon)'}}>{formatEuro(totBPLista)}</span>
        </div>
      )}

      {show && (
        <div className="card" style={{background:'var(--accent-light)'}}>
          {/* Prodotto */}
          <div className="form-row">
            <div className="form-group">
              <label>Prodotto</label>
              <AutocompleteInput
                placeholder="Es. Latte"
                value={form.nome}
                options={prodottiNote}
                onChange={val => setForm(f => ({...f, nome: val}))}
                onEnter={add}
              />
            </div>
          </div>
          {/* Qtà, Unità, Totale */}
          <div className="form-row">
            <div className="form-group" style={{maxWidth:'60px'}}>
              <label>Qtà</label>
              <input type="text" inputMode="decimal" value={form.qta} onChange={e => handleFormQtaChange(e.target.value)} />
            </div>
            <div className="form-group" style={{maxWidth:'70px'}}>
              <label>Unità</label>
              <select value={form.unita} onChange={e => handleFormUnitaChange(e.target.value)}>
                {UNITA_OPZIONI.map(u => <option key={u.v} value={u.v}>{u.label}</option>)}
              </select>
            </div>
            <div className="form-group" style={{maxWidth:'85px'}}>
              <label>{etichettaPrezzoUnitario(form.unita)}</label>
              <input type="text" inputMode="decimal" placeholder="0,00" value={form.prezzoUnitario} onChange={e => handleFormUnitChange(e.target.value)} />
            </div>
            <div className="form-group" style={{maxWidth:'85px'}}>
              <label>€ totale</label>
              <input type="text" inputMode="decimal" placeholder="0,00" value={form.prezzoTotale} onChange={e => setForm(f => ({...f, prezzoTotale: e.target.value}))} />
            </div>
          </div>
          {form.unita === 'g' && (
            <div style={{fontSize:'12px',color:'var(--text2)',marginTop:'-6px',marginBottom:'10px'}}>
              ℹ️ Per i grammi, il prezzo si intende all'etto (ogni 100 g) — come indicato di solito ai banchi salumeria/gastronomia/macelleria.
            </div>
          )}
          {/* Categoria */}
          <div className="form-row">
            <div className="form-group">
              <label>Categoria</label>
              <AutocompleteInput
                placeholder="Es. Latticini"
                value={form.cat}
                options={catList}
                onChange={val => setForm(f => ({...f, cat: val, sottocat: ''}))}
                onEnter={add}
              />
            </div>
          </div>
          {/* Sottocategoria (solo se è stata scelta una categoria) */}
          {form.cat && (
            <div className="form-row">
              <div className="form-group">
                <label>Sottocategoria <span style={{fontWeight:'400',color:'var(--text3)'}}>(opzionale)</span></label>
                <select value={form.sottocat} onChange={e => setForm(f => ({...f, sottocat: e.target.value}))}>
                  <option value="">Nessuna</option>
                  {sottocatList.map(sc => <option key={sc}>{sc}</option>)}
                </select>
                {!showNewSottocat && <button type="button" onClick={() => setShowNewSottocat(true)} className="btn small" style={{marginTop:'6px',borderColor:'var(--accent)',color:'var(--accent)'}}>+ Nuova sottocategoria</button>}
                {showNewSottocat && <div style={{display:'flex',gap:'4px',marginTop:'4px'}}>
                  <input type="text" placeholder="Nome sottocategoria" value={newSottocatInline} onChange={e => setNewSottocatInline(e.target.value)} onKeyDown={e => e.key==='Enter' && addSottocatInline()} style={{fontSize:'13px',padding:'4px 8px'}} />
                  <button type="button" className="btn primary small" onClick={addSottocatInline}>✓</button>
                  <button type="button" className="btn small" onClick={() => setShowNewSottocat(false)}>✕</button>
                </div>}
              </div>
            </div>
          )}
          {/* Tappa */}
          <div className="form-row">
            <div className="form-group">
              <label>Tappa (negozio)</label>
              <select required value={form.tappa} onChange={e => { setForm(f => ({...f, tappa: e.target.value})); setShowNewTappa(false); }}>
                <option value="">Seleziona...</option>
                {tappaList.map(t => <option key={t}>{t}</option>)}
              </select>
              {!showNewTappa && <button type="button" onClick={() => setShowNewTappa(true)} className="btn small" style={{marginTop:'6px',borderColor:'var(--accent)',color:'var(--accent)'}}>+ Nuova tappa</button>}
              {showNewTappa && <div style={{display:'flex',gap:'4px',marginTop:'4px'}}>
                <input type="text" placeholder="Nome tappa" value={newTappaInline} onChange={e => setNewTappaInline(e.target.value)} onKeyDown={e => e.key==='Enter' && addTappaInline()} style={{fontSize:'13px',padding:'4px 8px'}} />
                <button type="button" className="btn primary small" onClick={addTappaInline}>✓</button>
                <button type="button" className="btn small" onClick={() => setShowNewTappa(false)}>✕</button>
              </div>}
            </div>
          </div>
          <button className="btn primary" onClick={add}>➕ Aggiungi</button>
        </div>
      )}

      {lista.length === 0 && <div className="empty">Lista vuota — aggiungi qualcosa!</div>}

      {tappeOrdinate.map(t => (
        <div key={t} style={{marginBottom:'14px'}}>
          <div style={{fontSize:'12px',fontWeight:'700',color:'var(--accent)',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:'6px',paddingLeft:'4px'}}>📍 {t} <span style={{fontWeight:'400',color:'var(--text3)'}}>({bytappa[t].length})</span></div>
          {bytappa[t].map(item => renderItem(item))}
        </div>
      ))}

      {daPrendere.length > 0 && (
        <div style={{textAlign:'right',fontSize:'13px',fontWeight:700,color:'var(--text2)',padding:'2px 4px 12px'}}>
          Totale da prendere (stima): {formatEuro(daPrendere.reduce((a, i) => a + (parseNumIT(draftVal(i, 'prezzoTotale')) || 0), 0))}
        </div>
      )}

      {presi.length > 0 && (
        <div style={{marginTop:'8px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px'}}>
            <div style={{fontSize:'12px',fontWeight:'700',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.07em'}}>✓ Già presi</div>
            <div style={{fontSize:'13px',fontWeight:700,color:'var(--green)'}}>
              Totale: {formatEuro(presi.reduce((a, i) => a + (parseNumIT(draftVal(i, 'prezzoTotale')) || 0), 0))}
              {totBPPresi > 0 && <span style={{color:'var(--salmon)',fontWeight:600}}> (di cui 🍱 {formatEuro(totBPPresi)})</span>}
            </div>
          </div>
          {presi.map(item => renderItem(item))}
          <button className="btn primary" style={{marginTop:'10px',width:'100%',background:'var(--green)',borderColor:'var(--green)'}} onClick={registraSpesa}>
            💾 Registra spesa{totBPPresi > 0 ? ' (Budget + Buoni Pasto)' : ' nel Budget'} e svuota lista
          </button>
        </div>
      )}
    </div>
  );
}

// ── REPORT TAB ─────────────────────────────────────────────────────────────────
function ReportTab({ data, addItems, removeItems, askConfirm }) {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const [expandedCats, setExpandedCats] = useState({});
  const [scadFiltroMese, setScadFiltroMese] = useState(false); // false = tutto lo storico, true = solo mese selezionato
  // Buoni pasto: voce puramente informativa, NON è una spesa reale (non viene pagata),
  // quindi vive in un campo separato (buoniPasto) e non entra mai nei totali di Budget/Report.
  // Ogni buono pasto vale un importo fisso (VALORE_BUONO_PASTO); ogni voce è di tipo
  // "ricevuto" (entrata, es. accredito mensile dall'azienda) o "speso" (uscita, es. usato al supermercato).
  // Il saldo residuo = totale ricevuti - totale spesi, calcolato su tutta la storia (non solo il mese in vista).
  const VALORE_BUONO_PASTO = 8;
  const [showBP, setShowBP] = useState(false);
  const [formBP, setFormBP] = useState({ tipo: 'ricevuto', desc: '', qty: '', amount: '', date: localDateStr() });

  const speseMese = (data.spese || []).filter(s => {
    const [sy, sm] = s.date.split('-').map(Number);
    return sy === year && sm === month;
  });
  const totale = speseMese.reduce((a, s) => a + Number(s.amount), 0);

  const byCat = {};
  for (const s of speseMese) {
    byCat[s.cat] = (byCat[s.cat] || 0) + Number(s.amount);
  }
  const catSort = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

  // Raggruppa le spese per categoria, con elenco delle singole voci ordinate per data (più recenti prima)
  const speseByCat = {};
  for (const s of speseMese) {
    if (!speseByCat[s.cat]) speseByCat[s.cat] = [];
    speseByCat[s.cat].push(s);
  }
  for (const cat in speseByCat) {
    speseByCat[cat].sort((a, b) => b.date.localeCompare(a.date) || (b.id || 0) - (a.id || 0));
  }

  function toggleCat(cat) {
    setExpandedCats(prev => ({ ...prev, [cat]: !prev[cat] }));
  }

  // Storico scadenze pagate: tutto per default, filtrabile per il mese selezionato
  const scadenzePagate = (data.scadenze || [])
    .filter(s => s.pagato)
    .filter(s => {
      if (!scadFiltroMese) return true;
      const [scy, scm] = s.date.split('-').map(Number);
      return scy === year && scm === month;
    })
    .sort((a, b) => b.date.localeCompare(a.date));
  const totScadPagate = scadenzePagate.reduce((a, s) => a + Number(s.amount || 0), 0);

  function prevMonth() { if (month === 1) { setMonth(12); setYear(y => y - 1); } else setMonth(m => m - 1); }
  function nextMonth() { if (month === 12) { setMonth(1); setYear(y => y + 1); } else setMonth(m => m + 1); }

  // Buoni pasto del mese selezionato: solo informativo, non sommato a nessun altro totale
  const buoniPastoMese = (data.buoniPasto || []).filter(b => {
    const [by, bm] = b.date.split('-').map(Number);
    return by === year && bm === month;
  }).sort((a, b) => b.date.localeCompare(a.date));
  const totBuoniPasto = buoniPastoMese.reduce((a, b) => a + (b.tipo === 'speso' ? -Number(b.amount || 0) : Number(b.amount || 0)), 0);

  // Saldo residuo su tutta la storia: entrate (ricevuti, incluse le voci vecchie senza "tipo",
  // trattate come ricevute per compatibilità) meno uscite (spesi)
  const tuttiBP = data.buoniPasto || [];
  const totRicevutiStorico = tuttiBP.filter(b => (b.tipo || 'ricevuto') === 'ricevuto').reduce((a, b) => a + Number(b.amount || 0), 0);
  const totSpesiStorico = tuttiBP.filter(b => b.tipo === 'speso').reduce((a, b) => a + Number(b.amount || 0), 0);
  const saldoBP = totRicevutiStorico - totSpesiStorico;
  const qtyResidua = VALORE_BUONO_PASTO ? saldoBP / VALORE_BUONO_PASTO : 0;

  function setFormBPQty(qty) {
    setFormBP(f => ({ ...f, qty, amount: qty === '' ? '' : (Number(qty) * VALORE_BUONO_PASTO).toFixed(2) }));
  }
  function setFormBPAmount(amount) {
    setFormBP(f => ({ ...f, amount, qty: amount === '' ? '' : (Number(amount) / VALORE_BUONO_PASTO).toFixed(2) }));
  }
  function addBP() {
    if (!formBP.desc || !formBP.amount) return;
    const b = { id: Date.now(), tipo: formBP.tipo, desc: formBP.desc, qty: formBP.qty ? Number(formBP.qty) : null, amount: Number(formBP.amount), date: formBP.date };
    addItems('buoniPasto', [b]);
    setFormBP({ tipo: 'ricevuto', desc: '', qty: '', amount: '', date: localDateStr() });
    setShowBP(false);
  }
  async function delBP(item) {
    const ok = await askConfirm(`Eliminare il movimento "${item.desc}"?`);
    if (!ok) return;
    removeItems('buoniPasto', [item]);
  }

  return (
    <div className="section active">
      <div className="print-title">💜 Family CC — Report — {monthLabel(year, month)}</div>
      <div className="budget-header">
        <div className="month-nav">
          <button onClick={prevMonth}>‹</button>
          <div className="month-label">{monthLabel(year, month)}</div>
          <button onClick={nextMonth}>›</button>
        </div>
      </div>

      <div className="card">
        <div className="card-title">📊 Spese per categoria</div>
        {catSort.length === 0 && <div className="empty">Nessuna spesa questo mese</div>}
        {catSort.map(([cat, amt]) => (
          <div className="report-cat-bar" key={cat}>
            <div className="report-cat-label">
              <span>{cat}</span>
              <span>{formatEuro(amt)} <span style={{color:'var(--text3)',fontSize:'12px'}}>({totale ? Math.round(amt/totale*100) : 0}%)</span></span>
            </div>
            <div className="bar-bg">
              <div className="bar-fill" style={{width: totale ? `${amt/totale*100}%` : '0%'}}></div>
            </div>
          </div>
        ))}
        {totale > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Totale</span><span style={{color:'var(--red)'}}>{formatEuro(totale)}</span>
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-title">📋 Dettaglio movimenti per categoria</div>
        {catSort.length === 0 && <div className="empty">Nessuna spesa questo mese</div>}
        {catSort.map(([cat, amt]) => (
          <div key={cat} style={{marginBottom:'10px'}}>
            <div
              onClick={() => toggleCat(cat)}
              style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 12px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'8px',cursor:'pointer'}}
            >
              <span style={{fontWeight:'600',display:'flex',alignItems:'center',gap:'6px'}}>
                <span style={{fontSize:'11px',color:'var(--text3)'}}>{expandedCats[cat] ? '▾' : '▸'}</span>
                {cat}
                <span style={{fontSize:'12px',color:'var(--text3)',fontWeight:'400'}}>({speseByCat[cat].length})</span>
              </span>
              <span style={{fontWeight:'700',color:'var(--red)'}}>{formatEuro(amt)}</span>
            </div>
            {expandedCats[cat] && (
              <div style={{marginTop:'6px',paddingLeft:'8px'}}>
                {speseByCat[cat].map(s => (
                  <div className="spesa-item" key={s.id}>
                    <div style={{flex:1}}>
                      <div className="spesa-desc">{s.desc}</div>
                      <div className="spesa-cat">{formatDataIT(s.date)}{s.subcat ? ` · ${s.subcat}` : ''}</div>
                    </div>
                    <div className="spesa-amount">{formatEuro(s.amount)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
        {totale > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Totale movimenti</span><span style={{color:'var(--red)'}}>{formatEuro(totale)}</span>
          </div>
        )}
      </div>

      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0}}>🧾 Storico scadenze pagate</div>
          <button className="btn small" onClick={() => setScadFiltroMese(v => !v)}>
            {scadFiltroMese ? `📅 ${monthLabel(year, month)}` : '📋 Tutto lo storico'}
          </button>
        </div>
        {scadenzePagate.length === 0 && <div className="empty">Nessuna scadenza pagata{scadFiltroMese ? ' in questo mese' : ''}</div>}
        {scadenzePagate.map(s => (
          <div className="scad-item pagato" key={s.id}>
            <div className="scad-info">
              <div className="scad-name">{s.nome} {s.numerata && s.rataNum ? <span style={{fontSize:'11px',color:'var(--accent-dark)',fontWeight:'700'}}>Rata {s.rataNum}</span> : null}</div>
              <div className="scad-date">
                Scadenza: {formatDataIT(s.date)}
                {s.dataPagamento && <span> · Pagata il {formatDataIT(s.dataPagamento)}</span>}
              </div>
            </div>
            <div className="scad-amount">{s.amount ? formatEuro(s.amount) : ''}</div>
          </div>
        ))}
        {scadenzePagate.length > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Totale</span><span style={{color:'var(--green)'}}>{formatEuro(totScadPagate)}</span>
          </div>
        )}
      </div>

      <div className="card" style={{background:'var(--salmon-bg)',borderColor:'var(--salmon-border)'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0,color:'var(--salmon)'}}>🍱 Buoni Pasto</div>
          <button className="btn small" style={{borderColor:'var(--salmon)',color:'var(--salmon)'}} onClick={() => setShowBP(v => !v)}>
            {showBP ? '✕ Annulla' : '+ Aggiungi'}
          </button>
        </div>
        <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'12px',lineHeight:'1.5'}}>
          Dato puramente informativo: i buoni pasto non vengono pagati, quindi <strong>non sono conteggiati</strong> in nessun totale di Budget o Report.
        </div>

        <div style={{background:'#fff',border:'1px solid var(--salmon-border)',borderRadius:'10px',padding:'12px 14px',marginBottom:'14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:'12px',color:'var(--text3)'}}>Saldo residuo (ricevuti − spesi, storico completo)</div>
            <div style={{fontSize:'20px',fontWeight:'800',color:'var(--salmon)'}}>{formatEuro(saldoBP)}</div>
          </div>
          <div style={{textAlign:'right',fontSize:'13px',color:'var(--text2)'}}>
            ≈ {qtyResidua.toFixed(2)} buoni<br/>
            <span style={{fontSize:'11px',color:'var(--text3)'}}>1 buono = {formatEuro(VALORE_BUONO_PASTO)}</span>
          </div>
        </div>

        {showBP && (
          <div className="add-spesa-form" style={{background:'#fff',borderColor:'var(--salmon-border)'}}>
            <div className="form-row">
              <div className="form-group">
                <label>Tipo movimento</label>
                <select value={formBP.tipo} onChange={e => setFormBP(f => ({...f, tipo: e.target.value}))}>
                  <option value="ricevuto">➕ Ricevuto (entrata)</option>
                  <option value="speso">➖ Speso (uscita)</option>
                </select>
              </div>
              <div className="form-group" style={{flex:2}}>
                <label>Descrizione</label>
                <input type="text" placeholder="Es. Accredito mensile lavoro" value={formBP.desc} onChange={e => setFormBP(f => ({...f, desc: e.target.value}))} />
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Quantità (unità)</label>
                <input type="number" step="1" min="0" placeholder="Es. 20" value={formBP.qty} onChange={e => setFormBPQty(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Valore €</label>
                <input type="number" step="0.01" min="0" placeholder="0.00" value={formBP.amount} onChange={e => setFormBPAmount(e.target.value)} />
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Data</label>
                <input type="date" value={formBP.date} onChange={e => setFormBP(f => ({...f, date: e.target.value}))} />
              </div>
            </div>
            <button className="btn" style={{background:'var(--salmon)',borderColor:'var(--salmon)',color:'#fff'}} onClick={addBP}>💾 Salva movimento</button>
          </div>
        )}

        {buoniPastoMese.length === 0 && <div className="empty">Nessun movimento in {monthLabel(year, month)}</div>}
        {buoniPastoMese.map(b => {
          const isSpeso = b.tipo === 'speso';
          return (
            <div className="spesa-item" key={b.id} style={{borderColor:'var(--salmon-border)'}}>
              <div style={{flex:1}}>
                <div className="spesa-desc" style={{color:'var(--salmon)'}}>
                  {isSpeso ? '➖' : '➕'} {b.desc}
                  {b.qty ? <span style={{fontSize:'11px',color:'var(--text3)',fontWeight:'400'}}> · {b.qty} buon{b.qty === 1 ? 'o' : 'i'}</span> : null}
                </div>
                <div className="spesa-cat">{formatDataIT(b.date)}</div>
              </div>
              <div className="spesa-amount" style={{color:'var(--salmon)'}}>{isSpeso ? '−' : '+'}{formatEuro(b.amount)}</div>
              <button className="spesa-delete" onClick={() => delBP(b)}>🗑</button>
            </div>
          );
        })}
        {buoniPastoMese.length > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--salmon-border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Movimento del mese (informativo, non incluso nei totali)</span><span style={{color:'var(--salmon)'}}>{formatEuro(totBuoniPasto)}</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ── IMPOSTAZIONI TAB ───────────────────────────────────────────────────────────
function ImpostazioniTab({ data, saveData }) {
  const [newCat, setNewCat] = useState('');
  const [newTappa, setNewTappa] = useState('');
  const [newProdotto, setNewProdotto] = useState('');

  function addCat() {
    if (!newCat.trim()) return;
    saveData({ categorie: [...(data.categorie || DEFAULT_CATS), newCat.trim()] });
    setNewCat('');
  }
  function delCat(c) {
    saveData({ categorie: (data.categorie || DEFAULT_CATS).filter(x => x !== c) });
  }
  // Categorie usate nella Lista della spesa (es. Frutta e Verdura, Latticini...): elenco
  // separato da "categorie" del Budget, perché classificano il TIPO di prodotto alimentare
  // e non la voce di spesa familiare. Prima si potevano gestire solo scrivendole nel form
  // della Lista della spesa; qui si possono aggiungere/eliminare a mente fredda.
  const [newCatSpesa, setNewCatSpesa] = useState('');
  function addCatSpesa() {
    if (!newCatSpesa.trim()) return;
    saveData({ categorieLista: [...(data.categorieLista || DEFAULT_SPESA_CATS), newCatSpesa.trim()] });
    setNewCatSpesa('');
  }
  function delCatSpesa(c) {
    saveData({ categorieLista: (data.categorieLista || DEFAULT_SPESA_CATS).filter(x => x !== c) });
  }
  // Database Prodotti: stesso elenco (storicoProdotti) che alimenta il completamento
  // automatico del campo "Prodotto" nella Lista della spesa. Un prodotto scritto per la
  // prima volta lì si aggiunge da solo qui; da qui puoi anche ripulirlo manualmente
  // (es. refusi o articoli che non comprerai più) o aggiungerne uno in anticipo.
  function addProdotto() {
    if (!newProdotto.trim()) return;
    const attuali = data.storicoProdotti || [];
    if (!attuali.includes(newProdotto.trim())) {
      saveData({ storicoProdotti: [...attuali, newProdotto.trim()] });
    }
    setNewProdotto('');
  }
  function delProdotto(p) {
    saveData({ storicoProdotti: (data.storicoProdotti || []).filter(x => x !== p) });
  }
  function addTappa() {
    if (!newTappa.trim()) return;
    saveData({ tappeLista: [...(data.tappeLista || DEFAULT_TAPPE), newTappa.trim()] });
    setNewTappa('');
  }
  function delTappa(t) {
    saveData({ tappeLista: (data.tappeLista || DEFAULT_TAPPE).filter(x => x !== t) });
  }
  // Riordino delle tappe tramite numero digitato (invece delle freccette ▲▼):
  // l'ORDINE di questo elenco è quello che la Lista della spesa usa per raggruppare
  // gli articoli (prima tappa dell'elenco = prima da fare), quindi cambiare qui il
  // numero di posizione di una tappa equivale a spostarla nel percorso del giro di spesa.
  // Bozza locale mentre si digita (stesso pattern usato per i prezzi nella Lista della
  // spesa): il riordino vero e proprio avviene solo su blur/Invio, non ad ogni cifra.
  const [tappaPosDrafts, setTappaPosDrafts] = useState({});
  function tappaPosVal(t, idx) {
    return tappaPosDrafts[t] !== undefined ? tappaPosDrafts[t] : String(idx + 1);
  }
  function setTappaPosDraft(t, val) {
    setTappaPosDrafts(d => ({ ...d, [t]: val }));
  }
  function commitTappaPos(t, idx) {
    const lista = [...(data.tappeLista || DEFAULT_TAPPE)];
    const raw = tappaPosDrafts[t];
    setTappaPosDrafts(d => { const p = { ...d }; delete p[t]; return p; });
    if (raw === undefined) return;
    let nuovaPos = parseInt(raw, 10);
    if (isNaN(nuovaPos)) return;
    nuovaPos = Math.max(1, Math.min(lista.length, nuovaPos));
    const targetIdx = nuovaPos - 1;
    if (targetIdx === idx) return;
    const [item] = lista.splice(idx, 1);
    lista.splice(targetIdx, 0, item);
    saveData({ tappeLista: lista });
  }

  return (
    <div className="section active">
      <div className="card">
        <div className="setting-section">
          <div className="setting-label">Categorie spese</div>
          <div>{(data.categorie || DEFAULT_CATS).map(c => (
            <span className="cat-chip" key={c}>{c}<button onClick={() => delCat(c)}>✕</button></span>
          ))}</div>
          <div className="form-row" style={{marginTop:'10px'}}>
            <input type="text" placeholder="Nuova categoria..." value={newCat} onChange={e => setNewCat(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCat()} style={{flex:1}} />
            <button className="btn primary" onClick={addCat}>Aggiungi</button>
          </div>
        </div>

        <div className="setting-section" style={{marginTop:'20px'}}>
          <div className="setting-label">Categorie prodotti spesa</div>
          <div style={{fontSize:'12px',color:'var(--text3)',marginBottom:'8px'}}>
            Categorie usate nella Lista della spesa (es. Frutta e Verdura, Latticini...) per classificare il tipo di prodotto alimentare. Sono diverse dalle "Categorie spese" qui sopra, che invece servono al Budget familiare.
          </div>
          <div>{(data.categorieLista || DEFAULT_SPESA_CATS).map(c => (
            <span className="cat-chip" key={c}>{c}<button onClick={() => delCatSpesa(c)}>✕</button></span>
          ))}</div>
          <div className="form-row" style={{marginTop:'10px'}}>
            <input type="text" placeholder="Nuova categoria..." value={newCatSpesa} onChange={e => setNewCatSpesa(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCatSpesa()} style={{flex:1}} />
            <button className="btn primary" onClick={addCatSpesa}>Aggiungi</button>
          </div>
        </div>

        <div className="setting-section" style={{marginTop:'20px'}}>
          <div className="setting-label">Database Prodotti</div>
          <div style={{fontSize:'12px',color:'var(--text3)',marginBottom:'8px'}}>
            Elenco dei prodotti già scritti nella Lista della spesa: quando digiti un prodotto nuovo lì, si aggiunge qui da solo; da qui puoi anche ripulire refusi o aggiungerne uno in anticipo. Questo elenco è quello usato per i suggerimenti del campo "Prodotto".
          </div>
          <div>{[...(data.storicoProdotti || [])].sort((a, b) => a.localeCompare(b, 'it')).map(p => (
            <span className="cat-chip" key={p}>{p}<button onClick={() => delProdotto(p)}>✕</button></span>
          ))}</div>
          {(!data.storicoProdotti || data.storicoProdotti.length === 0) && <div className="empty" style={{padding:'12px'}}>Ancora nessun prodotto registrato</div>}
          <div className="form-row" style={{marginTop:'10px'}}>
            <input type="text" placeholder="Nuovo prodotto..." value={newProdotto} onChange={e => setNewProdotto(e.target.value)} onKeyDown={e => e.key === 'Enter' && addProdotto()} style={{flex:1}} />
            <button className="btn primary" onClick={addProdotto}>Aggiungi</button>
          </div>
        </div>

        <div className="setting-section" style={{marginTop:'20px'}}>
          <div className="setting-label">Tappe (negozi) lista spesa</div>
          <div style={{fontSize:'12px',color:'var(--text3)',marginBottom:'8px'}}>L'ordine qui sotto è quello del tuo giro di spesa: la prima tappa dell'elenco è quella da fare per prima. Scrivi il numero di posizione per spostare una tappa.</div>
          <div>{(data.tappeLista || DEFAULT_TAPPE).map((t, idx, arr) => (
            <div key={t} style={{display:'flex',alignItems:'center',gap:'8px',background:'var(--surface2)',border:'1px solid var(--border2)',borderRadius:'8px',padding:'8px 10px',marginBottom:'6px'}}>
              <input
                type="number"
                min="1"
                max={arr.length}
                inputMode="numeric"
                value={tappaPosVal(t, idx)}
                onChange={e => setTappaPosDraft(t, e.target.value)}
                onBlur={() => commitTappaPos(t, idx)}
                onKeyDown={e => e.key === 'Enter' && e.target.blur()}
                style={{width:'44px',padding:'6px 4px',fontSize:'13px',textAlign:'center',flexShrink:0}}
                title="Posizione nel giro di spesa"
              />
              <span style={{flex:1,fontSize:'14px'}}>{t}</span>
              <button className="btn small danger" onClick={() => delTappa(t)} title="Elimina tappa">✕</button>
            </div>
          ))}</div>
          <div className="form-row" style={{marginTop:'10px'}}>
            <input type="text" placeholder="Nuova tappa..." value={newTappa} onChange={e => setNewTappa(e.target.value)} onKeyDown={e => e.key === 'Enter' && addTappa()} style={{flex:1}} />
            <button className="btn primary" onClick={addTappa}>Aggiungi</button>
          </div>
        </div>
      </div>

      <div className="card" style={{marginTop:'8px'}}>
        <div className="setting-label" style={{marginBottom:'8px'}}>ℹ️ Informazioni</div>
        <div style={{fontSize:'13px',color:'var(--text2)',lineHeight:'1.6'}}>
          <p>I dati sono sincronizzati automaticamente via Firebase.</p>
          <p style={{marginTop:'6px'}}>Repository: <code style={{background:'var(--surface2)',padding:'1px 6px',borderRadius:'4px'}}>giorgiolucciola-lang/fcc</code></p>
        </div>
      </div>
    </div>
  );
}

// ── RENDER ─────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/fcc/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
