<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Control Center</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9B59B6">
<!-- Librerie ospitate in locale (cartella /vendor) per funzionamento offline -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<!-- Firebase (locale) -->
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #f8f5fc;
  --surface: #ffffff;
  --surface2: #f2edf8;
  --border: #e2d9f0;
  --border2: #c8b8e0;
  --accent: #9B59B6;
  --accent-light: #f0e8f8;
  --accent-dark: #7d3f9e;
  --text: #1a1520;
  --text2: #6a5878;
  --text3: #8a7799;
  --green: #16c462;
  --green-bg: #eafaf1;
  --green-border: #a9dfbf;
  --red: #e8312b;
  --red-bg: #fdf0ee;
  --red-border: #e8b0a8;
  --orange: #ff9f1c;
  --orange-bg: #fef5ec;
  --radius: 10px;
  --shadow: 0 2px 8px rgba(155,89,182,0.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* NAV */
nav {
  background: var(--accent);
  padding: 0;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(155,89,182,0.3);
}
.nav-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  max-width: 700px; margin: 0 auto;
}
.nav-title { color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 0.3px; display: flex; align-items: baseline; gap: 6px; }
.nav-version { color: rgba(255,255,255,0.55); font-size: 11px; font-weight: 500; letter-spacing: 0.2px; }
.nav-user { color: rgba(255,255,255,0.85); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.nav-tabs {
  display: flex; overflow-x: auto;
  padding: 0 8px 0;
  gap: 2px;
  scrollbar-width: none;
  max-width: 684px; margin: 0 auto;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 9px 14px; border: none; background: transparent;
  color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 500;
  cursor: pointer; border-bottom: 3px solid transparent;
  white-space: nowrap; transition: all 0.2s; flex-shrink: 0;
}
.tab-btn:hover { color: #fff; }
.tab-btn.active { color: #fff; border-bottom-color: #fff; }

/* SYNC BTN */
.sync-btn {
  padding: 5px 11px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.5);
  background: transparent; color: #fff;
  font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.sync-btn:hover { background: rgba(255,255,255,0.15); }
.sync-btn.syncing { opacity: 0.6; }
.print-btn {
  padding: 5px 11px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.5);
  background: transparent; color: #fff;
  font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.print-btn:hover { background: rgba(255,255,255,0.15); }

/* STAMPA: nasconde menu/pulsanti e mostra solo il contenuto della scheda attiva */
@media print {
  nav, .btn, .print-btn, .sync-btn, .spesa-delete, .tab-btn,
  .add-spesa-form, input, select { display: none !important; }
  body { background: #fff; color: #000; }
  .section { display: none; padding: 0; }
  .section.active { display: block !important; max-width: 100%; }
  .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; margin-bottom: 10px; }
  .print-title { display: block !important; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
}
.print-title { display: none; }

/* LAYOUT */
.section { display: none; padding: 16px; max-width: 700px; margin: 0 auto; }
.section.active { display: block; }

/* CARDS */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text); }

/* FORM ELEMENTS */
.form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.form-row label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); display: block; margin-bottom: 4px; }
.form-group { display: flex; flex-direction: column; flex: 1; min-width: 100px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  padding: 9px 12px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-size: 15px; font-family: inherit;
  outline: none; width: 100%; transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #fff; }

/* BUTTONS */
.btn {
  padding: 8px 16px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--surface);
  color: var(--text); font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn.danger { border-color: var(--red-border); color: var(--red); }
.btn.danger:hover { background: var(--red-bg); }
.btn.small { padding: 4px 10px; font-size: 12px; }

/* BUDGET TAB */
.budget-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
}
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-nav button { background: none; border: 1px solid var(--border2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 16px; color: var(--text2); }
.month-nav button:hover { border-color: var(--accent); color: var(--accent); }
.month-label { font-size: 16px; font-weight: 600; min-width: 140px; text-align: center; }

.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.summary-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 12px; text-align: center;
  box-shadow: var(--shadow);
}
.summary-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 6px; }
.summary-card .amount { font-size: 20px; font-weight: 700; }
.summary-card.entrate .amount { color: var(--green); }
.summary-card.uscite .amount { color: var(--red); }
.summary-card.saldo .amount { color: var(--accent); }

/* SPESE per giorno */
.day-group { margin-bottom: 18px; }
.day-header {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--accent);
  color: #fff;
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.day-header .day-total {
  margin-left: auto;
  font-size: 13px; font-weight: 700;
  opacity: 0.9;
}
.spesa-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 14px;
}
.spesa-cat { font-size: 11px; color: var(--text3); }
.spesa-desc { flex: 1 1 120px; font-weight: 500; min-width: 0; }
.spesa-amount { font-weight: 700; color: var(--red); white-space: nowrap; }
.spesa-delete { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 17px; padding: 6px 8px; border-radius: 6px; }
.spesa-delete:hover { color: var(--red); background: var(--red-bg); }

.add-spesa-form {
  background: var(--accent-light); border: 1px solid var(--border2);
  border-radius: 12px; padding: 14px; margin-bottom: 16px;
}

/* SCADENZE */
.scad-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 8px;
}
.scad-item.pagato { opacity: 0.55; }
.scad-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.scad-dot.verde { background: var(--green); }
.scad-dot.arancio { background: var(--orange); }
.scad-dot.rosso { background: var(--red); }
.scad-dot.giallo { background: #f4d03f; box-shadow: 0 0 0 2px rgba(244,208,63,0.35); }
.scad-info { flex: 1 1 150px; min-width: 0; }
.scad-name { font-size: 14px; font-weight: 600; }
.scad-date { font-size: 12px; color: var(--text3); }
.scad-amount { font-weight: 700; font-size: 15px; }
.scad-actions {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  justify-content: flex-end; margin-left: auto;
}

/* SPESA (lista) */
.spesa-lista-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 6px;
}
.spesa-lista-item > span { min-width: 0; word-break: break-word; }
.spesa-lista-item.checked { opacity: 0.5; text-decoration: line-through; }
.spesa-lista-item input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }

/* REPORT */
.report-cat-bar { margin-bottom: 10px; }
.report-cat-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.bar-bg { height: 8px; background: var(--border); border-radius: 4px; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s; }

/* IMPOSTAZIONI */
.setting-section { margin-bottom: 20px; }
.setting-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 10px; }
.cat-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 20px; padding: 4px 10px; margin: 4px;
  font-size: 13px;
}
.cat-chip button { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 14px; line-height: 1; }
.cat-chip button:hover { color: var(--red); }

/* LOGIN */
.login-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 80vh; gap: 20px; padding: 24px;
  text-align: center;
}
.login-title { font-size: 28px; font-weight: 700; color: var(--accent); }
.login-sub { color: var(--text2); font-size: 15px; max-width: 300px; }
.btn-google {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 24px; border-radius: 10px;
  border: 1px solid var(--border2); background: var(--surface);
  font-size: 15px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shadow); transition: all 0.2s;
}
.btn-google:hover { box-shadow: 0 4px 16px rgba(155,89,182,0.15); border-color: var(--accent); }

.empty { text-align: center; color: var(--text3); padding: 32px 16px; font-size: 14px; }
.badge-entrata { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); border-radius: 5px; font-size: 11px; font-weight: 600; padding: 2px 6px; }
.badge-uscita { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); border-radius: 5px; font-size: 11px; font-weight: 600; padding: 2px 6px; }

/* Entrate list */
.entrata-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 12px; background: var(--green-bg);
  border: 1px solid var(--green-border); border-radius: 8px;
  margin-bottom: 6px;
}
.entrata-item .spesa-desc { color: var(--green); }
.entrata-item .spesa-amount { color: var(--green); }

/* ── SCHERMI STRETTI (iPhone) ─────────────────────────────────────────── */
@media (max-width: 480px) {
  .nav-top { padding: 9px 12px; }
  .nav-title { font-size: 14px; }
  .nav-user { gap: 6px; font-size: 12px; }
  .print-btn, .sync-btn { padding: 6px 10px; font-size: 11px; }
  .nav-tabs { padding: 0 4px 0; }
  .tab-btn { padding: 9px 10px; font-size: 12px; }

  .section { padding: 12px; }
  .card { padding: 13px; }

  .summary-grid { gap: 8px; }
  .summary-card { padding: 11px 6px; }
  .summary-card .label { font-size: 10px; }
  .summary-card .amount { font-size: 16px; word-break: break-word; }

  .month-label { font-size: 14px; min-width: 0; }

  .btn.small { padding: 7px 11px; font-size: 12px; }
  .scad-actions .btn.small { padding: 7px 10px; }

  .form-group { min-width: 90px; }

  .spesa-lista-item input[type=number] { width: 52px; font-size: 13px; padding: 6px 4px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// Versione dell'app mostrata accanto al titolo: aggiornala insieme a CACHE_VERSION in sw.js ad ogni deploy
const APP_VERSION = "v9";

// ── FIREBASE CONFIG ────────────────────────────────────────────────────────────
// ⚠️ SOSTITUISCI questi valori con le tue credenziali Firebase
// Le trovi su: console.firebase.google.com → Il tuo progetto → Impostazioni → Le tue app
const firebaseConfig = {
  apiKey: "AIzaSyDWcRC7Zf8NX2OJU197UVvZ23Gy6_SWQtw",
  authDomain: "family-control-center-4ae38.firebaseapp.com",
  projectId: "family-control-center-4ae38",
  storageBucket: "family-control-center-4ae38.firebasestorage.app",
  messagingSenderId: "722999772560",
  appId: "1:722999772560:web:f06617ba41dee3f9ebdf15"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

// ── PERSISTENZA OFFLINE ──────────────────────────────────────────────────────
// Salva i dati in locale (IndexedDB) così la lista, le spese e le scadenze
// restano leggibili e modificabili anche senza connessione. Le modifiche fatte
// offline vengono messe in coda e sincronizzate da sole appena torna internet.
db.enablePersistence({ synchronizeTabs: true }).catch(() => {
  // Può fallire se il browser non la supporta o se ci sono più schede aperte:
  // in quel caso l'app funziona comunque, solo senza cache offline dei dati.
});

// ── UTILS ──────────────────────────────────────────────────────────────────────
function localDateStr(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
// Converte una data in formato ISO (yyyy-mm-dd) nel formato italiano breve gg/mm/aaaa
function formatDataIT(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}
function formatEuro(n) {
  return '€ ' + Number(n || 0).toFixed(2).replace('.', ',');
}
function monthLabel(y, m) {
  return new Date(y, m - 1, 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
}
function dayLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - date) / 86400000);
  if (diff === 0) return 'Oggi';
  if (diff === 1) return 'Ieri';
  return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
}
function scadenzaColor(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((date - today) / 86400000);
  if (diff < 0) return 'rosso';
  if (diff <= 5) return 'arancio';
  return 'verde';
}
// Verifica se una data (yyyy-mm-dd) cade nel mese solare corrente (oggi)
function isMeseCorrente(dateStr) {
  const [y, m] = dateStr.split('-').map(Number);
  const oggi = new Date();
  return y === oggi.getFullYear() && m === (oggi.getMonth() + 1);
}
function addMonthsToDateStr(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  date.setMonth(date.getMonth() + n);
  return localDateStr(date);
}
// Genera occorrenze future per una scadenza ricorrente (fissa mensile o periodica multi-mese)
function generaOccorrenze(scadenza, count = 12) {
  const occorrenze = [];
  for (let i = 1; i <= count; i++) {
    const intervallo = scadenza.tipoRicorrenza === 'fissa' ? 1 : Number(scadenza.intervalloMesi || 1);
    occorrenze.push({
      id: scadenza.id + i, // id derivato, univoco e stabile
      nome: scadenza.nome,
      amount: scadenza.amount,
      date: addMonthsToDateStr(scadenza.date, intervallo * i),
      ricorrente: true,
      tipoRicorrenza: scadenza.tipoRicorrenza,
      intervalloMesi: scadenza.intervalloMesi || null,
      gruppoId: scadenza.id,
      pagato: false,
    });
  }
  return occorrenze;
}

// ── DEFAULT DATA ───────────────────────────────────────────────────────────────
const DEFAULT_CATS = ['Casa', 'Cibo', 'Trasporti', 'Salute', 'Svago', 'Abbigliamento', 'Altro'];
const DEFAULT_SPESA_CATS = ['Frutta e Verdura', 'Carne e Pesce', 'Latticini', 'Pane e Cereali', 'Bevande', 'Pulizia', 'Altro'];

// ── MAIN APP ───────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('budget');
  const [syncing, setSyncing] = useState(false);
  const [data, setData] = useState(null);

  useEffect(() => {
    const timeout = setTimeout(() => setLoading(false), 6000);
    const unsub = auth.onAuthStateChanged(u => {
      clearTimeout(timeout);
      setUser(u || null);
      setLoading(false);
    }, () => {
      clearTimeout(timeout);
      setLoading(false);
    });
    return () => { unsub(); clearTimeout(timeout); };
  }, []);

  useEffect(() => {
    if (!user) return;
    const ref = db.collection('users').doc(user.uid);
    // includeMetadataChanges: true → il listener viene richiamato anche quando
    // cambia solo la "provenienza" dello snapshot (cache locale → server),
    // anche se i dati non sono cambiati. Serve per poter distinguere con
    // certezza un documento davvero inesistente da un semplice "non ancora
    // arrivato dal server" (es. dopo aver svuotato la cache o reinstallato la PWA).
    const unsub = ref.onSnapshot({ includeMetadataChanges: true }, snap => {
      if (snap.exists) {
        setData(snap.data());
      } else if (!snap.metadata.fromCache) {
        // Il server ha confermato che il documento non esiste davvero:
        // solo ora è sicuro creare i dati iniziali vuoti.
        const init = {
          spese: [],
          entrate: [],
          scadenze: [],
          listaSpesa: [],
          categorie: DEFAULT_CATS,
          categorieLista: DEFAULT_SPESA_CATS,
          budgetMensile: 2000,
        };
        ref.set(init);
        setData(init);
      }
      // else: lo snapshot "vuoto" arriva dalla cache locale, non dal server.
      // Non facciamo nulla e aspettiamo la conferma reale, per non rischiare
      // di sovrascrivere dati veri già presenti sul server.
    }, () => {
      // Errore di lettura (es. offline senza cache locale): non facciamo nulla,
      // resta la schermata di caricamento invece di creare dati vuoti.
    });
    return unsub;
  }, [user]);

  async function saveData(newData) {
    if (!user) return;
    const merged = { ...data, ...newData };
    setData(merged);
    setSyncing(true);
    try {
      await db.collection('users').doc(user.uid).set(merged);
    } finally {
      setSyncing(false);
    }
  }

  // ── Aggiornamenti "sicuri" per gli elenchi critici (spese, entrate, scadenze, listaSpesa) ──
  // A differenza di saveData (che riscrive TUTTO il documento con i dati che l'app ha in quel
  // momento), queste funzioni usano le operazioni atomiche di Firebase arrayUnion/arrayRemove:
  // agiscono solo sulla singola voce toccata, quindi due salvataggi ravvicinati (anche da
  // dispositivi diversi, anche offline) non possono più cancellarsi a vicenda.
  async function applyUpdate(updateObj) {
    if (!user || !Object.keys(updateObj).length) return;
    setSyncing(true);
    try {
      await db.collection('users').doc(user.uid).update(updateObj);
    } finally {
      setSyncing(false);
    }
  }
  function addItems(field, items) {
    if (!items || !items.length) return Promise.resolve();
    return applyUpdate({ [field]: firebase.firestore.FieldValue.arrayUnion(...items) });
  }
  function removeItems(field, items) {
    if (!items || !items.length) return Promise.resolve();
    return applyUpdate({ [field]: firebase.firestore.FieldValue.arrayRemove(...items) });
  }
  async function updateItem(field, oldItem, newItem) {
    await removeItems(field, [oldItem]);
    await addItems(field, [newItem]);
  }

  function login() { auth.signInWithPopup(provider); }
  function logout() { auth.signOut(); setData(null); }

  if (loading) return <div style={{textAlign:'center',padding:'60px',color:'var(--text3)'}}>Caricamento...</div>;

  if (!user) return (
    <div className="login-screen">
      <div style={{fontSize:'48px'}}>💜</div>
      <div className="login-title">Family Control Center</div>
      <div className="login-sub">Accedi per gestire budget, spese, scadenze e lista della spesa</div>
      <button className="btn-google" onClick={login}>
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Accedi con Google
      </button>
    </div>
  );

  if (!data && user) return <div style={{textAlign:'center',padding:'60px',color:'var(--text3)'}}>Caricamento dati...</div>;

  const tabs = [
    { id: 'budget', label: '💰 Budget' },
    { id: 'scadenze', label: '📅 Scadenze' },
    { id: 'spesa', label: '🛒 Spesa' },
    { id: 'report', label: '📊 Report' },
    { id: 'impostazioni', label: '⚙️ Impostazioni' },
  ];

  return (
    <div>
      <nav>
        <div className="nav-top">
          <div className="nav-title">💜 Family CC <span className="nav-version">{APP_VERSION}</span></div>
          <div className="nav-user">
            <span style={{display:'none',fontSize:'12px'}}>{user.displayName?.split(' ')[0]}</span>
            <button className="print-btn" onClick={() => window.print()} title="Stampa la scheda corrente">
              🖨️ Stampa
            </button>
            <button className={`sync-btn${syncing?' syncing':''}`} onClick={logout}>
              {syncing ? '🔄 Sync...' : '☁️ Esci'}
            </button>
          </div>
        </div>
        <div className="nav-tabs">
          {tabs.map(t => (
            <button key={t.id} className={`tab-btn${tab===t.id?' active':''}`} onClick={() => setTab(t.id)}>
              {t.label}
            </button>
          ))}
        </div>
      </nav>

      {tab === 'budget' && <BudgetTab data={data} saveData={saveData} addItems={addItems} removeItems={removeItems} updateItem={updateItem} />}
      {tab === 'scadenze' && <ScadenzeTab data={data} saveData={saveData} addItems={addItems} removeItems={removeItems} updateItem={updateItem} />}
      {tab === 'spesa' && <SpesaTab data={data} saveData={saveData} addItems={addItems} removeItems={removeItems} updateItem={updateItem} applyUpdate={applyUpdate} />}
      {tab === 'report' && <ReportTab data={data} />}
      {tab === 'impostazioni' && <ImpostazioniTab data={data} saveData={saveData} />}
    </div>
  );
}

// ── BUDGET TAB ─────────────────────────────────────────────────────────────────
function BudgetTab({ data, saveData, addItems, removeItems, updateItem }) {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const [showAddSpesa, setShowAddSpesa] = useState(false);
  const [showAddEntrata, setShowAddEntrata] = useState(false);
  const [form, setForm] = useState({ desc: '', amount: '', cat: '', subcat: '', date: localDateStr() });
  const [formE, setFormE] = useState({ desc: '', amount: '', date: localDateStr() });
  const [newCatInline, setNewCatInline] = useState('');
  const [showNewCat, setShowNewCat] = useState(false);
  const [newSubcatInline, setNewSubcatInline] = useState('');
  const [showNewSubcat, setShowNewSubcat] = useState(false);
  const [editSpesaId, setEditSpesaId] = useState(null);
  const [editSpesaForm, setEditSpesaForm] = useState({ desc: '', amount: '', cat: '', subcat: '', date: '' });

  function addCatInline() {
    if (!newCatInline.trim()) return;
    const cats = [...(data.categorie || DEFAULT_CATS), newCatInline.trim()];
    saveData({ categorie: cats });
    setForm(f => ({ ...f, cat: newCatInline.trim() }));
    setNewCatInline('');
    setShowNewCat(false);
  }

  function addSubcatInline() {
    if (!newSubcatInline.trim() || !form.cat) return;
    const subcats = { ...(data.sottocategorie || {}) };
    if (!subcats[form.cat]) subcats[form.cat] = [];
    subcats[form.cat] = [...subcats[form.cat], newSubcatInline.trim()];
    saveData({ sottocategorie: subcats });
    setForm(f => ({ ...f, subcat: newSubcatInline.trim() }));
    setNewSubcatInline('');
    setShowNewSubcat(false);
  }

  function prevMonth() {
    if (month === 1) { setMonth(12); setYear(y => y - 1); }
    else setMonth(m => m - 1);
  }
  function nextMonth() {
    if (month === 12) { setMonth(1); setYear(y => y + 1); }
    else setMonth(m => m + 1);
  }

  const speseMese = (data.spese || []).filter(s => {
    const [sy, sm] = s.date.split('-').map(Number);
    return sy === year && sm === month;
  });
  const entrateMese = (data.entrate || []).filter(e => {
    const [ey, em] = e.date.split('-').map(Number);
    return ey === year && em === month;
  });

  const totSpese = speseMese.reduce((a, s) => a + Number(s.amount), 0);
  const totEntrate = entrateMese.reduce((a, e) => a + Number(e.amount), 0);
  const scadenzeMese = (data.scadenze || []).filter(sc => {
    const [scy, scm] = sc.date.split('-').map(Number);
    return scy === year && scm === month;
  });
  const totScadenze = scadenzeMese.reduce((a, sc) => a + Number(sc.amount || 0), 0);
  const saldo = totEntrate - totSpese - totScadenze;

  // Raggruppa spese per giorno, ordine cronologico inverso (giorno più recente in cima)
  const spesePorGiorno = {};
  for (const s of speseMese) {
    if (!spesePorGiorno[s.date]) spesePorGiorno[s.date] = [];
    spesePorGiorno[s.date].push(s);
  }
  // Ordina le chiavi (giorni) dal più recente al più vecchio
  const giorniOrdinati = Object.keys(spesePorGiorno).sort((a, b) => b.localeCompare(a));
  // Ordina le spese dentro ogni giorno: più recente in cima (usa id/timestamp)
  for (const g of giorniOrdinati) {
    spesePorGiorno[g].sort((a, b) => (b.id || 0) - (a.id || 0));
  }

  function addSpesa() {
    if (!form.desc || !form.amount) return;
    const s = { id: Date.now(), desc: form.desc, amount: Number(form.amount), cat: form.cat || 'Altro', subcat: form.subcat || '', date: form.date };
    addItems('spese', [s]);
    setForm({ desc: '', amount: '', cat: '', subcat: '', date: localDateStr() });
    setShowAddSpesa(false);
  }
  function deleteSpesa(item) {
    removeItems('spese', [item]);
  }
  function startEditSpesa(s) {
    setEditSpesaId(s.id);
    setEditSpesaForm({ desc: s.desc, amount: s.amount, cat: s.cat || '', subcat: s.subcat || '', date: s.date });
  }
  function cancelEditSpesa() {
    setEditSpesaId(null);
  }
  function saveEditSpesa(oldItem) {
    if (!editSpesaForm.desc || !editSpesaForm.amount) return;
    const newItem = { ...oldItem, desc: editSpesaForm.desc, amount: Number(editSpesaForm.amount), cat: editSpesaForm.cat || 'Altro', subcat: editSpesaForm.subcat || '', date: editSpesaForm.date };
    updateItem('spese', oldItem, newItem);
    setEditSpesaId(null);
  }
  function addEntrata() {
    if (!formE.desc || !formE.amount) return;
    const e = { id: Date.now(), desc: formE.desc, amount: Number(formE.amount), date: formE.date };
    addItems('entrate', [e]);
    setFormE({ desc: '', amount: '', date: localDateStr() });
    setShowAddEntrata(false);
  }
  function deleteEntrata(item) {
    removeItems('entrate', [item]);
  }

  return (
    <div className="section active">
      <div className="print-title">💜 Family CC — Budget — {monthLabel(year, month)}</div>
      <div className="budget-header">
        <div className="month-nav">
          <button onClick={prevMonth}>‹</button>
          <div className="month-label">{monthLabel(year, month)}</div>
          <button onClick={nextMonth}>›</button>
        </div>
      </div>

      <div className="summary-grid">
        <div className="summary-card entrate">
          <div className="label">Entrate</div>
          <div className="amount">{formatEuro(totEntrate)}</div>
        </div>
        <div className="summary-card uscite">
          <div className="label">Uscite</div>
          <div className="amount">{formatEuro(totSpese + totScadenze)}</div>
        </div>
        <div className="summary-card saldo">
          <div className="label">Saldo</div>
          <div className="amount" style={{color: saldo >= 0 ? 'var(--green)' : 'var(--red)'}}>{formatEuro(saldo)}</div>
        </div>
      </div>
      {totScadenze > 0 && (
        <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'14px',marginTop:'-6px',textAlign:'center'}}>
          di cui {formatEuro(totScadenze)} di scadenze in questo mese
        </div>
      )}

      {/* ENTRATE */}
      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0}}>💚 Entrate</div>
          <button className="btn small" style={{borderColor:'var(--green-border)',color:'var(--green)'}} onClick={() => setShowAddEntrata(v => !v)}>
            {showAddEntrata ? '✕ Annulla' : '+ Aggiungi'}
          </button>
        </div>

        {showAddEntrata && (
          <div className="add-spesa-form" style={{background:'var(--green-bg)',borderColor:'var(--green-border)'}}>
            <div className="form-row">
              <div className="form-group" style={{flex:2}}>
                <label>Descrizione</label>
                <input type="text" placeholder="Es. Stipendio" value={formE.desc} onChange={e => setFormE(f => ({...f, desc: e.target.value}))} />
              </div>
              <div className="form-group">
                <label>Importo €</label>
                <input type="number" placeholder="0.00" value={formE.amount} onChange={e => setFormE(f => ({...f, amount: e.target.value}))} />
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Data</label>
                <input type="date" value={formE.date} onChange={e => setFormE(f => ({...f, date: e.target.value}))} />
              </div>
            </div>
            <button className="btn primary" style={{background:'var(--green)',borderColor:'var(--green)'}} onClick={addEntrata}>💾 Salva entrata</button>
          </div>
        )}

        {entrateMese.length === 0 && <div className="empty">Nessuna entrata questo mese</div>}
        {entrateMese.slice().sort((a,b) => b.date.localeCompare(a.date)).map(e => (
          <div className="entrata-item" key={e.id}>
            <div style={{flex:1}}>
              <div className="spesa-desc">{e.desc}</div>
              <div className="spesa-cat">{formatDataIT(e.date)}</div>
            </div>
            <div className="spesa-amount">{formatEuro(e.amount)}</div>
            <button className="spesa-delete" onClick={() => deleteEntrata(e)}>🗑</button>
          </div>
        ))}
      </div>

      {/* SPESE */}
      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0}}>💸 Spese</div>
          <button className="btn primary small" onClick={() => setShowAddSpesa(v => !v)}>
            {showAddSpesa ? '✕ Annulla' : '+ Aggiungi'}
          </button>
        </div>

        {showAddSpesa && (
          <div className="add-spesa-form">
            <div className="form-row">
              <div className="form-group" style={{flex:2}}>
                <label>Descrizione</label>
                <input type="text" placeholder="Es. Supermercato" value={form.desc} onChange={e => setForm(f => ({...f, desc: e.target.value}))} />
              </div>
              <div className="form-group">
                <label>Importo €</label>
                <input type="number" placeholder="0.00" step="0.01" min="0" value={form.amount} onChange={e => setForm(f => ({...f, amount: e.target.value}))} />
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Categoria</label>
                <select value={form.cat} onChange={e => { setForm(f => ({...f, cat: e.target.value, subcat: ''})); setShowNewCat(false); }}>
                  <option value="">Seleziona...</option>
                  {(data.categorie || DEFAULT_CATS).map(c => <option key={c}>{c}</option>)}
                </select>
                {!showNewCat && <button type="button" onClick={() => setShowNewCat(true)} className="btn small" style={{marginTop:'6px',borderColor:'var(--accent)',color:'var(--accent)'}}>+ Nuova categoria</button>}
                {showNewCat && <div style={{display:'flex',gap:'4px',marginTop:'4px'}}>
                  <input type="text" placeholder="Nome categoria" value={newCatInline} onChange={e => setNewCatInline(e.target.value)} onKeyDown={e => e.key==='Enter' && addCatInline()} style={{fontSize:'13px',padding:'4px 8px'}} />
                  <button type="button" className="btn primary small" onClick={addCatInline}>✓</button>
                  <button type="button" className="btn small" onClick={() => setShowNewCat(false)}>✕</button>
                </div>}
              </div>
              <div className="form-group">
                <label>Data</label>
                <input type="date" value={form.date} onChange={e => setForm(f => ({...f, date: e.target.value}))} />
              </div>
            </div>
            {form.cat && (
              <div className="form-row">
                <div className="form-group">
                  <label>Sottocategoria <span style={{fontWeight:'400',color:'var(--text3)'}}>(opzionale)</span></label>
                  <select value={form.subcat} onChange={e => setForm(f => ({...f, subcat: e.target.value}))}>
                    <option value="">Nessuna</option>
                    {((data.sottocategorie || {})[form.cat] || []).map(s => <option key={s}>{s}</option>)}
                  </select>
                  {!showNewSubcat && <button type="button" onClick={() => setShowNewSubcat(true)} className="btn small" style={{marginTop:'6px',borderColor:'var(--accent)',color:'var(--accent)'}}>+ Nuova sottocategoria</button>}
                  {showNewSubcat && <div style={{display:'flex',gap:'4px',marginTop:'4px'}}>
                    <input type="text" placeholder="Nome sottocategoria" value={newSubcatInline} onChange={e => setNewSubcatInline(e.target.value)} onKeyDown={e => e.key==='Enter' && addSubcatInline()} style={{fontSize:'13px',padding:'4px 8px'}} />
                    <button type="button" className="btn primary small" onClick={addSubcatInline}>✓</button>
                    <button type="button" className="btn small" onClick={() => setShowNewSubcat(false)}>✕</button>
                  </div>}
                </div>
              </div>
            )}
            <button className="btn primary" onClick={addSpesa}>💾 Salva spesa</button>
          </div>
        )}

        {giorniOrdinati.length === 0 && <div className="empty">Nessuna spesa questo mese</div>}

        {giorniOrdinati.map(giorno => (
          <div className="day-group" key={giorno}>
            <div className="day-header">
              <span>{dayLabel(giorno)}</span>
              <span className="day-total">
                {formatEuro(spesePorGiorno[giorno].reduce((a, s) => a + Number(s.amount), 0))}
              </span>
            </div>
            {spesePorGiorno[giorno].map(s => (
              <div key={s.id}>
                <div className="spesa-item">
                  <div style={{flex:1}}>
                    <div className="spesa-desc">{s.desc}</div>
                    <div className="spesa-cat">{s.cat}{s.subcat ? ` › ${s.subcat}` : ''}</div>
                  </div>
                  <div className="spesa-amount">{formatEuro(s.amount)}</div>
                  <button className="btn small" onClick={() => startEditSpesa(s)}>✏️</button>
                  <button className="spesa-delete" onClick={() => deleteSpesa(s)}>🗑</button>
                </div>
                {editSpesaId === s.id && (
                  <div className="add-spesa-form" style={{marginTop:'-4px',marginBottom:'10px'}}>
                    <div className="form-row">
                      <div className="form-group" style={{flex:2}}>
                        <label>Descrizione</label>
                        <input type="text" value={editSpesaForm.desc} onChange={e => setEditSpesaForm(f => ({...f, desc: e.target.value}))} />
                      </div>
                      <div className="form-group">
                        <label>Importo €</label>
                        <input type="number" step="0.01" min="0" value={editSpesaForm.amount} onChange={e => setEditSpesaForm(f => ({...f, amount: e.target.value}))} />
                      </div>
                    </div>
                    <div className="form-row">
                      <div className="form-group">
                        <label>Categoria</label>
                        <select value={editSpesaForm.cat} onChange={e => setEditSpesaForm(f => ({...f, cat: e.target.value, subcat: ''}))}>
                          <option value="">Seleziona...</option>
                          {(data.categorie || DEFAULT_CATS).map(c => <option key={c}>{c}</option>)}
                        </select>
                      </div>
                      <div className="form-group">
                        <label>Data</label>
                        <input type="date" value={editSpesaForm.date} onChange={e => setEditSpesaForm(f => ({...f, date: e.target.value}))} />
                      </div>
                    </div>
                    {editSpesaForm.cat && (
                      <div className="form-row">
                        <div className="form-group">
                          <label>Sottocategoria <span style={{fontWeight:'400',color:'var(--text3)'}}>(opzionale)</span></label>
                          <select value={editSpesaForm.subcat} onChange={e => setEditSpesaForm(f => ({...f, subcat: e.target.value}))}>
                            <option value="">Nessuna</option>
                            {((data.sottocategorie || {})[editSpesaForm.cat] || []).map(sc => <option key={sc}>{sc}</option>)}
                          </select>
                        </div>
                      </div>
                    )}
                    <div style={{display:'flex',gap:'8px'}}>
                      <button className="btn primary" onClick={() => saveEditSpesa(s)}>💾 Salva modifica</button>
                      <button className="btn" onClick={cancelEditSpesa}>✕ Annulla</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── SCADENZE TAB ───────────────────────────────────────────────────────────────
function ScadenzeTab({ data, saveData, addItems, removeItems, updateItem }) {
  const [show, setShow] = useState(false);
  const [form, setForm] = useState({ nome: '', amount: '', date: '', tipo: 'singola', intervalloMesi: '1' });
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({ nome: '', amount: '', date: '' });
  const [editScope, setEditScope] = useState('singola'); // 'singola' | 'gruppo'

  function add() {
    if (!form.nome || !form.date) return;
    const baseId = Date.now();
    const base = {
      id: baseId,
      nome: form.nome,
      amount: Number(form.amount),
      date: form.date,
      pagato: false,
      tipoRicorrenza: form.tipo === 'singola' ? null : (form.tipo === 'fissa' ? 'fissa' : 'periodica'),
      intervalloMesi: form.tipo === 'periodica' ? Number(form.intervalloMesi || 1) : null,
      gruppoId: null,
      ricorrente: form.tipo !== 'singola',
    };
    let nuove = [base];
    if (form.tipo === 'fissa' || form.tipo === 'periodica') {
      nuove = nuove.concat(generaOccorrenze(base, 12));
    }
    addItems('scadenze', nuove);
    setForm({ nome: '', amount: '', date: '', tipo: 'singola', intervalloMesi: '1' });
    setShow(false);
  }
  function togglePagato(item) {
    updateItem('scadenze', item, { ...item, pagato: !item.pagato });
  }
  function del(item) {
    removeItems('scadenze', [item]);
  }
  function delGruppo(gruppoId, scadenzaId) {
    const daRimuovere = (data.scadenze || []).filter(s => s.id === scadenzaId || s.gruppoId === gruppoId || s.id === gruppoId);
    removeItems('scadenze', daRimuovere);
  }
  // Estende un gruppo ricorrente generando altre 12 occorrenze a partire dall'ultima esistente
  function estendiGruppo(gruppoId) {
    const tutte = data.scadenze || [];
    const delGruppoList = tutte.filter(s => s.id === gruppoId || s.gruppoId === gruppoId);
    if (delGruppoList.length === 0) return;
    const ultima = [...delGruppoList].sort((a, b) => b.date.localeCompare(a.date))[0];
    const finte = generaOccorrenze({ ...ultima, id: ultima.id, date: ultima.date }, 12);
    addItems('scadenze', finte);
  }

  function startEdit(s) {
    setEditId(s.id);
    setEditForm({ nome: s.nome, amount: s.amount || '', date: s.date });
    setEditScope('singola');
  }
  function cancelEdit() {
    setEditId(null);
  }
  async function saveEdit(s) {
    if (!editForm.nome) return;
    const gruppoKey = s.gruppoId || s.id; // id del gruppo "padre"
    if (editScope === 'gruppo' && s.ricorrente) {
      // Applica nome + importo a tutte le occorrenze future non pagate dello stesso gruppo
      // (la data resta individuale per ciascuna rata, non viene toccata)
      const daAggiornare = (data.scadenze || []).filter(item => {
        const stessoGruppo = item.id === gruppoKey || item.gruppoId === gruppoKey;
        return stessoGruppo && !item.pagato;
      });
      const aggiornate = daAggiornare.map(item => ({ ...item, nome: editForm.nome, amount: Number(editForm.amount) }));
      await removeItems('scadenze', daAggiornare);
      await addItems('scadenze', aggiornate);
    } else {
      // Solo questa singola rata
      const newItem = { ...s, nome: editForm.nome, amount: Number(editForm.amount), date: editForm.date };
      await updateItem('scadenze', s, newItem);
    }
    setEditId(null);
  }

  const sorted = [...(data.scadenze || [])].sort((a, b) => a.date.localeCompare(b.date));

  function tipoLabel(s) {
    if (!s.ricorrente) return null;
    if (s.tipoRicorrenza === 'fissa') return '🔄 Mensile fissa';
    if (s.tipoRicorrenza === 'periodica') return `🔄 Ogni ${s.intervalloMesi} mesi`;
    return '🔄 Ricorrente';
  }

  // Stato unificato: testo + colore del pulsante, in base a pagato/scadenza
  function statoBtn(s) {
    if (s.pagato) return { label: '✓ Pagata', bg: 'var(--green)', border: 'var(--green)', color: '#fff' };
    const col = scadenzaColor(s.date); // 'rosso' | 'arancio' | 'verde'

        <span style={{display:'inline-flex',alignItems:'center',gap:'4px',marginRight:'12px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'3px',background:'var(--surface2)',border:'1px solid var(--border2)'}}></span> programmata</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px',marginRight:'12px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'3px',background:'var(--green)'}}></span> pagata</span>

              <input type="date" value={form.date} onChange={e => setForm(f => ({...f, date: e.target.value}))} />
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Tipo scadenza</label>
              <select value={form.tipo} onChange={e => setForm(f => ({...f, tipo: e.target.value}))}>
                <option value="singola">Singola (una sola data)</option>
                <option value="fissa">Mensile fissa (ogni mese, stesso giorno)</option>
                <option value="periodica">Periodica multi-mese (ogni N mesi)</option>

            </div>
            {form.tipo === 'periodica' && (
              <div className="form-group">
                <label>Ogni quanti mesi</label>
                <select value={form.intervalloMesi} onChange={e => setForm(f => ({...f, intervalloMesi: e.target.value}))}>
                  <option value="2">2 mesi</option>
                  <option value="3">3 mesi</option>
                  <option value="4">4 mesi</option>
                  <option value="6">6 mesi</option>

      {sorted.length === 0 && <div className="empty">Nessuna scadenza</div>}

      {sorted.map(s => {

            <div className="scad-info">
              <div className="scad-name">{s.nome} {tipoLabel(s) && <span style={{fontSize:'11px',color:'var(--text3)'}}>{tipoLabel(s)}</span>}</div>
              <div className="scad-date">{new Date(...s.date.split('-').map((v,i)=>i===1?v-1:Number(v))).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}</div>

            <div className="scad-actions">
              <div className="scad-amount">{s.amount ? formatEuro(s.amount) : ''}</div>

              <button className="btn small danger" onClick={() => del(s)}>🗑</button>

          {editId === s.id && (

                <div className="form-group">
                  <label>Importo €</label>
                  <input type="number" step="0.01" min="0" value={editForm.amount} onChange={e => setEditForm(f => ({...f, amount: e.target.value}))} />
                </div>
              </div>
              {editScope === 'singola' && (
                <div className="form-row">
                  <div className="form-group">
                    <label>Data</label>
                    <input type="date" value={editForm.date} onChange={e => setEditForm(f => ({...f, date: e.target.value}))} />

              )}
              <div style={{display:'flex',gap:'8px'}}>

          )}
        </div>
        );
      })}
    </div>
  );
}

// ── SPESA TAB ──────────────────────────────────────────────────────────────────
function SpesaTab({ data, saveData, addItems, removeItems, updateItem, applyUpdate }) {
  const [show, setShow] = useState(false);
  const [form, setForm] = useState({ nome: '', cat: '', qta: '1', prezzoUnitario: '', prezzoTotale: '' });
  const [newCatInline, setNewCatInline] = useState('');
  const [showNewCat, setShowNewCat] = useState(false);
  // Articolo per cui è aperto il riquadro "prezzo rapido" (flusso spunta+prezzo in un solo tocco)
  const [quickPriceId, setQuickPriceId] = useState(null);
  const [quickPrice, setQuickPrice] = useState('');
  const quickPriceInputRef = useRef(null);

  // Elenco categorie robusto: se l'array è vuoto o assente, usa i default
  const catList = (data.categorieLista && data.categorieLista.length) ? data.categorieLista : DEFAULT_SPESA_CATS;

  useEffect(() => {
    if (quickPriceId && quickPriceInputRef.current) {
      quickPriceInputRef.current.focus();
    }
  }, [quickPriceId]);

  function addCatInline() {
    if (!newCatInline.trim()) return;
    const cats = [...catList, newCatInline.trim()];
    saveData({ categorieLista: cats });
    setForm(f => ({ ...f, cat: newCatInline.trim() }));
    setNewCatInline('');
    setShowNewCat(false);
  }

  function add() {
    if (!form.nome) return;
    const item = { id: Date.now(), nome: form.nome, cat: form.cat || 'Altro', qta: form.qta || '1', prezzoUnitario: form.prezzoUnitario || '', prezzoTotale: form.prezzoTotale || '', checked: false };
    addItems('listaSpesa', [item]);
    setForm({ nome: '', cat: '', qta: '1', prezzoUnitario: '', prezzoTotale: '' });
  }
  // Quando cambia il prezzo unitario nel form di aggiunta, ricalcola in automatico il totale (Qtà × prezzo unit.)
  function handleFormUnitChange(val) {
    const qtaNum = parseFloat(form.qta);
    const unitNum = parseFloat(val);
    const totaleAuto = (!isNaN(qtaNum) && !isNaN(unitNum)) ? String(Math.round(qtaNum * unitNum * 100) / 100) : form.prezzoTotale;
    setForm(f => ({ ...f, prezzoUnitario: val, prezzoTotale: totaleAuto }));
  }
  function toggle(item) {
    if (item.checked) {
      // Da "già preso" a "da prendere": semplice riapertura, nessun prezzo da chiedere
      updateItem('listaSpesa', item, { ...item, checked: false });
      return;
    }
    // Da "da prendere" a "preso": se ha già un prezzo, spunta subito senza chiedere altro.
    // Altrimenti apre il riquadro "prezzo rapido" per inserirlo e confermare in un solo tocco.
    if (Number(item.prezzoTotale) > 0) {
      updateItem('listaSpesa', item, { ...item, checked: true });
    } else {
      setQuickPrice('');
      setQuickPriceId(item.id);
    }
  }
  // Conferma del riquadro "prezzo rapido": salva il prezzo (se inserito) e spunta l'articolo, in un solo aggiornamento
  function confermaQuickPrice(item) {
    const qtaNum = parseFloat(item.qta);
    const unitNum = parseFloat(quickPrice);
    const totaleAuto = (!isNaN(qtaNum) && !isNaN(unitNum)) ? String(Math.round(qtaNum * unitNum * 100) / 100) : (quickPrice || item.prezzoTotale || '');
    updateItem('listaSpesa', item, { ...item, prezzoUnitario: quickPrice || item.prezzoUnitario, prezzoTotale: totaleAuto, checked: true });
    setQuickPriceId(null);
    setQuickPrice('');
  }
  // Spunta senza inserire un prezzo (utile se non lo conosci ancora, lo aggiungerai dopo tra i "Già presi")
  function confermaSenzaPrice(item) {
    updateItem('listaSpesa', item, { ...item, checked: true });
    setQuickPriceId(null);
    setQuickPrice('');
  }
  function annullaQuickPrice() {
    setQuickPriceId(null);
    setQuickPrice('');
  }
  function del(item) {
    removeItems('listaSpesa', [item]);
  }
  function clearChecked() {
    removeItems('listaSpesa', presi);
  }
  // Aggiorna il prezzo unitario di un articolo e ricalcola in automatico il totale
  function updatePrezzoUnitario(item, val) {
    const qtaNum = parseFloat(item.qta);
    const unitNum = parseFloat(val);
    const totaleAuto = (!isNaN(qtaNum) && !isNaN(unitNum)) ? String(Math.round(qtaNum * unitNum * 100) / 100) : item.prezzoTotale;
    updateItem('listaSpesa', item, { ...item, prezzoUnitario: val, prezzoTotale: totaleAuto });
  }
  // Aggiorna il prezzo totale direttamente (utile per i prodotti a peso, senza prezzo unitario)
  function updatePrezzoTotale(item, val) {
    updateItem('listaSpesa', item, { ...item, prezzoTotale: val });
  }
  // A fine spesa: raggruppa per categoria gli articoli "presi" con un prezzo inserito,
  // li registra come spese di oggi nel Budget, poi svuota la lista dei presi
  // (un'unica operazione atomica: aggiunge le spese e rimuove gli articoli presi insieme)
  function registraSpesa() {
    const conPrezzo = presi.filter(i => Number(i.prezzoTotale) > 0);
    const senzaPrezzo = presi.filter(i => !(Number(i.prezzoTotale) > 0));
    if (senzaPrezzo.length > 0) {
      const nomi = senzaPrezzo.map(i => i.nome).join(', ');
      const ok = window.confirm(
        `${senzaPrezzo.length} articolo${senzaPrezzo.length > 1 ? 'i' : ''} senza prezzo (${nomi}) ${senzaPrezzo.length > 1 ? 'non verranno registrati' : 'non verrà registrato'} nel Budget.\n\nProcedere comunque?`
      );
      if (!ok) return;
    }
    const perCategoria = {};
    for (const item of conPrezzo) {
      perCategoria[item.cat] = (perCategoria[item.cat] || 0) + Number(item.prezzoTotale);
    }
    const oggi = localDateStr();
    const nuoveSpese = Object.entries(perCategoria).map(([cat, amount], idx) => ({
      id: Date.now() + idx,
      desc: cat === 'Altro' ? 'Spesa supermercato' : `Acquisti – ${cat}`,
      amount: Math.round(amount * 100) / 100,
      cat,
      subcat: '',
      date: oggi,
    }));
    const updateObj = {};
    if (nuoveSpese.length) updateObj.spese = firebase.firestore.FieldValue.arrayUnion(...nuoveSpese);
    if (presi.length) updateObj.listaSpesa = firebase.firestore.FieldValue.arrayRemove(...presi);
    if (Object.keys(updateObj).length) applyUpdate(updateObj);
  }
  // Rendering di una riga articolo (usata sia per "da prendere" che per "già presi")
  function renderItem(item) {
    return (
      <div key={item.id}>
        <div className={`spesa-lista-item${item.checked?' checked':''}`}>
          <input type="checkbox" checked={item.checked} onChange={() => toggle(item)} />
          <span style={{flex:1, cursor: item.checked ? 'default' : 'pointer'}} onClick={() => !item.checked && toggle(item)}>{item.nome}</span>
          {item.qta && item.qta !== '1' && (
            <span style={{background:'var(--accent-light)',color:'var(--accent-dark)',fontWeight:700,fontSize:'12px',padding:'2px 8px',borderRadius:'20px',border:'1px solid var(--border2)',whiteSpace:'nowrap'}}>× {item.qta}</span>
          )}
          <input type="number" step="0.01" min="0" placeholder="€ unit." value={item.prezzoUnitario || ''}
            onChange={e => updatePrezzoUnitario(item, e.target.value)}
            style={{width:'58px',padding:'5px 6px',fontSize:'12px',flexShrink:0}} />
          <input type="number" step="0.01" min="0" placeholder="€ tot." value={item.prezzoTotale || ''}
            onChange={e => updatePrezzoTotale(item, e.target.value)}
            style={{width:'58px',padding:'5px 6px',fontSize:'12px',flexShrink:0,fontWeight:700}} />
          <button className="spesa-delete" onClick={() => del(item)}>✕</button>
        </div>
        {quickPriceId === item.id && (
          <div style={{display:'flex',alignItems:'center',gap:'8px',background:'var(--accent-light)',border:'1px solid var(--border2)',borderRadius:'8px',padding:'10px 12px',marginTop:'-4px',marginBottom:'6px',flexWrap:'wrap'}}>
            <span style={{fontSize:'13px',color:'var(--text2)',flex:'1 1 100px'}}>Quanto hai speso per <strong>{item.nome}</strong>?</span>
            <input
              ref={quickPriceInputRef}
              type="number" inputMode="decimal" step="0.01" min="0" placeholder="€ unit."
              value={quickPrice}
              onChange={e => setQuickPrice(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && confermaQuickPrice(item)}
              style={{width:'80px',padding:'7px 8px',fontSize:'14px'}}
            />
            <button className="btn primary small" onClick={() => confermaQuickPrice(item)}>✓ Preso</button>
            <button className="btn small" onClick={() => confermaSenzaPrice(item)}>Senza prezzo</button>
            <button className="btn small" onClick={annullaQuickPrice}>✕ Annulla</button>
          </div>
        )}
      </div>
    );
  }

  const lista = data.listaSpesa || [];
  const daPrendere = lista.filter(i => !i.checked);
  const presi = lista.filter(i => i.checked);

  // Raggruppa per categoria
  const bycat = {};
  for (const item of daPrendere) {
    if (!bycat[item.cat]) bycat[item.cat] = [];
    bycat[item.cat].push(item);
  }

  return (
    <div className="section active">
      <div className="print-title">💜 Family CC — Lista della spesa</div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
        <div style={{fontSize:'17px',fontWeight:'700'}}>🛒 Lista della spesa</div>
        <div style={{display:'flex',gap:'6px'}}>
          {presi.length > 0 && <button className="btn small danger" onClick={clearChecked}>🗑 Svuota senza registrare</button>}
          <button className="btn primary small" onClick={() => setShow(v => !v)}>{show ? '✕' : '+ Aggiungi'}</button>
        </div>
      </div>

      {show && (
        <div className="card" style={{background:'var(--accent-light)'}}>
          <div className="form-row">
            <div className="form-group" style={{flex:2}}>
              <label>Prodotto</label>
              <input type="text" placeholder="Es. Latte" value={form.nome}
                onChange={e => setForm(f => ({...f, nome: e.target.value}))}
                onKeyDown={e => e.key === 'Enter' && add()} />
            </div>
            <div className="form-group" style={{maxWidth:'60px'}}>
              <label>Qtà</label>
              <input type="text" inputMode="numeric" pattern="[0-9]*" value={form.qta} onChange={e => setForm(f => ({...f, qta: e.target.value}))} />
            </div>
            <div className="form-group" style={{maxWidth:'85px'}}>
              <label>€ unit.</label>
              <input type="number" step="0.01" min="0" placeholder="0.00" value={form.prezzoUnitario} onChange={e => handleFormUnitChange(e.target.value)} />
            </div>
            <div className="form-group" style={{maxWidth:'85px'}}>
              <label>€ tot.</label>
              <input type="number" step="0.01" min="0" placeholder="0.00" value={form.prezzoTotale} onChange={e => setForm(f => ({...f, prezzoTotale: e.target.value}))} />
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Categoria</label>
              <select value={form.cat} onChange={e => { setForm(f => ({...f, cat: e.target.value})); setShowNewCat(false); }}>
                <option value="">Seleziona...</option>
                {catList.map(c => <option key={c}>{c}</option>)}
              </select>
              {!showNewCat && <button type="button" onClick={() => setShowNewCat(true)} className="btn small" style={{marginTop:'6px',borderColor:'var(--accent)',color:'var(--accent)'}}>+ Nuova categoria</button>}
              {showNewCat && <div style={{display:'flex',gap:'4px',marginTop:'4px'}}>
                <input type="text" placeholder="Nome categoria" value={newCatInline} onChange={e => setNewCatInline(e.target.value)} onKeyDown={e => e.key==='Enter' && addCatInline()} style={{fontSize:'13px',padding:'4px 8px'}} />
                <button type="button" className="btn primary small" onClick={addCatInline}>✓</button>
                <button type="button" className="btn small" onClick={() => setShowNewCat(false)}>✕</button>
              </div>}
            </div>
          </div>
          <button className="btn primary" onClick={add}>➕ Aggiungi</button>
        </div>
      )}

      {lista.length === 0 && <div className="empty">Lista vuota — aggiungi qualcosa!</div>}

      {Object.entries(bycat).map(([cat, items]) => (
        <div key={cat} style={{marginBottom:'14px'}}>
          <div style={{fontSize:'12px',fontWeight:'700',color:'var(--accent)',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:'6px',paddingLeft:'4px'}}>{cat}</div>
          {items.map(item => renderItem(item))}
        </div>
      ))}

      {daPrendere.length > 0 && (
        <div style={{textAlign:'right',fontSize:'13px',fontWeight:700,color:'var(--text2)',padding:'2px 4px 12px'}}>
          Totale da prendere (stima): {formatEuro(daPrendere.reduce((a, i) => a + Number(i.prezzoTotale || 0), 0))}
        </div>
      )}

      {presi.length > 0 && (
        <div style={{marginTop:'8px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px'}}>
            <div style={{fontSize:'12px',fontWeight:'700',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.07em'}}>✓ Già presi</div>
            <div style={{fontSize:'13px',fontWeight:700,color:'var(--green)'}}>
              Totale: {formatEuro(presi.reduce((a, i) => a + Number(i.prezzoTotale || 0), 0))}
            </div>
          </div>
          {presi.map(item => renderItem(item))}
          <button className="btn primary" style={{marginTop:'10px',width:'100%',background:'var(--green)',borderColor:'var(--green)'}} onClick={registraSpesa}>
            💾 Registra spesa nel Budget e svuota lista
          </button>
        </div>
      )}
    </div>
  );
}

// ── REPORT TAB ─────────────────────────────────────────────────────────────────
function ReportTab({ data }) {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const [expandedCats, setExpandedCats] = useState({});
  const [scadFiltroMese, setScadFiltroMese] = useState(false); // false = tutto lo storico, true = solo mese selezionato

  const speseMese = (data.spese || []).filter(s => {
    const [sy, sm] = s.date.split('-').map(Number);
    return sy === year && sm === month;
  });
  const totale = speseMese.reduce((a, s) => a + Number(s.amount), 0);

  const byCat = {};
  for (const s of speseMese) {
    byCat[s.cat] = (byCat[s.cat] || 0) + Number(s.amount);
  }
  const catSort = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

  // Raggruppa le spese per categoria, con elenco delle singole voci ordinate per data (più recenti prima)
  const speseByCat = {};
  for (const s of speseMese) {
    if (!speseByCat[s.cat]) speseByCat[s.cat] = [];
    speseByCat[s.cat].push(s);
  }
  for (const cat in speseByCat) {
    speseByCat[cat].sort((a, b) => b.date.localeCompare(a.date) || (b.id || 0) - (a.id || 0));
  }

  function toggleCat(cat) {
    setExpandedCats(prev => ({ ...prev, [cat]: !prev[cat] }));
  }

  // Storico scadenze pagate: tutto per default, filtrabile per il mese selezionato
  const scadenzePagate = (data.scadenze || [])
    .filter(s => s.pagato)
    .filter(s => {
      if (!scadFiltroMese) return true;
      const [scy, scm] = s.date.split('-').map(Number);
      return scy === year && scm === month;
    })
    .sort((a, b) => b.date.localeCompare(a.date));
  const totScadPagate = scadenzePagate.reduce((a, s) => a + Number(s.amount || 0), 0);

  function prevMonth() { if (month === 1) { setMonth(12); setYear(y => y - 1); } else setMonth(m => m - 1); }
  function nextMonth() { if (month === 12) { setMonth(1); setYear(y => y + 1); } else setMonth(m => m + 1); }

  return (
    <div className="section active">
      <div className="print-title">💜 Family CC — Report — {monthLabel(year, month)}</div>
      <div className="budget-header">
        <div className="month-nav">
          <button onClick={prevMonth}>‹</button>
          <div className="month-label">{monthLabel(year, month)}</div>
          <button onClick={nextMonth}>›</button>
        </div>
      </div>

      <div className="card">
        <div className="card-title">📊 Spese per categoria</div>
        {catSort.length === 0 && <div className="empty">Nessuna spesa questo mese</div>}
        {catSort.map(([cat, amt]) => (
          <div className="report-cat-bar" key={cat}>
            <div className="report-cat-label">
              <span>{cat}</span>
              <span>{formatEuro(amt)} <span style={{color:'var(--text3)',fontSize:'12px'}}>({totale ? Math.round(amt/totale*100) : 0}%)</span></span>
            </div>
            <div className="bar-bg">
              <div className="bar-fill" style={{width: totale ? `${amt/totale*100}%` : '0%'}}></div>
            </div>
          </div>
        ))}
        {totale > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Totale</span><span style={{color:'var(--red)'}}>{formatEuro(totale)}</span>
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-title">📋 Dettaglio movimenti per categoria</div>
        {catSort.length === 0 && <div className="empty">Nessuna spesa questo mese</div>}
        {catSort.map(([cat, amt]) => (
          <div key={cat} style={{marginBottom:'10px'}}>
            <div
              onClick={() => toggleCat(cat)}
              style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 12px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'8px',cursor:'pointer'}}
            >
              <span style={{fontWeight:'600',display:'flex',alignItems:'center',gap:'6px'}}>
                <span style={{fontSize:'11px',color:'var(--text3)'}}>{expandedCats[cat] ? '▾' : '▸'}</span>
                {cat}
                <span style={{fontSize:'12px',color:'var(--text3)',fontWeight:'400'}}>({speseByCat[cat].length})</span>
              </span>
              <span style={{fontWeight:'700',color:'var(--red)'}}>{formatEuro(amt)}</span>
            </div>
            {expandedCats[cat] && (
              <div style={{marginTop:'6px',paddingLeft:'8px'}}>
                {speseByCat[cat].map(s => (
                  <div className="spesa-item" key={s.id}>
                    <div style={{flex:1}}>
                      <div className="spesa-desc">{s.desc}</div>
                      <div className="spesa-cat">{formatDataIT(s.date)}{s.subcat ? ` · ${s.subcat}` : ''}</div>
                    </div>
                    <div className="spesa-amount">{formatEuro(s.amount)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
        {totale > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Totale movimenti</span><span style={{color:'var(--red)'}}>{formatEuro(totale)}</span>
          </div>
        )}
      </div>

      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0}}>🧾 Storico scadenze pagate</div>
          <button className="btn small" onClick={() => setScadFiltroMese(v => !v)}>
            {scadFiltroMese ? `📅 ${monthLabel(year, month)}` : '📋 Tutto lo storico'}
          </button>
        </div>
        {scadenzePagate.length === 0 && <div className="empty">Nessuna scadenza pagata{scadFiltroMese ? ' in questo mese' : ''}</div>}
        {scadenzePagate.map(s => (
          <div className="scad-item pagato" key={s.id}>
            <div className="scad-info">
              <div className="scad-name">{s.nome}</div>
              <div className="scad-date">{formatDataIT(s.date)}</div>
            </div>
            <div className="scad-amount">{s.amount ? formatEuro(s.amount) : ''}</div>
          </div>
        ))}
        {scadenzePagate.length > 0 && (
          <div style={{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontWeight:'700'}}>
            <span>Totale</span><span style={{color:'var(--green)'}}>{formatEuro(totScadPagate)}</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ── IMPOSTAZIONI TAB ───────────────────────────────────────────────────────────
function ImpostazioniTab({ data, saveData }) {
  const [newCat, setNewCat] = useState('');
  const [newCatLista, setNewCatLista] = useState('');

  function addCat() {
    if (!newCat.trim()) return;
    saveData({ categorie: [...(data.categorie || DEFAULT_CATS), newCat.trim()] });
    setNewCat('');
  }
  function delCat(c) {
    saveData({ categorie: (data.categorie || DEFAULT_CATS).filter(x => x !== c) });
  }
  function addCatLista() {
    if (!newCatLista.trim()) return;
    saveData({ categorieLista: [...(data.categorieLista || DEFAULT_SPESA_CATS), newCatLista.trim()] });
    setNewCatLista('');
  }
  function delCatLista(c) {
    saveData({ categorieLista: (data.categorieLista || DEFAULT_SPESA_CATS).filter(x => x !== c) });
  }

  return (
    <div className="section active">
      <div className="card">
        <div className="setting-section">
          <div className="setting-label">Categorie spese</div>
          <div>{(data.categorie || DEFAULT_CATS).map(c => (
            <span className="cat-chip" key={c}>{c}<button onClick={() => delCat(c)}>✕</button></span>
          ))}</div>
          <div className="form-row" style={{marginTop:'10px'}}>
            <input type="text" placeholder="Nuova categoria..." value={newCat} onChange={e => setNewCat(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCat()} style={{flex:1}} />
            <button className="btn primary" onClick={addCat}>Aggiungi</button>
          </div>
        </div>

        <div className="setting-section" style={{marginTop:'20px'}}>
          <div className="setting-label">Categorie lista spesa</div>
          <div>{(data.categorieLista || DEFAULT_SPESA_CATS).map(c => (
            <span className="cat-chip" key={c}>{c}<button onClick={() => delCatLista(c)}>✕</button></span>
          ))}</div>
          <div className="form-row" style={{marginTop:'10px'}}>
            <input type="text" placeholder="Nuova categoria..." value={newCatLista} onChange={e => setNewCatLista(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCatLista()} style={{flex:1}} />
            <button className="btn primary" onClick={addCatLista}>Aggiungi</button>
          </div>
        </div>
      </div>

      <div className="card" style={{marginTop:'8px'}}>
        <div className="setting-label" style={{marginBottom:'8px'}}>ℹ️ Informazioni</div>
        <div style={{fontSize:'13px',color:'var(--text2)',lineHeight:'1.6'}}>
          <p>I dati sono sincronizzati automaticamente via Firebase.</p>
          <p style={{marginTop:'6px'}}>Repository: <code style={{background:'var(--surface2)',padding:'1px 6px',borderRadius:'4px'}}>giorgiolucciola-lang/fcc</code></p>
        </div>
      </div>
    </div>
  );
}

// ── RENDER ─────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/fcc/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
