<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Control Center</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9B59B6">
<!-- Librerie ospitate in locale (cartella /vendor) per funzionamento offline -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<!-- Firebase (locale) -->
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #f8f5fc;
  --surface: #ffffff;
  --surface2: #f2edf8;
  --border: #e2d9f0;
  --border2: #c8b8e0;
  --accent: #9B59B6;
  --accent-light: #f0e8f8;
  --accent-dark: #7d3f9e;
  --text: #1a1520;
  --text2: #6a5878;
  --text3: #8a7799;
  --green: #16c462;
  --green-bg: #eafaf1;
  --green-border: #a9dfbf;
  --red: #e8312b;
  --red-bg: #fdf0ee;
  --red-border: #e8b0a8;
  --orange: #ff9f1c;
  --orange-bg: #fef5ec;
  --salmon: #e2685a;
  --salmon-bg: #fff1ef;
  --salmon-border: #f5c2ba;
  --radius: 10px;
  --shadow: 0 2px 8px rgba(155,89,182,0.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* NAV */
nav {
  background: var(--accent);
  padding: 0;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(155,89,182,0.3);
}
.nav-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  max-width: 700px; margin: 0 auto;
}
.nav-title { color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 0.3px; display: flex; align-items: baseline; gap: 6px; }
.nav-version {
  color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 0.3px;
  background: rgba(255,255,255,0.22); padding: 2px 9px; border-radius: 10px;
}
.nav-user { color: rgba(255,255,255,0.85); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.nav-tabs {
  display: flex; overflow-x: auto;
  padding: 0 8px 0;
  gap: 2px;
  scrollbar-width: none;
  max-width: 684px; margin: 0 auto;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 9px 14px; border: none; background: transparent;
  color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 500;
  cursor: pointer; border-bottom: 3px solid transparent;
  white-space: nowrap; transition: all 0.2s; flex-shrink: 0;
}
.tab-btn:hover { color: #fff; }
.tab-btn.active { color: #fff; border-bottom-color: #fff; }

/* SYNC BTN */
.sync-btn {
  padding: 5px 11px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.5);
  background: transparent; color: #fff;
  font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.sync-btn:hover { background: rgba(255,255,255,0.15); }
.sync-btn.syncing { opacity: 0.6; }
.print-btn {
  padding: 5px 11px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.5);
  background: transparent; color: #fff;
  font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.print-btn:hover { background: rgba(255,255,255,0.15); }

/* STAMPA: nasconde menu/pulsanti e mostra solo il contenuto della scheda attiva */
@media print {
  nav, .btn, .print-btn, .sync-btn, .spesa-delete, .tab-btn,
  .add-spesa-form, input, select { display: none !important; }
  body { background: #fff; color: #000; }
  .section { display: none; padding: 0; }
  .section.active { display: block !important; max-width: 100%; }
  .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; margin-bottom: 10px; }
  .print-title { display: block !important; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
}
.print-title { display: none; }

/* LAYOUT */
.section { display: none; padding: 16px; max-width: 700px; margin: 0 auto; }
.section.active { display: block; }

/* CARDS */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text); }

/* FORM ELEMENTS */
.form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.form-row label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); display: block; margin-bottom: 4px; }
.form-group { display: flex; flex-direction: column; flex: 1; min-width: 100px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  padding: 9px 12px; background: #ffffff;
  border: 1px solid var(--border2); border-radius: 8px;
  color: var(--text); font-size: 15px; font-family: inherit;
  outline: none; width: 100%; transition: background-color 0.2s, border-color 0.2s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #fff; }
/* Campo compilato: sfondo verdino, come le entrate (solo un vezzo estetico) */
input[type=text]:not(:placeholder-shown):not(:focus),
input[type=number]:not(:placeholder-shown):not(:focus) {
  background: var(--green-bg); border-color: var(--green-border);
}
select:required:valid:not(:focus) {
  background: var(--green-bg); border-color: var(--green-border);
}

/* BUTTONS */
.btn {
  padding: 8px 16px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--surface);
  color: var(--text); font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn.danger { border-color: var(--red-border); color: var(--red); }
.btn.danger:hover { background: var(--red-bg); }
.btn.small { padding: 4px 10px; font-size: 12px; }

/* BUDGET TAB */
.budget-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
}
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-nav button { background: none; border: 1px solid var(--border2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 16px; color: var(--text2); }
.month-nav button:hover { border-color: var(--accent); color: var(--accent); }
.month-label { font-size: 16px; font-weight: 600; min-width: 140px; text-align: center; }

.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.summary-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 12px; text-align: center;
  box-shadow: var(--shadow);
}
.summary-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 6px; }
.summary-card .amount { font-size: 20px; font-weight: 700; }
.summary-card.entrate .amount { color: var(--green); }
.summary-card.uscite .amount { color: var(--red); }
.summary-card.saldo .amount { color: var(--accent); }

/* SPESE per giorno */
.day-group { margin-bottom: 18px; }
.day-header {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--accent);
  color: #fff;
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.day-header .day-total {
  margin-left: auto;
  font-size: 13px; font-weight: 700;
  opacity: 0.9;
}
.spesa-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 14px;
}
.spesa-cat { font-size: 11px; color: var(--text3); }
.spesa-desc { flex: 1 1 120px; font-weight: 500; min-width: 0; }
.spesa-amount { font-weight: 700; color: var(--red); white-space: nowrap; }
.spesa-delete { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 17px; padding: 6px 8px; border-radius: 6px; }
.spesa-delete:hover { color: var(--red); background: var(--red-bg); }

.add-spesa-form {
  background: var(--accent-light); border: 1px solid var(--border2);
  border-radius: 12px; padding: 14px; margin-bottom: 16px;
}

/* SCADENZE */
.scad-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 8px;
}
.scad-item.pagato { opacity: 0.85; }
.scad-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.scad-dot.verde { background: var(--green); }
.scad-dot.arancio { background: var(--orange); }
.scad-dot.rosso { background: var(--red); }
.scad-dot.giallo { background: #f4d03f; box-shadow: 0 0 0 2px rgba(244,208,63,0.35); }
.scad-info { flex: 1 1 150px; min-width: 0; }
.scad-name { font-size: 14px; font-weight: 600; }
.scad-date { font-size: 12px; color: var(--text3); }
.scad-amount { font-weight: 700; font-size: 15px; }
.scad-actions {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  justify-content: flex-end; margin-left: auto;
}

/* SPESA (lista) */
.spesa-lista-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 6px;
}
.spesa-lista-item > span { min-width: 0; word-break: break-word; }
.spesa-lista-item.checked { opacity: 0.5; text-decoration: line-through; }
.spesa-lista-item input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }
.spesa-lista-item .qta-input { width: 40px; padding: 6px 4px; font-size: 13px; text-align: center; flex-shrink: 0; }
.spesa-lista-item .unita-select { width: 52px; padding: 6px 2px; font-size: 12px; flex-shrink: 0; }
.spesa-lista-item .prezzo-input { width: 64px; padding: 6px 6px; font-size: 13px; flex-shrink: 0; }
.spesa-lista-item .prezzo-input.tot { font-weight: 700; }
.spesa-lista-item .bp-btn { flex-shrink: 0; padding: 5px 8px; }
/* Su schermi larghi il wrapper non deve introdurre un box proprio: i suoi figli
   (checkbox + nome) restano semplici elementi diretti della riga flessibile,
   esattamente come prima. Diventa un vero flex box solo sotto i 480px (v30). */
.spesa-nome-row { display: contents; }

/* REPORT */
.report-cat-bar { margin-bottom: 10px; }
.report-cat-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.bar-bg { height: 8px; background: var(--border); border-radius: 4px; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s; }

/* IMPOSTAZIONI */
.setting-section { margin-bottom: 20px; }
.setting-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 10px; }
.cat-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 20px; padding: 4px 10px; margin: 4px;
  font-size: 13px;
}
.cat-chip button { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 14px; line-height: 1; }
.cat-chip button:hover { color: var(--red); }

/* LOGIN */
.login-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 80vh; gap: 20px; padding: 24px;
  text-align: center;
}
.login-title { font-size: 28px; font-weight: 700; color: var(--accent); }
.login-sub { color: var(--text2); font-size: 15px; max-width: 300px; }
.btn-google {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 24px; border-radius: 10px;
  border: 1px solid var(--border2); background: var(--surface);
  font-size: 15px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shadow); transition: all 0.2s;
}
.btn-google:hover { box-shadow: 0 4px 16px rgba(155,89,182,0.15); border-color: var(--accent); }

.empty { text-align: center; color: var(--text3); padding: 32px 16px; font-size: 14px; }

/* RIQUADRO DI CONFERMA PERSONALIZZATO ────────────────────────────────────────
   Sostituisce window.confirm(): su iOS, quando l'app è aperta dall'icona
   installata sulla schermata Home (modalità "standalone"), i riquadri nativi
   confirm/alert spesso NON vengono mostrati e il codice riceve comunque "OK"
   senza che l'utente veda nulla, causando cancellazioni indesiderate. Questo
   riquadro è disegnato dall'app stessa, quindi funziona sempre, anche da app
   installata. */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(26,21,32,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.confirm-box {
  background: #fff; border-radius: 14px; padding: 22px 20px;
  max-width: 340px; width: 100%; box-shadow: 0 8px 32px rgba(26,21,32,0.25);
  text-align: center;
}
.confirm-msg { font-size: 15px; color: var(--text); margin-bottom: 18px; line-height: 1.5; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-actions .btn { flex: 1; }
.badge-entrata { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); border-radius: 5px; font-size: 11px; font-weight: 600; padding: 2px 6px; }
.badge-uscita { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); border-radius: 5px; font-size: 11px; font-weight: 600; padding: 2px 6px; }

/* Entrate list */
.entrata-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 12px; background: var(--green-bg);
  border: 1px solid var(--green-border); border-radius: 8px;
  margin-bottom: 6px;
}
.entrata-item .spesa-desc { color: var(--green); }
.entrata-item .spesa-amount { color: var(--green); }

/* ── SCHERMI STRETTI (iPhone) ─────────────────────────────────────────── */
@media (max-width: 480px) {
  .nav-top { padding: 9px 12px; }
  .nav-title { font-size: 14px; }
  .nav-user { gap: 6px; font-size: 12px; }
  .print-btn, .sync-btn { padding: 6px 10px; font-size: 11px; }
  .nav-tabs { padding: 0 4px 0; }
  .tab-btn { padding: 9px 10px; font-size: 12px; }

  .section { padding: 12px; }
  .card { padding: 13px; }

  .summary-grid { gap: 8px; }
  .summary-card { padding: 11px 6px; }
  .summary-card .label { font-size: 10px; }
  .summary-card .amount { font-size: 16px; word-break: break-word; }

  .month-label { font-size: 14px; min-width: 0; }

  .btn.small { padding: 7px 11px; font-size: 12px; }
  .scad-actions .btn.small { padding: 7px 10px; }

  .form-group { min-width: 90px; }

  .spesa-lista-item .qta-input { width: 50px; font-size: 16px; padding: 9px 4px; }
  .spesa-lista-item .unita-select { width: 58px; font-size: 13px; padding: 9px 2px; }
  .spesa-lista-item .prezzo-input { width: 76px; font-size: 16px; padding: 9px 6px; }
  .spesa-lista-item .bp-btn { padding: 8px 11px; font-size: 14px; }

  /* Checkbox + nome prodotto su una riga propria a tutta larghezza: così i campi
     quantità/prezzo, non trovando più spazio nella stessa riga, scendono automaticamente
     sotto invece di sovrapporsi visivamente al testo del nome (bug corretto in v30). */
  .spesa-nome-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1 1 100%;
    min-width: 0;
  }
}
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// Versione dell'app mostrata accanto al titolo: aggiornala insieme a CACHE_VERSION in sw.js ad ogni deploy
const APP_VERSION = "v35";

// ── FIREBASE CONFIG ────────────────────────────────────────────────────────────
// ⚠️ SOSTITUISCI questi valori con le tue credenziali Firebase
// Le trovi su: console.firebase.google.com → Il tuo progetto → Impostazioni → Le tue app
const firebaseConfig = {
  apiKey: "AIzaSyDWcRC7Zf8NX2OJU197UVvZ23Gy6_SWQtw",
  authDomain: "family-control-center-4ae38.firebaseapp.com",
  projectId: "family-control-center-4ae38",
  storageBucket: "family-control-center-4ae38.firebasestorage.app",
  messagingSenderId: "722999772560",
  appId: "1:722999772560:web:f06617ba41dee3f9ebdf15"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

// ── PERSISTENZA OFFLINE ──────────────────────────────────────────────────────
// Salva i dati in locale (IndexedDB) così la lista, le spese e le scadenze
// restano leggibili e modificabili anche senza connessione. Le modifiche fatte
// offline vengono messe in coda e sincronizzate da sole appena torna internet.
db.enablePersistence({ synchronizeTabs: true }).catch(() => {
  // Può fallire se il browser non la supporta o se ci sono più schede aperte:
  // in quel caso l'app funziona comunque, solo senza cache offline dei dati.
});

// ── UTILS ──────────────────────────────────────────────────────────────────────
function localDateStr(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
// Converte una data in formato ISO (yyyy-mm-dd) nel formato italiano breve gg/mm/aaaa
function formatDataIT(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}
function formatEuro(n) {
  return '€ ' + Number(n || 0).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// Converte in numero un valore scritto "all'italiana" (virgola come separatore decimale,
// es. "0,500" o "3,5"): senza questa conversione, JavaScript si ferma alla virgola e legge
// solo la parte intera (es. "0,500" diventa 0 invece di 0.5), causando calcoli sbagliati
// nei totali di quantità × prezzo unitario.
function parseNumIT(v) {
  if (v === null || v === undefined) return NaN;
  const s = String(v).trim().replace(',', '.');
  if (s === '') return NaN;
  return parseFloat(s);
}
// Calcola il prezzo totale (qtà × prezzo unitario) tenendo conto di COSA significa il prezzo
// unitario in base all'unità di misura scelta:
// - "gr" (grammi): il prezzo digitato si intende ALL'ETTO (ogni 100 grammi), come indicato
//   di norma ai banchi salumeria/gastronomia/macelleria (es. "3,40 € all'etto"). Prima di
//   questa correzione il prezzo veniva invece moltiplicato per i grammi as-is, gonfiando il
//   totale di 100 volte (250 g × 3,40 €/etto dava 850 € invece di 8,50 €).
// - "kg", "l", "pz": il prezzo è per l'intera unità (al kg, al litro, al pezzo), quindi
//   quantità e prezzo si moltiplicano direttamente senza conversioni.
function calcolaTotaleSpesa(qta, unita, prezzoUnitario) {
  const q = parseNumIT(qta);
  const p = parseNumIT(prezzoUnitario);
  if (isNaN(q) || isNaN(p)) return null;
  const base = (unita === 'g') ? (q / 100) : q;
  return String(Math.round(base * p * 100) / 100);
}
// Etichetta da mostrare accanto al campo prezzo unitario, per rendere esplicito a cosa si
// riferisce il numero digitato (evita l'ambiguità che ha causato il bug del prosciutto: prezzo
// scritto "3,40" pensando all'etto, ma calcolato dall'app come fosse al grammo).
function etichettaPrezzoUnitario(unita) {
  if (unita === 'g') return "€ all'etto";
  if (unita === 'kg') return '€ al kg';
  if (unita === 'l') return '€ al litro';
  return '€ al pezzo';
}
function monthLabel(y, m) {
  return new Date(y, m - 1, 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
}
function dayLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - date) / 86400000);
  if (diff === 0) return 'Oggi';
  if (diff === 1) return 'Ieri';
  return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
}
function scadenzaColor(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((date - today) / 86400000);
  if (diff < 0) return 'rosso';
  if (diff <= 5) return 'arancio';
  return 'verde';
}
// Verifica se una data (yyyy-mm-dd) cade nel mese solare corrente (oggi)
function isMeseCorrente(dateStr) {
  const [y, m] = dateStr.split('-').map(Number);
  const oggi = new Date();
  return y === oggi.getFullYear() && m === (oggi.getMonth() + 1);
}
function addMonthsToDateStr(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  date.setMonth(date.getMonth() + n);
  return localDateStr(date);
}
// Aggiunge un numero di giorni a una data (yyyy-mm-dd)
function addDaysToDateStr(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  date.setDate(date.getDate() + n);
  return localDateStr(date);
}
// Ultimo giorno del mese "m" (1-12) dell'anno "y"
function lastDayOfMonthStr(y, m) {
  const date = new Date(y, m, 0); // giorno 0 del mese successivo = ultimo giorno del mese corrente
  return localDateStr(date);
}
// Legge la frequenza di una scadenza in formato unificato { unita, valore, fineMese },
// leggendo sia il formato nuovo (unitaRicorrenza/intervalloValore/fineMese) sia il vecchio
// formato pre-v14 (tipoRicorrenza 'fissa'|'periodica' + intervalloMesi), per compatibilità
// con le scadenze già create in passato.
function normalizzaRicorrenza(s) {
  if (s.unitaRicorrenza) {
    return { unita: s.unitaRicorrenza, valore: Number(s.intervalloValore || 1), fineMese: !!s.fineMese };
  }
  if (s.tipoRicorrenza === 'periodica') return { unita: 'mesi', valore: Number(s.intervalloMesi || 1), fineMese: false };
  return { unita: 'mesi', valore: 1, fineMese: false }; // 'fissa' oppure assente
}
// Calcola la data risultante spostando "valore" unità (giorni o mesi) da una data di partenza.
// Se fineMese è true (solo per unità "mesi"), il risultato viene sempre riportato
// all'ultimo giorno del mese target, calcolato su anno/mese (ignorando il giorno di
// partenza) per evitare il bug di overflow di JavaScript: sommare mesi a un giorno alto
// (es. 31 gennaio + 1 mese) farebbe "sforare" al mese successivo invece di fermarsi a febbraio.
function addIntervalloADataStr(dateStr, unita, valore, fineMese) {
  if (unita === 'giorni') return addDaysToDateStr(dateStr, valore);
  if (fineMese) {
    const [y, m] = dateStr.split('-').map(Number);
    const totale = (m - 1) + valore;
    const targetYear = y + Math.floor(totale / 12);
    const targetMonth = ((totale % 12) + 12) % 12 + 1;
    return lastDayOfMonthStr(targetYear, targetMonth);
  }
  return addMonthsToDateStr(dateStr, valore);
}
// Genera occorrenze future per una scadenza ricorrente, qualunque sia la frequenza
// (ogni N giorni, ogni N mesi, con o senza "sempre fine mese").
// Se la scadenza è "numerata", ogni occorrenza riceve un numero di rata progressivo
// (rataNum), a partire dal numero di rata della scadenza di origine.
function generaOccorrenze(scadenza, count = 12) {
  const occorrenze = [];
  const rataBase = Number(scadenza.rataNum || 1);
  const { unita, valore, fineMese } = normalizzaRicorrenza(scadenza);
  for (let i = 1; i <= count; i++) {
    occorrenze.push({
      id: scadenza.id + i, // id derivato, univoco e stabile
      nome: scadenza.nome,
      amount: scadenza.amount,
      date: addIntervalloADataStr(scadenza.date, unita, valore * i, fineMese),
      ricorrente: true,
      unitaRicorrenza: unita,
      intervalloValore: valore,
      fineMese: fineMese,
      gruppoId: scadenza.id,
      pagato: false,
      numerata: !!scadenza.numerata,
      rataNum: scadenza.numerata ? rataBase + i : null,
    });
  }
  return occorrenze;
}

const DEFAULT_CATS = ['Casa', 'Cibo', 'Trasporti', 'Salute', 'Svago', 'Abbigliamento', 'Altro'];

// Tappe (negozi) del giro spesa: servono a sapere quante "fermate" restano da fare
// (es. Supermercato, Fruttivendolo, Farmacia...). Concetto separato dalla categoria
// del prodotto: la categoria dice COSA è, la tappa dice DOVE si compra.
const DEFAULT_TAPPE = ['Supermercato', 'Fruttivendolo', 'Macelleria', 'Farmacia', 'Altro'];
// Unità di misura per la quantità nella lista della spesa: dice se il numero in "Qtà"
// rappresenta pezzi, chili, grammi o litri, così non resta ambiguo (es. "2" di cosa?)
const UNITA_OPZIONI = [
  { v: 'pz', label: 'pz' },
  { v: 'kg', label: 'kg' },
  { v: 'g', label: 'gr' },
  { v: 'l', label: 'litri' },
];

// ── MAIN APP ───────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('budget');
  const [syncing, setSyncing] = useState(false);
  const [data, setData] = useState(null);
  // Riquadro di conferma personalizzato (sostituisce window.confirm, che su iOS
  // in modalità app installata da Home Screen non viene mostrato). askConfirm
  // restituisce una Promise<boolean>, usabile con "await" come window.confirm.
  const [confirmDialog, setConfirmDialog] = useState(null);
  function askConfirm(message) {
    return new Promise(resolve => {
      setConfirmDialog({ message, resolve });
    });
  }
  function risolviConfirm(esito) {
    if (confirmDialog) confirmDialog.resolve(esito);
    setConfirmDialog(null);
  }

  useEffect(() => {
    const timeout = setTimeout(() => setLoading(false), 6000);
    const unsub = auth.onAuthStateChanged(u => {
      clearTimeout(timeout);
      setUser(u || null);
      setLoading(false);
    }, () => {
      clearTimeout(timeout);
      setLoading(false);
    });
    return () => { unsub(); clearTimeout(timeout); };
  }, []);

  useEffect(() => {
    if (!user) return;
    const ref = db.collection('users').doc(user.uid);
    // includeMetadataChanges: true → il listener viene richiamato anche quando
    // cambia solo la "provenienza" dello snapshot (cache locale → server),
    // anche se i dati non sono cambiati. Serve per poter distinguere con
    // certezza un documento davvero inesistente da un semplice "non ancora
    // arrivato dal server" (es. dopo aver svuotato la cache o reinstallato la PWA).
    const unsub = ref.onSnapshot({ includeMetadataChanges: true }, snap => {
      if (snap.exists) {
        setData(snap.data());
      } else if (!snap.metadata.fromCache) {
        // Il server ha confermato che il documento non esiste davvero:
        // solo ora è sicuro creare i dati iniziali vuoti.
        const init = {
          spese: [],
          entrate: [],
          scadenze: [],
          listaSpesa: [],
          categorie: DEFAULT_CATS,
          categorieLista: DEFAULT_SPESA_CATS,
          tappeLista: DEFAULT_TAPPE,
          budgetMensile: 2000,
          buoniPasto: [],
          storicoProdotti: [],
        };
        ref.set(init);
        setData(init);
      }
      // else: lo snapshot "vuoto" arriva dalla cache locale, non dal server.
      // Non facciamo nulla e aspettiamo la conferma reale, per non rischiare
      // di sovrascrivere dati veri già presenti sul server.
    }, () => {
      // Errore di lettura (es. offline senza cache locale): non facciamo nulla,
      // resta la schermata di caricamento invece di creare dati vuoti.
    });
    return unsub;
  }, [user]);

  async function saveData(newData) {
    if (!user) return;
    const merged = { ...data, ...newData };
    setData(merged);
    setSyncing(true);
    try {
      await db.collection('users').doc(user.uid).set(merged);
    } finally {
      setSyncing(false);
    }
  }

  // ── Aggiornamenti "sicuri" per gli elenchi critici (spese, entrate, scadenze, listaSpesa) ──
  // A differenza di saveData (che riscrive TUTTO il documento con i dati che l'app ha in quel
  // momento), queste funzioni usano le operazioni atomiche di Firebase arrayUnion/arrayRemove:
  // agiscono solo sulla singola voce toccata, quindi due salvataggi ravvicinati (anche da
  // dispositivi diversi, anche offline) non possono più cancellarsi a vicenda.
  async function applyUpdate(updateObj) {
    if (!user || !Object.keys(updateObj).length) return;
    setSyncing(true);
    try {
      await db.collection('users').doc(user.uid).update(updateObj);
    } finally {
      setSyncing(false);
    }
  }
  function addItems(field, items) {
    if (!items || !items.length) return Promise.resolve();
    return applyUpdate({ [field]: firebase.firestore.FieldValue.arrayUnion(...items) });
  }
  function removeItems(field, items) {
    if (!items || !items.length) return Promise.resolve();
    return applyUpdate({ [field]: firebase.firestore.FieldValue.arrayRemove(...items) });
  }
  async function updateItem(field, oldItem, newItem) {
    await removeItems(field, [oldItem]);
    await addItems(field, [newItem]);
  }

  function login() { auth.signInWithPopup(provider); }
  function logout() { auth.signOut(); setData(null); }

  if (loading) return <div style={{textAlign:'center',padding:'60px',color:'var(--text3)'}}>Caricamento...</div>;

  if (!user) return (
    <div className="login-screen">
      <div style={{fontSize:'48px'}}>💜</div>
      <div className="login-title">Family Control Center</div>
      <div className="login-sub">Accedi per gestire budget, spese, scadenze e lista della spesa</div>
      <button className="btn-google" onClick={login}>
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Accedi con Google
      </button>
    </div>
  );

  if (!data && user) return <div style={{textAlign:'center',padding:'60px',color:'var(--text3)'}}>Caricamento dati...</div>;

  const tabs = [
    { id: 'budget', label: '💰 Budget' },
    { id: 'scadenze', label: '📅 Scadenze' },
    { id: 'spesa', label: '🛒 Lista della Spesa' },
    { id: 'report', label: '📊 Report' },
    { id: 'impostazioni', label: '⚙️ Impostazioni' },
  ];

  return (
    <div>
      <nav>
        <div className="nav-top">
          <div className="nav-title">💜 Family CC <span className="nav-version">{APP_VERSION}</span></div>
          <div className="nav-user">
            <span style={{display:'none',fontSize:'12px'}}>{user.displayName?.split(' ')[0]}</span>
            <button className="print-btn" onClick={() => window.print()} title="Stampa la scheda corrente">
              🖨️ Stampa
            </button>
            <button className={`sync-btn${syncing?' syncing':''}`} onClick={logout}>
              {syncing ? '🔄 Sync...' : '☁️ Esci'}
            </button>
          </div>
        </div>
        <div className="nav-tabs">
          {tabs.map(t => (
            <button key={t.id} className={`tab-btn${tab===t.id?' active':''}`} onClick={() => setTab(t.id)}>
              {t.label}
            </button>
          ))}
        </div>
      </nav>

      {tab === 'budget' && <BudgetTab data={data} saveData={saveData} addItems={addItems} removeItems={removeItems} updateItem={updateItem} askConfirm={askConfirm} />}
      {tab === 'scadenze' && <ScadenzeTab data={data} saveData={saveData} addItems={addItems} removeItems={removeItems} updateItem={updateItem} askConfirm={askConfirm} />}
      {tab === 'spesa' && <SpesaTab data={data} saveData={saveData} addItems={addItems} removeItems={removeItems} updateItem={updateItem} applyUpdate={applyUpdate} askConfirm={askConfirm} />}
      {tab === 'report' && <ReportTab data={data} addItems={addItems} removeItems={removeItems} askConfirm={askConfirm} />}
      {tab === 'impostazioni' && <ImpostazioniTab data={data} saveData={saveData} />}

      {confirmDialog && (
        <div className="confirm-overlay" onClick={() => risolviConfirm(false)}>
          <div className="confirm-box" onClick={e => e.stopPropagation()}>
            <div className="confirm-msg">{confirmDialog.message}</div>
            <div className="confirm-actions">
              <button className="btn" onClick={() => risolviConfirm(false)}>Annulla</button>
              <button className="btn danger" onClick={() => risolviConfirm(true)}>🗑 Elimina</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── BUDGET TAB ─────────────────────────────────────────────────────────────────
function BudgetTab({ data, saveData, addItems, removeItems, updateItem, askConfirm }) {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const [showAddSpesa, setShowAddSpesa] = useState(false);
  const [showAddEntrata, setShowAddEntrata] = useState(false);
  const [form, setForm] = useState({ desc: '', amount: '', cat: '', subcat: '', date: localDateStr() });
  const [formE, setFormE] = useState({ desc: '', amount: '', date: localDateStr() });
  const [newCatInline, setNewCatInline] = useState('');
  const [showNewCat, setShowNewCat] = useState(false);
  const [newSubcatInline, setNewSubcatInline] = useState('');
  const [showNewSubcat, setShowNewSubcat] = useState(false);
  const [editSpesaId, setEditSpesaId] = useState(null);
  const [editSpesaForm, setEditSpesaForm] = useState({ desc: '', amount: '', cat: '', subcat: '', date: '' });

  function addCatInline() {
    if (!newCatInline.trim()) return;
    const cats = [...(data.categorie || DEFAULT_CATS), newCatInline.trim()];
    saveData({ categorie: cats });
    setForm(f => ({ ...f, cat: newCatInline.trim() }));
    setNewCatInline('');
    setShowNewCat(false);
  }

  function addSubcatInline() {
    if (!newSubcatInline.trim() || !form.cat) return;
    const subcats = { ...(data.sottocategorie || {}) };
    if (!subcats[form.cat]) subcats[form.cat] = [];
    subcats[form.cat] = [...subcats[form.cat], newSubcatInline.trim()];
    saveData({ sottocategorie: subcats });
    setForm(f => ({ ...f, subcat: newSubcatInline.trim() }));
    setNewSubcatInline('');
    setShowNewSubcat(false);
  }

  function prevMonth() {
    if (month === 1) { setMonth(12); setYear(y => y - 1); }
    else setMonth(m => m - 1);
  }
  function nextMonth() {
    if (month === 12) { setMonth(1); setYear(y => y + 1); }
    else setMonth(m => m + 1);
  }

  // Elenchi di descrizioni già usate in passato, per il completamento automatico dei campi
  // (nessun dato nuovo da salvare: si riusano semplicemente le spese/entrate già registrate)
  const descSpeseNote = Array.from(new Set((data.spese || []).map(s => s.desc).filter(Boolean)));
  const descEntrateNote = Array.from(new Set((data.entrate || []).map(e => e.desc).filter(Boolean)));

  const speseMese = (data.spese || []).filter(s => {
    const [sy, sm] = s.date.split('-').map(Number);
    return sy === year && sm === month;
  });
  const entrateMese = (data.entrate || []).filter(e => {
    const [ey, em] = e.date.split('-').map(Number);
    return ey === year && em === month;
  });

  const totSpese = speseMese.reduce((a, s) => a + Number(s.amount), 0);
  const totEntrate = entrateMese.reduce((a, e) => a + Number(e.amount), 0);
  const scadenzeMese = (data.scadenze || []).filter(sc => {
    const [scy, scm] = sc.date.split('-').map(Number);
    return scy === year && scm === month;
  });
  const totScadenze = scadenzeMese.reduce((a, sc) => a + Number(sc.amount || 0), 0);
  const saldo = totEntrate - totSpese - totScadenze;

  // Raggruppa spese per giorno, ordine cronologico inverso (giorno più recente in cima)
  const spesePorGiorno = {};
  for (const s of speseMese) {
    if (!spesePorGiorno[s.date]) spesePorGiorno[s.date] = [];
    spesePorGiorno[s.date].push(s);
  }
  // Ordina le chiavi (giorni) dal più recente al più vecchio
  const giorniOrdinati = Object.keys(spesePorGiorno).sort((a, b) => b.localeCompare(a));
  // Ordina le spese dentro ogni giorno: più recente in cima (usa id/timestamp)
  for (const g of giorniOrdinati) {
    spesePorGiorno[g].sort((a, b) => (b.id || 0) - (a.id || 0));
  }

  function addSpesa() {
    if (!form.desc || !form.amount) return;
    const s = { id: Date.now(), desc: form.desc, amount: Number(form.amount), cat: form.cat || 'Altro', subcat: form.subcat || '', date: form.date };
    addItems('spese', [s]);
    setForm({ desc: '', amount: '', cat: '', subcat: '', date: localDateStr() });
    setShowAddSpesa(false);
  }
  async function deleteSpesa(item) {
    const ok = await askConfirm(`Eliminare la spesa "${item.desc}" (${formatEuro(item.amount)})?`);
    if (!ok) return;
    removeItems('spese', [item]);
  }
  function startEditSpesa(s) {
    setEditSpesaId(s.id);
    setEditSpesaForm({ desc: s.desc, amount: s.amount, cat: s.cat || '', subcat: s.subcat || '', date: s.date });
  }
  function cancelEditSpesa() {
    setEditSpesaId(null);
  }
  function saveEditSpesa(oldItem) {
    if (!editSpesaForm.desc || !editSpesaForm.amount) return;
    const newItem = { ...oldItem, desc: editSpesaForm.desc, amount: Number(editSpesaForm.amount), cat: editSpesaForm.cat || 'Altro', subcat: editSpesaForm.subcat || '', date: editSpesaForm.date };
    updateItem('spese', oldItem, newItem);
    setEditSpesaId(null);
  }
  function addEntrata() {
    if (!formE.desc || !formE.amount) return;
    const e = { id: Date.now(), desc: formE.desc, amount: Number(formE.amount), date: formE.date };
    addItems('entrate', [e]);
    setFormE({ desc: '', amount: '', date: localDateStr() });
    setShowAddEntrata(false);
  }
  async function deleteEntrata(item) {
    const ok = await askConfirm(`Eliminare l'entrata "${item.desc}" (${formatEuro(item.amount)})?`);
    if (!ok) return;
    removeItems('entrate', [item]);
  }

  return (
    <div className="section active">
      <datalist id="descSpeseList">{descSpeseNote.map(d => <option key={d} value={d} />)}</datalist>
      <datalist id="descEntrateList">{descEntrateNote.map(d => <option key={d} value={d} />)}</datalist>
      <div className="print-title">💜 Family CC — Budget — {monthLabel(year, month)}</div>
      <div className="budget-header">
        <div className="month-nav">
          <button onClick={prevMonth}>‹</button>
          <div className="month-label">{monthLabel(year, month)}</div>
          <button onClick={nextMonth}>›</button>
        </div>
      </div>

      <div className="summary-grid">
        <div className="summary-card entrate">
          <div className="label">Entrate</div>
          <div className="amount">{formatEuro(totEntrate)}</div>
        </div>
        <div className="summary-card uscite">
          <div className="label">Uscite</div>
          <div className="amount">{formatEuro(totSpese + totScadenze)}</div>
        </div>
        <div className="summary-card saldo">
          <div className="label">Saldo</div>
          <div className="amount" style={{color: saldo >= 0 ? 'var(--green)' : 'var(--red)'}}>{formatEuro(saldo)}</div>
        </div>
      </div>
      {totScadenze > 0 && (
        <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'14px',marginTop:'-6px',textAlign:'center'}}>
          di cui {formatEuro(totScadenze)} di scadenze in questo mese
        </div>
      )}

      {/* ENTRATE */}
      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0}}>💚 Entrate</div>
          <button className="btn small" style={{borderColor:'var(--green-border)',color:'var(--green)'}} onClick={() => setShowAddEntrata(v => !v)}>
            {showAddEntrata ? '✕ Annulla' : '+ Aggiungi'}
          </button>
        </div>

        {showAddEntrata && (
          <div className="add-spesa-form" style={{background:'var(--green-bg)',borderColor:'var(--green-border)'}}>
            <div className="form-row">
              <div className="form-group" style={{flex:2}}>
                <label>Descrizione</label>
                <input type="text" placeholder="Es. Stipendio" list="descEntrateList" value={formE.desc} onChange={e => setFormE(f => ({...f, desc: e.target.value}))} />
              </div>
              <div className="form-group">
                <label>Importo €</label>
                <input type="number" placeholder="0.00" value={formE.amount} onChange={e => setFormE(f => ({...f, amount: e.target.value}))} />
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Data</label>
                <input type="date" value={formE.date} onChange={e => setFormE(f => ({...f, date: e.target.value}))} />
              </div>
            </div>
            <button className="btn primary" style={{background:'var(--green)',borderColor:'var(--green)'}} onClick={addEntrata}>💾 Salva entrata</button>
          </div>
        )}

        {entrateMese.length === 0 && <div className="empty">Nessuna entrata questo mese</div>}
        {entrateMese.slice().sort((a,b) => b.date.localeCompare(a.date)).map(e => (
          <div className="entrata-item" key={e.id}>
            <div style={{flex:1}}>
              <div className="spesa-desc">{e.desc}</div>
              <div className="spesa-cat">{formatDataIT(e.date)}</div>
            </div>
            <div className="spesa-amount">{formatEuro(e.amount)}</div>
            <button className="spesa-delete" onClick={() => deleteEntrata(e)}>🗑</button>
          </div>
        ))}
      </div>

      {/* SPESE */}
      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0}}>💸 Spese</div>
          <button className="btn primary small" onClick={() => setShowAddSpesa(v => !v)}>
            {showAddSpesa ? '✕ Annulla' : '+ Aggiungi'}
          </button>
        </div>

        {showAddSpesa && (
          <div className="add-spesa-form">
            <div className="form-row">

                <label>Importo €</label>

                  <button type="button" className="btn primary small" onClick={addCatInline}>✓</button>
                  <button type="button" className="btn small" onClick={() => setShowNewCat(false)}>✕</button>
                </div>}
              </div>
              <div className="form-group">
                <label>Data</label>
                <input type="date" value={form.date} onChange={e => setForm(f => ({...f, date: e.target.value}))} />
              </div>
            </div>
            {form.cat && (
              <div className="form-row">
                <div className="form-group">
                  <label>Sottocategoria <span style={{fontWeight:'400',color:'var(--text3)'}}>(opzionale)</span></label>
                  <select required value={form.subcat} onChange={e => setForm(f => ({...f, subcat: e.target.value}))}>
                    <option value="">Nessuna</option>
                    {((data.sottocategorie || {})[form.cat] || []).map(s => <option key={s}>{s}</option>)}
                  </select>
                  {!showNewSubcat && <button type="button" onClick={() => setShowNewSubcat(true)} className="btn small" style={{marginTop:'6px',borderColor:'var(--accent)',color:'var(--accent)'}}>+ Nuova sottocategoria</button>}
                  {showNewSubcat && <div style={{display:'flex',gap:'4px',marginTop:'4px'}}>
                    <input type="text" placeholder="Nome sottocategoria" value={newSubcatInline} onChange={e => setNewSubcatInline(e.target.value)} onKeyDown={e => e.key==='Enter' && addSubcatInline()} style={{fontSize:'13px',padding:'4px 8px'}} />
                    <button type="button" className="btn primary small" onClick={addSubcatInline}>✓</button>
                    <button type="button" className="btn small" onClick={() => setShowNewSubcat(false)}>✕</button>
                  </div>}
                </div>
              </div>
            )}
            <button className="btn primary" onClick={addSpesa}>💾 Salva spesa</button>
          </div>
        )}

        {giorniOrdinati.length === 0 && <div className="empty">Nessuna spesa questo mese</div>}

        {giorniOrdinati.map(giorno => (
          <div className="day-group" key={giorno}>
            <div className="day-header">
              <span>{dayLabel(giorno)}</span>
              <span className="day-total">
                {formatEuro(spesePorGiorno[giorno].reduce((a, s) => a + Number(s.amount), 0))}
              </span>
            </div>
            {spesePorGiorno[giorno].map(s => (
              <div key={s.id}>
                <div className="spesa-item">
                  <div style={{flex:1}}>
                    <div className="spesa-desc">{s.desc}</div>
                    <div className="spesa-cat">{s.cat}{s.subcat ? ` › ${s.subcat}` : ''}</div>
                  </div>
                  <div className="spesa-amount">{formatEuro(s.amount)}</div>
                  <button className="btn small" onClick={() => startEditSpesa(s)}>✏️</button>
                  <button className="spesa-delete" onClick={() => deleteSpesa(s)}>🗑</button>
                </div>
                {editSpesaId === s.id && (
                  <div className="add-spesa-form" style={{marginTop:'-4px',marginBottom:'10px'}}>
                    <div className="form-row">
                      <div className="form-group" style={{flex:2}}>
                        <label>Descrizione</label>
                        <input type="text" placeholder="Descrizione" list="descSpeseList" value={editSpesaForm.desc} onChange={e => setEditSpesaForm(f => ({...f, desc: e.target.value}))} />
                      </div>
                      <div className="form-group">
                        <label>Importo €</label>
                        <input type="number" step="0.01" min="0" placeholder="0.00" value={editSpesaForm.amount} onChange={e => setEditSpesaForm(f => ({...f, amount: e.target.value}))} />
                      </div>
                    </div>
                    <div className="form-row">
                      <div className="form-group">
                        <label>Categoria</label>
                        <select required value={editSpesaForm.cat} onChange={e => setEditSpesaForm(f => ({...f, cat: e.target.value, subcat: ''}))}>
                          <option value="">Seleziona...</option>
                          {(data.categorie || DEFAULT_CATS).map(c => <option key={c}>{c}</option>)}
                        </select>
                      </div>
                      <div className="form-group">
                        <label>Data</label>
                        <input type="date" value={editSpesaForm.date} onChange={e => setEditSpesaForm(f => ({...f, date: e.target.value}))} />
                      </div>
                    </div>
                    {editSpesaForm.cat && (
                      <div className="form-row">
                        <div className="form-group">
                          <label>Sottocategoria <span style={{fontWeight:'400',color:'var(--text3)'}}>(opzionale)</span></label>
                          <select required value={editSpesaForm.subcat} onChange={e => setEditSpesaForm(f => ({...f, subcat: e.target.value}))}>
                            <option value="">Nessuna</option>
                            {((data.sottocategorie || {})[editSpesaForm.cat] || []).map(sc => <option key={sc}>{sc}</option>)}
                          </select>
                        </div>
                      </div>
                    )}
                    <div style={{display:'flex',gap:'8px'}}>
                      <button className="btn primary" onClick={() => saveEditSpesa(s)}>💾 Salva modifica</button>
                      <button className="btn" onClick={cancelEditSpesa}>✕ Annulla</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── SCADENZE TAB ───────────────────────────────────────────────────────────────
function ScadenzeTab({ data, saveData, addItems, removeItems, updateItem, askConfirm }) {
  const [show, setShow] = useState(false);
  const [form, setForm] = useState({ nome: '', amount: '', date: '', tipo: 'singola', unita: 'mesi', intervallo: '1', fineMese: false, numera: false });
  const [editId, setEditId] = useState(null);
  // tipo/unita/intervallo/fineMese servono per CORREGGERE la frequenza di un gruppo
  // ricorrente creato per errore (es. scelto "ogni mese" invece di "ogni 3 mesi")
  const [editForm, setEditForm] = useState({ nome: '', amount: '', date: '', tipo: 'ricorrente', unita: 'mesi', intervallo: '1', fineMese: false });
  const [editScope, setEditScope] = useState('singola'); // 'singola' | 'gruppo'
  // Riquadro "conferma pagamento": chiede la data effettiva di pagamento (default oggi)
  // prima di segnare una scadenza come pagata, così lo storico resta corretto anche
  // se la si registra qualche giorno dopo la scadenza effettiva.
  const [payDateId, setPayDateId] = useState(null);
  const [payDate, setPayDate] = useState('');

  function add() {
    if (!form.nome || !form.date) return;
    const baseId = Date.now();
    const ricorrente = form.tipo === 'ricorrente';
    const fineMese = ricorrente && form.unita === 'mesi' && !!form.fineMese;
    // Se "sempre fine mese" è attivo, anche la prima scadenza viene riportata
    // all'ultimo giorno del suo mese, per coerenza con le occorrenze successive
    let dataIniziale = form.date;
    if (fineMese) {
      const [y, m] = form.date.split('-').map(Number);
      dataIniziale = lastDayOfMonthStr(y, m);
    }
    const base = {
      id: baseId,
      nome: form.nome,
      amount: Number(form.amount),
      date: dataIniziale,
      pagato: false,
      ricorrente,
      unitaRicorrenza: ricorrente ? form.unita : null,
      intervalloValore: ricorrente ? Number(form.intervallo || 1) : null,
      fineMese,
      gruppoId: null,
      numerata: ricorrente && !!form.numera,
      rataNum: (ricorrente && form.numera) ? 1 : null,
    };
    let nuove = [base];
    if (ricorrente) {
      nuove = nuove.concat(generaOccorrenze(base, 12));
    }
    addItems('scadenze', nuove);
    setForm({ nome: '', amount: '', date: '', tipo: 'singola', unita: 'mesi', intervallo: '1', fineMese: false, numera: false });
    setShow(false);
  }
  // Apre il riquadro "conferma pagamento" (con data odierna precompilata) quando si segna
  // come pagata; riapre invece subito senza chiedere nulla (e svuota la data di pagamento).
  function togglePagato(item) {
    if (item.pagato) {
      updateItem('scadenze', item, { ...item, pagato: false, dataPagamento: null });
      return;
    }
    setPayDate(localDateStr());
    setPayDateId(item.id);
  }
  function confermaPagamento(item) {
    updateItem('scadenze', item, { ...item, pagato: true, dataPagamento: payDate || localDateStr() });
    setPayDateId(null);
    setPayDate('');
  }
  function annullaPagamento() {
    setPayDateId(null);
    setPayDate('');
  }
  // Apre lo stesso riquadro "conferma pagamento" ma per CORREGGERE la data di una
  // scadenza già segnata come pagata, precompilando la data attualmente salvata
  // (invece di oggi). Non serve riaprire e richiudere la scadenza.
  function correggiDataPagamento(item) {
    setPayDate(item.dataPagamento || localDateStr());
    setPayDateId(item.id);
  }
  async function del(item) {
    const ok = await askConfirm(`Eliminare la scadenza "${item.nome}"?`);
    if (!ok) return;
    removeItems('scadenze', [item]);
  }
  async function delGruppo(gruppoId, scadenzaId) {
    const daRimuovere = (data.scadenze || []).filter(s => s.id === scadenzaId || s.gruppoId === gruppoId || s.id === gruppoId);
    const ok = await askConfirm(`Eliminare tutte le rate di questo gruppo ricorrente (${daRimuovere.length} rate)?`);
    if (!ok) return;
    removeItems('scadenze', daRimuovere);
  }
  // Estende un gruppo ricorrente generando altre 12 occorrenze a partire dall'ultima esistente
  function estendiGruppo(gruppoId) {
    const tutte = data.scadenze || [];
    const delGruppoList = tutte.filter(s => s.id === gruppoId || s.gruppoId === gruppoId);
    if (delGruppoList.length === 0) return;
    const ultima = [...delGruppoList].sort((a, b) => b.date.localeCompare(a.date))[0];
    const finte = generaOccorrenze({ ...ultima, id: ultima.id, date: ultima.date }, 12);
    addItems('scadenze', finte);
  }

  function startEdit(s) {
    const norm = normalizzaRicorrenza(s);
    setEditId(s.id);
    setEditForm({
      nome: s.nome,
      amount: s.amount || '',
      date: s.date,
      tipo: s.ricorrente ? 'ricorrente' : 'singola',
      unita: norm.unita,
      intervallo: String(norm.valore),
      fineMese: norm.fineMese,
    });
    setEditScope('singola');
  }
  function cancelEdit() {
    setEditId(null);
  }
  async function saveEdit(s) {
    if (!editForm.nome) return;
    const gruppoKey = s.gruppoId || s.id; // id del gruppo "padre"
    if (editScope === 'gruppo' && s.ricorrente) {
      // CORREZIONE FREQUENZA: elimina questa rata e tutte le rate future NON pagate
      // dello stesso gruppo, poi le rigenera da zero con nome/importo/data/frequenza
      // corretti (utile se in fase di creazione è stata scelta la frequenza sbagliata).
      // Le rate già pagate restano intatte, non vengono toccate.
      const daRimuovere = (data.scadenze || []).filter(item => {
        const stessoGruppo = item.id === gruppoKey || item.gruppoId === gruppoKey;
        return stessoGruppo && !item.pagato;
      });
      await removeItems('scadenze', daRimuovere);

      if (editForm.tipo === 'singola') {
        // L'utente vuole interrompere la ricorrenza: questa rata diventa un'unica
        // scadenza singola (nessun'altra occorrenza futura viene generata)
        const nuovaSingola = {
          id: Date.now(),
          nome: editForm.nome,
          amount: Number(editForm.amount),
          date: editForm.date,
          pagato: false,
          ricorrente: false,
          unitaRicorrenza: null,
          intervalloValore: null,
          fineMese: false,
          gruppoId: null,
          numerata: false,
          rataNum: null,
        };
        await addItems('scadenze', [nuovaSingola]);
      } else {
        const fineMese = editForm.unita === 'mesi' && !!editForm.fineMese;
        let dataIniziale = editForm.date;
        if (fineMese) {
          const [y, m] = editForm.date.split('-').map(Number);
          dataIniziale = lastDayOfMonthStr(y, m);
        }
        // Nuovo id (Date.now()) invece di riusare gruppoKey: evita qualunque collisione
        // con gli id delle rate già pagate rimaste (che seguono lo schema gruppoKey+n)
        const nuovaBase = {
          id: Date.now(),
          nome: editForm.nome,
          amount: Number(editForm.amount),
          date: dataIniziale,
          pagato: false,
          ricorrente: true,
          unitaRicorrenza: editForm.unita,
          intervalloValore: Number(editForm.intervallo || 1),
          fineMese,
          gruppoId: null,
          numerata: !!s.numerata,
          rataNum: s.numerata ? (s.rataNum || 1) : null,
        };
        const nuoveOccorrenze = generaOccorrenze(nuovaBase, 12);
        await addItems('scadenze', [nuovaBase, ...nuoveOccorrenze]);
      }
    } else {
      // Solo questa singola rata
      const newItem = { ...s, nome: editForm.nome, amount: Number(editForm.amount), date: editForm.date };
      await updateItem('scadenze', s, newItem);
    }
    setEditId(null);
  }

  // Data usata per ORDINARE l'elenco: per le rate già pagate si usa la data effettiva
  // di pagamento (non quella di scadenza), così una rata pagata in anticipo scavalca
  // correttamente le rate ancora da pagare con scadenza precedente. Per le rate non
  // pagate resta invariato: si usa la data di scadenza.
  function dataOrdinamento(s) {
    return (s.pagato && s.dataPagamento) ? s.dataPagamento : s.date;
  }
  const sorted = [...(data.scadenze || [])].sort((a, b) => dataOrdinamento(a).localeCompare(dataOrdinamento(b)));
  // Nomi già usati in passato per le scadenze, per il completamento automatico del campo Nome
  const nomiScadenzeNote = Array.from(new Set((data.scadenze || []).map(s => s.nome).filter(Boolean)));

  // Totale scadenze del mese corrente (quello di oggi), da mostrare in evidenza in cima alla scheda.
  // Riusa lo stesso stile a "card" del riepilogo del Budget, così su iPhone resta leggibile
  // (esiste già una regola CSS dedicata che rimpicciolisce queste card sotto i 480px).
  const oggiScad = new Date();
  const meseCorrenteLabel = monthLabel(oggiScad.getFullYear(), oggiScad.getMonth() + 1);
  const scadenzeMeseCorrente = sorted.filter(s => isMeseCorrente(s.date));
  const totMeseCorrente = scadenzeMeseCorrente.reduce((a, s) => a + Number(s.amount || 0), 0);
  const totMesePagato = scadenzeMeseCorrente.filter(s => s.pagato).reduce((a, s) => a + Number(s.amount || 0), 0);
  const totMeseDaPagare = totMeseCorrente - totMesePagato;

  function tipoLabel(s) {
    if (!s.ricorrente) return null;
    const { unita, valore, fineMese } = normalizzaRicorrenza(s);
    if (unita === 'giorni') {
      if (valore === 7) return '🔄 Ogni settimana';
      if (valore === 14) return '🔄 Ogni 2 settimane';
      return `🔄 Ogni ${valore} giorni`;
    }
    const suffisso = fineMese ? ' (fine mese)' : '';
    if (valore === 1) return `🔄 Ogni mese${suffisso}`;
    return `🔄 Ogni ${valore} mesi${suffisso}`;
  }

  // Colore di sfondo della riga, per distinguere a colpo d'occhio pagate/scadute/da pagare/programmate
  function rowStyle(s) {
    if (s.pagato) return { background: 'var(--green-bg)', borderColor: 'var(--green-border)' };
    const col = scadenzaColor(s.date);
    if (col === 'rosso') return { background: 'var(--red-bg)', borderColor: 'var(--red-border)' };
    if (col === 'arancio') return { background: 'var(--orange-bg)', borderColor: 'var(--orange)' };
    return {};
  }

  // Stato unificato: testo + colore del pulsante, in base a pagato/scadenza
  function statoBtn(s) {
    if (s.pagato) return { label: '✓ Pagata', bg: 'var(--green)', border: 'var(--green)', color: '#fff' };
    const col = scadenzaColor(s.date); // 'rosso' | 'arancio' | 'verde'
    if (col === 'rosso') return { label: '⚠ Scaduta', bg: 'var(--red)', border: 'var(--red)', color: '#fff' };
    if (col === 'arancio') return { label: 'Da pagare', bg: 'var(--orange)', border: 'var(--orange)', color: '#fff' };
    return { label: 'Programmata', bg: 'var(--surface2)', border: 'var(--border2)', color: 'var(--text2)' };
  }

  return (
    <div className="section active">
      <datalist id="nomeScadenzeList">{nomiScadenzeNote.map(n => <option key={n} value={n} />)}</datalist>
      <div className="print-title">💜 Family CC — Scadenze</div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
        <div style={{fontSize:'17px',fontWeight:'700'}}>📅 Scadenze</div>
        <button className="btn primary small" onClick={() => setShow(v => !v)}>{show ? '✕ Annulla' : '+ Aggiungi'}</button>
      </div>

      <div className="summary-grid">
        <div className="summary-card uscite">
          <div className="label">Da pagare</div>
          <div className="amount">{formatEuro(totMeseDaPagare)}</div>
        </div>
        <div className="summary-card entrate">
          <div className="label">Già pagato</div>
          <div className="amount">{formatEuro(totMesePagato)}</div>
        </div>
        <div className="summary-card saldo">
          <div className="label">Totale mese</div>
          <div className="amount">{formatEuro(totMeseCorrente)}</div>
        </div>
      </div>
      <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'14px',marginTop:'-6px',textAlign:'center'}}>
        Scadenze di {meseCorrenteLabel}
      </div>

      <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'14px',lineHeight:'1.5'}}>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px',marginRight:'12px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'3px',background:'var(--red)'}}></span> scaduta</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px',marginRight:'12px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'3px',background:'var(--orange)'}}></span> da pagare (entro 5 giorni)</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px',marginRight:'12px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'3px',background:'var(--surface2)',border:'1px solid var(--border2)'}}></span> programmata</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px',marginRight:'12px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'3px',background:'var(--green)'}}></span> pagata</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'50%',background:'#f4d03f'}}></span> scadenza di questo mese</span>
      </div>

      {show && (
        <div className="card" style={{background:'var(--accent-light)'}}>
          <div className="form-row">
            <div className="form-group" style={{flex:2}}>
              <label>Nome</label>
              <input type="text" placeholder="Es. Affitto" list="nomeScadenzeList" value={form.nome} onChange={e => setForm(f => ({...f, nome: e.target.value}))} />
            </div>
            <div className="form-group">
              <label>Importo €</label>
              <input type="number" placeholder="0.00" step="0.01" min="0" value={form.amount} onChange={e => setForm(f => ({...f, amount: e.target.value}))} />
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Data {form.tipo === 'singola' ? 'scadenza' : 'prima scadenza'}</label>
              <input type="date" value={form.date} onChange={e => setForm(f => ({...f, date: e.target.value}))} />
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Tipo scadenza</label>
              <select value={form.tipo} onChange={e => setForm(f => ({...f, tipo: e.target.value}))}>
                <option value="singola">Singola (una sola data)</option>
                <option value="ricorrente">Ricorrente (si ripete nel tempo)</option>
              </select>
            </div>
          </div>
          {form.tipo === 'ricorrente' && (
            <>
              <div className="form-row">
                <div className="form-group" style={{maxWidth:'110px'}}>
                  <label>Ogni</label>
                  <input type="number" min="1" value={form.intervallo} onChange={e => setForm(f => ({...f, intervallo: e.target.value}))} />
                </div>
                <div className="form-group">
                  <label>Unità</label>
                  <select value={form.unita} onChange={e => setForm(f => ({...f, unita: e.target.value}))}>
                    <option value="giorni">Giorni</option>
                    <option value="mesi">Mesi</option>
                  </select>
                </div>
              </div>
              <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'10px'}}>
                Esempi: 15 giorni = quindicinale · 1 mese = mensile · 2 mesi = bimestrale · 3 mesi = trimestrale · 4 mesi = quadrimestrale · 6 mesi = semestrale · 12 mesi = annuale
              </div>
              {form.unita === 'mesi' && (
                <label style={{display:'flex',alignItems:'center',gap:'8px',fontSize:'13px',fontWeight:'500',marginBottom:'12px',cursor:'pointer'}}>
                  <input type="checkbox" checked={form.fineMese} onChange={e => setForm(f => ({...f, fineMese: e.target.checked}))} style={{width:'18px',height:'18px',cursor:'pointer',accentColor:'var(--accent)'}} />
                  Sempre l'ultimo giorno del mese (es. affitto a fine mese)
                </label>
              )}
              <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'10px'}}>
                Verranno generate automaticamente le prossime 12 occorrenze. Potrai modificarle o eliminarle singolarmente.

                        <div className="form-group">
                          <label>Unità</label>
                          <select value={editForm.unita} onChange={e => setEditForm(f => ({...f, unita: e.target.value}))}>
                            <option value="giorni">Giorni</option>

                      <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'10px'}}>

                      </div>
                      {editForm.unita === 'mesi' && (
                        <label style={{display:'flex',alignItems:'center',gap:'8px',fontSize:'13px',fontWeight:'500',marginBottom:'12px',cursor:'pointer'}}>
                          <input type="checkbox" checked={editForm.fineMese} onChange={e => setEditForm(f => ({...f, fineMese: e.target.checked}))} style={{width:'18px',height:'18px',cursor:'pointer',accentColor:'var(--accent)'}} />
                          Sempre l'ultimo giorno del mese
                        </label>
                      )}
                    </>
                  )}
                </>
              )}
              <div style={{display:'flex',gap:'8px'}}>
                <button className="btn primary" onClick={() => saveEdit(s)}>💾 Salva modifica</button>
                <button className="btn" onClick={cancelEdit}>✕ Annulla</button>
              </div>
            </div>
          )}
        </div>
        );
      })}
    </div>
  );
