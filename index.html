    setForm(f => ({ ...f, cat: newCatInline.trim() }));
    setNewCatInline('');
    setShowNewCat(false);
  }

  function addSubcatInline() {
    if (!newSubcatInline.trim() || !form.cat) return;
    const subcats = { ...(data.sottocategorie || {}) };
    if (!subcats[form.cat]) subcats[form.cat] = [];
    subcats[form.cat] = [...subcats[form.cat], newSubcatInline.trim()];
    saveData({ sottocategorie: subcats });
    setForm(f => ({ ...f, subcat: newSubcatInline.trim() }));
    setNewSubcatInline('');
    setShowNewSubcat(false);
  }

  function prevMonth() {
    if (month === 1) { setMonth(12); setYear(y => y - 1); }
    else setMonth(m => m - 1);
  }
  function nextMonth() {
    if (month === 12) { setMonth(1); setYear(y => y + 1); }
    else setMonth(m => m + 1);
  }

  // Elenchi di descrizioni già usate in passato, per il completamento automatico dei campi
  // (nessun dato nuovo da salvare: si riusano semplicemente le spese/entrate già registrate)
  const descSpeseNote = Array.from(new Set((data.spese || []).map(s => s.desc).filter(Boolean)));
  const descEntrateNote = Array.from(new Set((data.entrate || []).map(e => e.desc).filter(Boolean)));

  const speseMese = (data.spese || []).filter(s => {
    const [sy, sm] = s.date.split('-').map(Number);
    return sy === year && sm === month;
  });
  const entrateMese = (data.entrate || []).filter(e => {
    const [ey, em] = e.date.split('-').map(Number);
    return ey === year && em === month;
  });

  const totSpese = speseMese.reduce((a, s) => a + Number(s.amount), 0);
  const totEntrate = entrateMese.reduce((a, e) => a + Number(e.amount), 0);
  const scadenzeMese = (data.scadenze || []).filter(sc => {
    const [scy, scm] = sc.date.split('-').map(Number);
    return scy === year && scm === month;
  });
  const totScadenze = scadenzeMese.reduce((a, sc) => a + Number(sc.amount || 0), 0);
  const saldo = totEntrate - totSpese - totScadenze;

  // ── Scadenze del mese raggruppate per tipo (v53) ──────────────────────────
  // Il "tipo" è ricavato dal nome della scadenza togliendo numeri, codici e la parola
  // "rata": così ad es. "Rottamazione Quater Giorgio 011 0180" e "... 011 0250" finiscono
  // nello stesso riquadro "Rottamazione Quater Giorgio". Ogni gruppo ha il suo subtotale.
  function tipoScadenza(nome) {
    const pulito = (nome || '')
      .split(/\s+/)
      .filter(w => w && !/\d/.test(w) && !/^(rata|n\.?|nr\.?|num\.?|-|–|\/|#)$/i.test(w))
      .join(' ')
      .trim();
    return pulito || (nome || 'Senza nome').trim();
  }
  const gruppiScadMese = {};
  for (const sc of scadenzeMese) {
    const label = tipoScadenza(sc.nome);
    const chiave = label.toLowerCase();
    if (!gruppiScadMese[chiave]) gruppiScadMese[chiave] = { label, voci: [] };
    gruppiScadMese[chiave].voci.push(sc);
  }
  const gruppiScadOrdinati = Object.values(gruppiScadMese)
    .map(g => ({ ...g, totale: g.voci.reduce((a, sc) => a + Number(sc.amount || 0), 0) }))
    .sort((a, b) => a.label.localeCompare(b.label, 'it', { numeric: true, sensitivity: 'base' }));
  for (const g of gruppiScadOrdinati) {
    g.voci.sort((a, b) => a.date.localeCompare(b.date) || (a.nome || '').localeCompare(b.nome || '', 'it', { numeric: true, sensitivity: 'base' }));
  }

  // Raggruppa spese per giorno, ordine cronologico inverso (giorno più recente in cima)
  const spesePorGiorno = {};
  for (const s of speseMese) {
    if (!spesePorGiorno[s.date]) spesePorGiorno[s.date] = [];
    spesePorGiorno[s.date].push(s);
  }
  // Ordina le chiavi (giorni) dal più recente al più vecchio
  const giorniOrdinati = Object.keys(spesePorGiorno).sort((a, b) => b.localeCompare(a));
  // Ordina le spese dentro ogni giorno: più recente in cima (usa id/timestamp)
  for (const g of giorniOrdinati) {
    spesePorGiorno[g].sort((a, b) => (b.id || 0) - (a.id || 0));
  }

  function addSpesa() {
    if (!form.desc || !form.amount) return;
    const s = { id: Date.now(), desc: form.desc, amount: importoIT(form.amount), cat: form.cat || 'Altro', subcat: form.subcat || '', date: form.date };
    addItems('spese', [s]);
    setForm({ desc: '', amount: '', cat: '', subcat: '', date: localDateStr() });
    setShowAddSpesa(false);
  }
  async function deleteSpesa(item) {
    const ok = await askConfirm(`Eliminare la spesa "${item.desc}" (${formatEuro(item.amount)})?`);
    if (!ok) return;
    removeItems('spese', [item]);
  }
  function startEditSpesa(s) {
    setEditSpesaId(s.id);
    setEditSpesaForm({ desc: s.desc, amount: numPerCampo(s.amount), cat: s.cat || '', subcat: s.subcat || '', date: s.date });
  }
  function cancelEditSpesa() {
    setEditSpesaId(null);
  }
  function saveEditSpesa(oldItem) {
    if (!editSpesaForm.desc || !editSpesaForm.amount) return;
    const newItem = { ...oldItem, desc: editSpesaForm.desc, amount: importoIT(editSpesaForm.amount), cat: editSpesaForm.cat || 'Altro', subcat: editSpesaForm.subcat || '', date: editSpesaForm.date };
    updateItem('spese', oldItem, newItem);
    setEditSpesaId(null);
  }
  function addEntrata() {
    if (!formE.desc || !formE.amount) return;
    const e = { id: Date.now(), desc: formE.desc, amount: importoIT(formE.amount), date: formE.date };
    addItems('entrate', [e]);
    setFormE({ desc: '', amount: '', date: localDateStr() });
    setShowAddEntrata(false);
  }
  async function deleteEntrata(item) {
    const ok = await askConfirm(`Eliminare l'entrata "${item.desc}" (${formatEuro(item.amount)})?`);
    if (!ok) return;
    removeItems('entrate', [item]);
  }

  return (
    <div className="section active">
      <datalist id="descSpeseList">{descSpeseNote.map(d => <option key={d} value={d} />)}</datalist>
      <datalist id="descEntrateList">{descEntrateNote.map(d => <option key={d} value={d} />)}</datalist>
      <div className="print-title">💜 Family CC — Budget — {monthLabel(year, month)}</div>
      <div className="budget-header">
        <div className="month-nav">
          <button onClick={prevMonth}>‹</button>
          <div className="month-label">{monthLabel(year, month)}</div>
          <button onClick={nextMonth}>›</button>
        </div>
      </div>

      <div className="summary-grid">
        <div className="summary-card entrate">
          <div className="label">Entrate</div>
          <div className="amount">{formatEuro(totEntrate)}</div>
        </div>
        <div className="summary-card uscite">
          <div className="label">Uscite</div>
          <div className="amount">{formatEuro(totSpese + totScadenze)}</div>
          <div className="uscite-split">
            <div><span>Spese</span><span>{formatEuro(totSpese)}</span></div>
            <div><span>Scadenze</span><span>{formatEuro(totScadenze)}</span></div>
          </div>
        </div>
        <div className="summary-card saldo">
          <div className="label">Saldo</div>
          <div className="amount" style={{color: saldo >= 0 ? 'var(--green)' : 'var(--red)'}}>{formatEuro(saldo)}</div>
        </div>
      </div>

      {/* ENTRATE */}
      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0}}>💚 Entrate</div>
          <button className="btn small" style={{borderColor:'var(--green-border)',color:'var(--green)'}} onClick={() => setShowAddEntrata(v => !v)}>
            {showAddEntrata ? '✕ Annulla' : '+ Aggiungi'}
          </button>
        </div>

        {showAddEntrata && (
          <div className="add-spesa-form" style={{background:'var(--green-bg)',borderColor:'var(--green-border)'}}>
            <div className="form-row">
              <div className="form-group" style={{flex:2}}>
                <label>Descrizione</label>
                <input type="text" placeholder="Es. Stipendio" list="descEntrateList" value={formE.desc} onChange={e => setFormE(f => ({...f, desc: e.target.value}))} />
              </div>
              <div className="form-group">
                <label>Importo €</label>
                <input type="text" inputMode="decimal" placeholder="0,00" value={formE.amount} onChange={e => setFormE(f => ({...f, amount: e.target.value}))} />
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Data</label>
                <input type="date" value={formE.date} onChange={e => setFormE(f => ({...f, date: e.target.value}))} />
              </div>
            </div>
            <button className="btn primary" style={{background:'var(--green)',borderColor:'var(--green)'}} onClick={addEntrata}>💾 Salva entrata</button>
          </div>
        )}

        {entrateMese.length === 0 && <div className="empty">Nessuna entrata questo mese</div>}
        {entrateMese.slice().sort((a,b) => b.date.localeCompare(a.date)).map(e => (
          <div className="entrata-item" key={e.id}>
            <div style={{flex:1}}>
              <div className="spesa-desc">{e.desc}</div>
              <div className="spesa-cat">{formatDataIT(e.date)}</div>
            </div>
            <div className="spesa-amount">{formatEuro(e.amount)}</div>
            <button className="spesa-delete" onClick={() => deleteEntrata(e)}>🗑</button>
          </div>
        ))}
      </div>

      {/* SPESE */}
      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0}}>💸 Spese</div>
          <button className="btn primary small" onClick={() => setShowAddSpesa(v => !v)}>
            {showAddSpesa ? '✕ Annulla' : '+ Aggiungi'}
          </button>
        </div>

        {showAddSpesa && (
          <div className="add-spesa-form">
            <div className="form-row">
              <div className="form-group" style={{flex:2}}>
                <label>Descrizione</label>
                <input type="text" placeholder="Es. Supermercato" list="descSpeseList" value={form.desc} onChange={e => setForm(f => ({...f, desc: e.target.value}))} />
              </div>
              <div className="form-group">
                <label>Importo €</label>
                <input type="text" inputMode="decimal" placeholder="0,00" value={form.amount} onChange={e => setForm(f => ({...f, amount: e.target.value}))} />
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Categoria</label>
                <select required value={form.cat} onChange={e => { setForm(f => ({...f, cat: e.target.value, subcat: ''})); setShowNewCat(false); }}>
                  <option value="">Seleziona...</option>
                  {(data.categorie || DEFAULT_CATS).map(c => <option key={c}>{c}</option>)}
                </select>
                {!showNewCat && <button type="button" onClick={() => setShowNewCat(true)} className="btn small" style={{marginTop:'6px',borderColor:'var(--accent)',color:'var(--accent)'}}>+ Nuova categoria</button>}
                {showNewCat && <div style={{display:'flex',gap:'4px',marginTop:'4px'}}>
                  <input type="text" placeholder="Nome categoria" value={newCatInline} onChange={e => setNewCatInline(e.target.value)} onKeyDown={e => e.key==='Enter' && addCatInline()} style={{fontSize:'13px',padding:'4px 8px'}} />
                  <button type="button" className="btn primary small" onClick={addCatInline}>✓</button>
                  <button type="button" className="btn small" onClick={() => setShowNewCat(false)}>✕</button>
                </div>}
              </div>
              <div className="form-group">
                <label>Data</label>
                <input type="date" value={form.date} onChange={e => setForm(f => ({...f, date: e.target.value}))} />
              </div>
            </div>
            {form.cat && (
              <div className="form-row">
                <div className="form-group">
                  <label>Sottocategoria <span style={{fontWeight:'400',color:'var(--text3)'}}>(opzionale)</span></label>
                  <select required value={form.subcat} onChange={e => setForm(f => ({...f, subcat: e.target.value}))}>
                    <option value="">Nessuna</option>
                    {((data.sottocategorie || {})[form.cat] || []).map(s => <option key={s}>{s}</option>)}
                  </select>
                  {!showNewSubcat && <button type="button" onClick={() => setShowNewSubcat(true)} className="btn small" style={{marginTop:'6px',borderColor:'var(--accent)',color:'var(--accent)'}}>+ Nuova sottocategoria</button>}
                  {showNewSubcat && <div style={{display:'flex',gap:'4px',marginTop:'4px'}}>
                    <input type="text" placeholder="Nome sottocategoria" value={newSubcatInline} onChange={e => setNewSubcatInline(e.target.value)} onKeyDown={e => e.key==='Enter' && addSubcatInline()} style={{fontSize:'13px',padding:'4px 8px'}} />
                    <button type="button" className="btn primary small" onClick={addSubcatInline}>✓</button>
                    <button type="button" className="btn small" onClick={() => setShowNewSubcat(false)}>✕</button>
                  </div>}
                </div>
              </div>
            )}
            <button className="btn primary" onClick={addSpesa}>💾 Salva spesa</button>
          </div>
        )}

        {giorniOrdinati.length === 0 && <div className="empty">Nessuna spesa questo mese</div>}

        {giorniOrdinati.map(giorno => (
          <div className="day-group" key={giorno}>
            <div className="day-header">
              <span>{dayLabel(giorno)}</span>
              <span className="day-total">
                {formatEuro(spesePorGiorno[giorno].reduce((a, s) => a + Number(s.amount), 0))}
              </span>
            </div>
            {spesePorGiorno[giorno].map(s => (
              <div key={s.id}>
                <div className="spesa-item">
                  <div style={{flex:1}}>
                    <div className="spesa-desc">{s.desc}</div>
                    <div className="spesa-cat">{s.cat}{s.subcat ? ` › ${s.subcat}` : ''}</div>
                  </div>
                  <div className="spesa-amount">{formatEuro(s.amount)}</div>
                  <button className="btn small" onClick={() => startEditSpesa(s)}>✏️</button>
                  <button className="spesa-delete" onClick={() => deleteSpesa(s)}>🗑</button>
                </div>
                {editSpesaId === s.id && (
                  <div className="add-spesa-form" style={{marginTop:'-4px',marginBottom:'10px'}}>
                    <div className="form-row">
                      <div className="form-group" style={{flex:2}}>
                        <label>Descrizione</label>
                        <input type="text" placeholder="Descrizione" list="descSpeseList" value={editSpesaForm.desc} onChange={e => setEditSpesaForm(f => ({...f, desc: e.target.value}))} />
                      </div>
                      <div className="form-group">
                        <label>Importo €</label>
                        <input type="text" inputMode="decimal" placeholder="0,00" value={editSpesaForm.amount} onChange={e => setEditSpesaForm(f => ({...f, amount: e.target.value}))} />
                      </div>
                    </div>
                    <div className="form-row">
                      <div className="form-group">
                        <label>Categoria</label>
                        <select required value={editSpesaForm.cat} onChange={e => setEditSpesaForm(f => ({...f, cat: e.target.value, subcat: ''}))}>
                          <option value="">Seleziona...</option>
                          {(data.categorie || DEFAULT_CATS).map(c => <option key={c}>{c}</option>)}
                        </select>
                      </div>
                      <div className="form-group">
                        <label>Data</label>
                        <input type="date" value={editSpesaForm.date} onChange={e => setEditSpesaForm(f => ({...f, date: e.target.value}))} />
                      </div>
                    </div>
                    {editSpesaForm.cat && (
                      <div className="form-row">
                        <div className="form-group">
                          <label>Sottocategoria <span style={{fontWeight:'400',color:'var(--text3)'}}>(opzionale)</span></label>
                          <select required value={editSpesaForm.subcat} onChange={e => setEditSpesaForm(f => ({...f, subcat: e.target.value}))}>
                            <option value="">Nessuna</option>
                            {((data.sottocategorie || {})[editSpesaForm.cat] || []).map(sc => <option key={sc}>{sc}</option>)}
                          </select>
                        </div>
                      </div>
                    )}
                    <div style={{display:'flex',gap:'8px'}}>
                      <button className="btn primary" onClick={() => saveEditSpesa(s)}>💾 Salva modifica</button>
                      <button className="btn" onClick={cancelEditSpesa}>✕ Annulla</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        ))}
      </div>

      {/* SCADENZE DEL MESE, raggruppate per tipo */}
      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="card-title" style={{marginBottom:0}}>📅 Scadenze del mese</div>
          <div style={{fontWeight:700,color:'var(--red)'}}>{formatEuro(totScadenze)}</div>
        </div>
        {gruppiScadOrdinati.length === 0 && <div className="empty">Nessuna scadenza questo mese</div>}
        {gruppiScadOrdinati.map(g => (
          <div className="scad-tipo-box" key={g.label}>
            <div className="scad-tipo-header">
              <span>{g.label}{g.voci.length > 1 ? ` (${g.voci.length})` : ''}</span>
              <span>{formatEuro(g.totale)}</span>
            </div>
            {g.voci.map(sc => (
              <div className="scad-tipo-row" key={sc.id}>
                <div style={{flex:1,minWidth:0}}>
                  <div className="spesa-desc">{sc.nome}</div>
                  <div className="spesa-cat">
                    {formatDataIT(sc.date)}{' · '}
                    {sc.pagato
                      ? <span style={{color:'var(--green)',fontWeight:600}}>✓ Pagata</span>
                      : <span style={{color:'var(--orange)',fontWeight:600}}>Da pagare</span>}
                  </div>
                </div>
                <div className="spesa-amount">{formatEuro(sc.amount)}</div>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── SCADENZE TAB ───────────────────────────────────────────────────────────────
function ScadenzeTab({ data, saveData, addItems, removeItems, updateItem, askConfirm }) {
  const [show, setShow] = useState(false);
  const [form, setForm] = useState({ nome: '', amount: '', date: '', tipo: 'singola', unita: 'mesi', intervallo: '1', fineMese: false, numera: false, tolleranza: '' });
  const [editId, setEditId] = useState(null);
  // tipo/unita/intervallo/fineMese servono per CORREGGERE la frequenza di un gruppo
  // ricorrente creato per errore (es. scelto "ogni mese" invece di "ogni 3 mesi")
  const [editForm, setEditForm] = useState({ nome: '', amount: '', date: '', dataPagamento: '', tipo: 'ricorrente', unita: 'mesi', intervallo: '1', fineMese: false, rataNum: '', tolleranza: '' });
  const [editScope, setEditScope] = useState('singola'); // 'singola' | 'gruppo'
  // Riquadro "conferma pagamento": chiede la data effettiva di pagamento (default oggi)
  // prima di segnare una scadenza come pagata, così lo storico resta corretto anche
  // se la si registra qualche giorno dopo la scadenza effettiva.
  const [payDateId, setPayDateId] = useState(null);
  const [payDate, setPayDate] = useState('');

  function add() {
    if (!form.nome || !form.date) return;
    const baseId = Date.now();
    const ricorrente = form.tipo === 'ricorrente';
    const fineMese = ricorrente && form.unita === 'mesi' && !!form.fineMese;
    // Se "sempre fine mese" è attivo, anche la prima scadenza viene riportata
    // all'ultimo giorno del suo mese, per coerenza con le occorrenze successive
    let dataIniziale = form.date;
    if (fineMese) {
      const [y, m] = form.date.split('-').map(Number);
      dataIniziale = lastDayOfMonthStr(y, m);
    }
    const base = {
      id: baseId,
      nome: form.nome,
      amount: importoIT(form.amount),
      date: dataIniziale,
      pagato: false,
      ricorrente,
      unitaRicorrenza: ricorrente ? form.unita : null,
      intervalloValore: ricorrente ? Number(form.intervallo || 1) : null,
      fineMese,
      gruppoId: null,
      numerata: ricorrente && !!form.numera,
      rataNum: (ricorrente && form.numera) ? 1 : null,
      tolleranzaGiorni: Number(form.tolleranza || 0),
    };
    let nuove = [base];
    if (ricorrente) {
      nuove = nuove.concat(generaOccorrenze(base, 12));
    }
    addItems('scadenze', nuove);
    setForm({ nome: '', amount: '', date: '', tipo: 'singola', unita: 'mesi', intervallo: '1', fineMese: false, numera: false, tolleranza: '' });
    setShow(false);
  }
  // Apre il riquadro "conferma pagamento" (con data odierna precompilata) quando si segna
  // come pagata; riapre invece subito senza chiedere nulla (e svuota la data di pagamento).
  // Riaprendo, la rata viene anche marcata "riaperta" (v49): resta nel mese di competenza
  // ma si distingue visivamente (bordo tratteggiato arancio + etichetta), così non si perde
  // traccia del fatto che era stata pagata e poi riaperta.
  function togglePagato(item) {
    if (item.pagato) {
      updateItem('scadenze', item, { ...item, pagato: false, dataPagamento: null, riaperta: true });
      return;
    }
    setPayDate(localDateStr());
    setPayDateId(item.id);
  }
  function confermaPagamento(item) {
    updateItem('scadenze', item, { ...item, pagato: true, dataPagamento: payDate || localDateStr(), riaperta: false });
    setPayDateId(null);
    setPayDate('');
  }
  function annullaPagamento() {
    setPayDateId(null);
    setPayDate('');
  }
  // Apre lo stesso riquadro "conferma pagamento" ma per CORREGGERE la data di una
  // scadenza già segnata come pagata, precompilando la data attualmente salvata
  // (invece di oggi). Non serve riaprire e richiudere la scadenza.
  function correggiDataPagamento(item) {
    setPayDate(item.dataPagamento || localDateStr());
    setPayDateId(item.id);
  }
  // Attiva/disattiva le notifiche prioritarie (avvisi ripetuti ogni tot ore) per questa
  // scadenza. Tutte le scadenze ricevono comunque l'avviso normale (giorno prima + giorno
  // stesso all'orario base); questo flag aggiunge SOLO la ripetizione extra.
  function togglePrioritaria(item) {
    updateItem('scadenze', item, { ...item, prioritaria: !item.prioritaria });
  }
  async function del(item) {
    const ok = await askConfirm(`Eliminare la scadenza "${item.nome}"?`);
    if (!ok) return;
    removeItems('scadenze', [item]);
  }
  async function delGruppo(gruppoId, scadenzaId) {
    const daRimuovere = (data.scadenze || []).filter(s => s.id === scadenzaId || s.gruppoId === gruppoId || s.id === gruppoId);
    const ok = await askConfirm(`Eliminare tutte le rate di questo gruppo ricorrente (${daRimuovere.length} rate)?`);
    if (!ok) return;
    removeItems('scadenze', daRimuovere);
  }
  // Estende un gruppo ricorrente generando altre 12 occorrenze a partire dall'ultima esistente
  function estendiGruppo(gruppoId) {
    const tutte = data.scadenze || [];
    const delGruppoList = tutte.filter(s => s.id === gruppoId || s.gruppoId === gruppoId);
    if (delGruppoList.length === 0) return;
    const ultima = [...delGruppoList].sort((a, b) => b.date.localeCompare(a.date))[0];
    const finte = generaOccorrenze({ ...ultima, id: ultima.id, date: ultima.date }, 12);
    addItems('scadenze', finte);
  }

  function startEdit(s) {
    const norm = normalizzaRicorrenza(s);
    setEditId(s.id);
    setEditForm({
      nome: s.nome,
      amount: numPerCampo(s.amount || ''),
      date: s.date,
      dataPagamento: s.dataPagamento || '',
      tipo: s.ricorrente ? 'ricorrente' : 'singola',
      unita: norm.unita,
      intervallo: String(norm.valore),
      fineMese: norm.fineMese,
      rataNum: (s.rataNum != null) ? String(s.rataNum) : '',
      tolleranza: (s.tolleranzaGiorni != null) ? String(s.tolleranzaGiorni) : '',
    });
    setEditScope('singola');
  }
  function cancelEdit() {
    setEditId(null);
  }
  async function saveEdit(s) {
    if (!editForm.nome) return;
    const gruppoKey = s.gruppoId || s.id; // id del gruppo "padre"
    if (editScope === 'gruppo' && s.ricorrente) {
      // CORREZIONE FREQUENZA: elimina questa rata e tutte le rate future NON pagate
      // dello stesso gruppo, poi le rigenera da zero con nome/importo/data/frequenza
      // corretti (utile se in fase di creazione è stata scelta la frequenza sbagliata).
      // Le rate già pagate restano intatte, non vengono toccate.
      const daRimuovere = (data.scadenze || []).filter(item => {
        const stessoGruppo = item.id === gruppoKey || item.gruppoId === gruppoKey;
        return stessoGruppo && !item.pagato;
      });
      await removeItems('scadenze', daRimuovere);

      if (editForm.tipo === 'singola') {
        // L'utente vuole interrompere la ricorrenza: questa rata diventa un'unica
        // scadenza singola (nessun'altra occorrenza futura viene generata)
        const nuovaSingola = {
          id: Date.now(),
          nome: editForm.nome,
          amount: importoIT(editForm.amount),
          date: editForm.date,
          pagato: false,
          ricorrente: false,
          unitaRicorrenza: null,
          intervalloValore: null,
          fineMese: false,
          gruppoId: null,
          numerata: false,
          rataNum: null,
          tolleranzaGiorni: Number(editForm.tolleranza || 0),
        };
        await addItems('scadenze', [nuovaSingola]);
      } else {
        const fineMese = editForm.unita === 'mesi' && !!editForm.fineMese;
        let dataIniziale = editForm.date;
        if (fineMese) {
          const [y, m] = editForm.date.split('-').map(Number);
          dataIniziale = lastDayOfMonthStr(y, m);
        }
        // Nuovo id (Date.now()) invece di riusare gruppoKey: evita qualunque collisione
        // con gli id delle rate già pagate rimaste (che seguono lo schema gruppoKey+n)
        const nuovaBase = {
          id: Date.now(),
          nome: editForm.nome,
          amount: importoIT(editForm.amount),
          date: dataIniziale,
          pagato: false,
          ricorrente: true,
          unitaRicorrenza: editForm.unita,
          intervalloValore: Number(editForm.intervallo || 1),
          fineMese,
          gruppoId: null,
          numerata: !!s.numerata,
          rataNum: s.numerata ? (s.rataNum || 1) : null,
          tolleranzaGiorni: Number(editForm.tolleranza || 0),
        };
        const nuoveOccorrenze = generaOccorrenze(nuovaBase, 12);
        await addItems('scadenze', [nuovaBase, ...nuoveOccorrenze]);
      }
    } else {
      // Solo questa singola rata. Il numero di rata può essere corretto a mano qui
      // (utile se in fase di creazione/generazione era sbagliato): un campo vuoto
      // lascia la numerazione come prima, un numero valido la sovrascrive.
      const rataNumCorretto = editForm.rataNum !== '' ? Number(editForm.rataNum) : s.rataNum;
      const newItem = {
        ...s,
        nome: editForm.nome,
        amount: importoIT(editForm.amount),
        date: editForm.date,
        rataNum: rataNumCorretto,
        numerata: editForm.rataNum !== '' ? true : s.numerata,
        tolleranzaGiorni: Number(editForm.tolleranza || 0),
        // Data di pagamento correggibile qui solo se la rata è già pagata (altrimenti
        // non ha senso salvarne una: una rata "da pagare" non ha una data di pagamento)
        dataPagamento: s.pagato ? (editForm.dataPagamento || s.dataPagamento) : s.dataPagamento,
      };
      await updateItem('scadenze', s, newItem);
    }
    setEditId(null);
  }

  // Data usata per ORDINARE l'elenco: per le rate già pagate si usa la data effettiva
  // di pagamento (non quella di scadenza), così una rata pagata in anticipo scavalca
  // correttamente le rate ancora da pagare con scadenza precedente. Per le rate non
  // pagate resta invariato: si usa la data di scadenza.
  function dataOrdinamento(s) {
    return (s.pagato && s.dataPagamento) ? s.dataPagamento : s.date;
  }
  // ── Ordinamento elenco (v40) ──────────────────────────────────────────────
  // L'elenco è diviso in TRE blocchi, in quest'ordine:
  //   1) PAGATE (verdi) — in cima
  //   2) SCADUTE + DA PAGARE (rosse/arancioni) — subito dopo
  //   3) PROGRAMMATE (future, non ancora vicine alla scadenza) — in fondo
  // Le scadenze GIÀ PAGATE vengono raggruppate: tutte le rate di uno stesso gruppo
  // ricorrente (es. Orantour Rata 1, 2, 3...) stanno una di seguito all'altra, in ordine di
  // rata/data, invece di essere sparse in mezzo alle altre scadenze pagate in date diverse.
  // I vari gruppi (e le scadenze singole pagate) tra loro restano ordinati in base alla data
  // di pagamento più recente del gruppo, dal più recente al più vecchio.
  const nonPagate = (data.scadenze || []).filter(s => !s.pagato);
  const nonPagateUrgenti = nonPagate.filter(s => scadenzaColor(s.date, s.tolleranzaGiorni) !== 'verde')
    .sort((a, b) => dataOrdinamento(a).localeCompare(dataOrdinamento(b)));
  const nonPagateProgrammate = nonPagate.filter(s => scadenzaColor(s.date, s.tolleranzaGiorni) === 'verde')
    .sort((a, b) => dataOrdinamento(a).localeCompare(dataOrdinamento(b)));

  const pagate = (data.scadenze || []).filter(s => s.pagato);
  const gruppiPagati = {}; // chiave: gruppoId (o id stesso se scadenza singola non ricorrente)
  for (const s of pagate) {
    const chiave = s.gruppoId || s.id;
    if (!gruppiPagati[chiave]) gruppiPagati[chiave] = [];
    gruppiPagati[chiave].push(s);
  }
  const gruppiPagatiOrdinati = Object.values(gruppiPagati).map(rate => {
    // Dentro al gruppo: ordina per numero di rata se numerata, altrimenti per data di pagamento
    rate.sort((a, b) => {
      if (a.numerata && b.numerata) return (a.rataNum || 0) - (b.rataNum || 0);
      return dataOrdinamento(a).localeCompare(dataOrdinamento(b));
    });
    const dataPiuRecente = rate.reduce((max, s) => dataOrdinamento(s) > max ? dataOrdinamento(s) : max, '');
    return { rate, dataPiuRecente };
  });
  gruppiPagatiOrdinati.sort((a, b) => b.dataPiuRecente.localeCompare(a.dataPiuRecente));
  const pagateOrdinate = gruppiPagatiOrdinati.flatMap(g => g.rate);

  const sorted = [...pagateOrdinate, ...nonPagateUrgenti, ...nonPagateProgrammate];
  // Nomi già usati in passato per le scadenze, per il completamento automatico del campo Nome
  const nomiScadenzeNote = Array.from(new Set((data.scadenze || []).map(s => s.nome).filter(Boolean)));

  // ── Raggruppamento visivo per mese (v47) ──────────────────────────────────
  // Tutte le scadenze di uno stesso mese solare (pagate, scadute, da pagare o programmate,
  // di qualunque gruppo ricorrente o singole) vengono racchiuse in un unico riquadro con
  // cornice, per capire a colpo d'occhio se in quel mese resta ancora qualcosa in sospeso,
  // senza dover scorrere tutto l'elenco cercandole. I mesi sono ordinati cronologicamente;
  // dentro ogni mese le voci sono ordinate per descrizione (v50), non più per data/pagata,
  // così le scadenze omonime o quasi identiche (es. varie "Rottamazione Quater Giorgio")
  // finiscono vicine tra loro invece che sparse. L'ordinamento è "naturale": i numeri
  // presenti nel testo (es. un codice come "011 0180") vengono confrontati come numeri e
  // non lettera per lettera, così "...0180" precede correttamente "...0250" invece di
  // finire dopo per un confronto puramente alfabetico delle singole cifre.
  const gruppiPerMese = {};
  for (const s of (data.scadenze || [])) {
    const chiaveMese = s.date.slice(0, 7); // "yyyy-mm"
    if (!gruppiPerMese[chiaveMese]) gruppiPerMese[chiaveMese] = [];
    gruppiPerMese[chiaveMese].push(s);
  }
  const mesiOrdinati = Object.keys(gruppiPerMese).sort();
  for (const chiave of mesiOrdinati) {
    gruppiPerMese[chiave].sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'it', { numeric: true, sensitivity: 'base' }));
  }

  // Totale scadenze del mese corrente (quello di oggi), da mostrare in evidenza in cima alla scheda.
  // Riusa lo stesso stile a "card" del riepilogo del Budget, così su iPhone resta leggibile
  // (esiste già una regola CSS dedicata che rimpicciolisce queste card sotto i 480px).
  const oggiScad = new Date();
  const meseCorrenteLabel = monthLabel(oggiScad.getFullYear(), oggiScad.getMonth() + 1);
  const scadenzeMeseCorrente = sorted.filter(s => isMeseCorrente(s.date));
  const totMeseCorrente = scadenzeMeseCorrente.reduce((a, s) => a + Number(s.amount || 0), 0);
  const totMesePagato = scadenzeMeseCorrente.filter(s => s.pagato).reduce((a, s) => a + Number(s.amount || 0), 0);
  const totMeseDaPagare = totMeseCorrente - totMesePagato;

  function tipoLabel(s) {
    if (!s.ricorrente) return null;
    const { unita, valore, fineMese } = normalizzaRicorrenza(s);
    if (unita === 'giorni') {
      if (valore === 7) return '🔄 Ogni settimana';
      if (valore === 14) return '🔄 Ogni 2 settimane';
      return `🔄 Ogni ${valore} giorni`;
    }
    const suffisso = fineMese ? ' (fine mese)' : '';
    if (valore === 1) return `🔄 Ogni mese${suffisso}`;
    return `🔄 Ogni ${valore} mesi${suffisso}`;
  }

  // Colore di sfondo della riga, per distinguere a colpo d'occhio pagate/scadute/da pagare/programmate
  function rowStyle(s) {
    if (s.pagato) return { background: 'var(--green-bg)', borderColor: 'var(--green-border)' };
    // Rata riaperta (v49): bordo tratteggiato arancio invece del solito colore di stato,
    // per farla risaltare subito nella cornice del mese finché non viene risistemata.
    if (s.riaperta) return { background: '#fff3e8', border: '2px dashed var(--orange)', position: 'relative' };
    const col = scadenzaColor(s.date, s.tolleranzaGiorni);
    if (col === 'rosso') return { background: 'var(--red-bg)', borderColor: 'var(--red-border)' };
    if (col === 'arancio') return { background: 'var(--orange-bg)', borderColor: 'var(--orange)' };
    if (col === 'giallo') return { background: 'var(--giallo-bg)', borderColor: 'var(--giallo-border)' };
    return {};
  }

  // Conta quante altre rate dello stesso gruppo ricorrente sono ancora da pagare.
  // Serve per avvisare quando una rata pagata potrebbe far pensare (a colpo d'occhio,
  // scorrendo l'elenco) che tutto il gruppo sia a posto, mentre altre rate della stessa
  // serie sono ancora aperte più giù/più su nell'elenco (elenco che resta diviso in
  // pagate/scadute-da pagare/programmate, come richiesto — nessuna riorganizzazione).
  function rateGruppoAncoraDaPagare(s) {
    if (!s.pagato || !s.ricorrente) return 0;
    const chiave = s.gruppoId || s.id;
    const tutte = data.scadenze || [];
    return tutte.filter(item => (item.id === chiave || item.gruppoId === chiave) && !item.pagato).length;
  }

  // Stato unificato: testo + colore del pulsante, in base a pagato/scadenza
  function statoBtn(s) {
    if (s.pagato) return { label: '✓ Pagata', bg: 'var(--green)', border: 'var(--green)', color: '#fff' };
    const col = scadenzaColor(s.date, s.tolleranzaGiorni); // 'rosso' | 'giallo' | 'arancio' | 'verde'
    if (col === 'rosso') return { label: '⚠ Scaduta', bg: 'var(--red)', border: 'var(--red)', color: '#fff' };
    if (col === 'giallo') {
      const limite = addDaysToDateStr(s.date, Number(s.tolleranzaGiorni || 0));
      return { label: `⏳ Pagabile fino al ${formatDataIT(limite)}`, bg: 'var(--giallo)', border: 'var(--giallo)', color: '#fff' };
    }
    if (col === 'arancio') return { label: 'Da pagare', bg: 'var(--orange)', border: 'var(--orange)', color: '#fff' };
    return { label: 'Programmata', bg: 'var(--surface2)', border: 'var(--border2)', color: 'var(--text2)' };
  }

  return (
    <div className="section active">
      <datalist id="nomeScadenzeList">{nomiScadenzeNote.map(n => <option key={n} value={n} />)}</datalist>
      <div className="print-title">💜 Family CC — Scadenze</div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
        <div style={{fontSize:'17px',fontWeight:'700'}}>📅 Scadenze</div>
        <button className="btn primary small" onClick={() => setShow(v => !v)}>{show ? '✕ Annulla' : '+ Aggiungi'}</button>
      </div>

      <div className="summary-grid">
        <div className="summary-card uscite">
          <div className="label">Da pagare</div>
          <div className="amount">{formatEuro(totMeseDaPagare)}</div>
        </div>
        <div className="summary-card entrate">
          <div className="label">Già pagato</div>
          <div className="amount">{formatEuro(totMesePagato)}</div>
        </div>
        <div className="summary-card saldo">
          <div className="label">Totale mese</div>
          <div className="amount">{formatEuro(totMeseCorrente)}</div>
        </div>
      </div>
      <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'14px',marginTop:'-6px',textAlign:'center'}}>
        Scadenze di {meseCorrenteLabel}
      </div>

      <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'14px',lineHeight:'1.5'}}>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px',marginRight:'12px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'3px',background:'var(--red)'}}></span> scaduta</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px',marginRight:'12px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'3px',background:'var(--giallo)'}}></span> scaduta ma pagabile senza rischio (tolleranza)</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px',marginRight:'12px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'3px',background:'var(--orange)'}}></span> da pagare (entro 5 giorni)</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px',marginRight:'12px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'3px',background:'var(--surface2)',border:'1px solid var(--border2)'}}></span> programmata</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px',marginRight:'12px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'3px',background:'var(--green)'}}></span> pagata</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:'4px'}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'50%',background:'#f4d03f'}}></span> scadenza di questo mese</span>
      </div>

      {show && (
        <div className="card" style={{background:'var(--accent-light)'}}>
          <div className="form-row">
            <div className="form-group" style={{flex:2}}>
              <label>Nome</label>
              <input type="text" placeholder="Es. Affitto" list="nomeScadenzeList" value={form.nome} onChange={e => setForm(f => ({...f, nome: e.target.value}))} />
            </div>
            <div className="form-group">
              <label>Importo €</label>
              <input type="text" inputMode="decimal" placeholder="0,00" value={form.amount} onChange={e => setForm(f => ({...f, amount: e.target.value}))} />
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Data {form.tipo === 'singola' ? 'scadenza' : 'prima scadenza'}</label>
              <input type="date" value={form.date} onChange={e => setForm(f => ({...f, date: e.target.value}))} />
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Tipo scadenza</label>
              <select value={form.tipo} onChange={e => setForm(f => ({...f, tipo: e.target.value}))}>
                <option value="singola">Singola (una sola data)</option>
                <option value="ricorrente">Ricorrente (si ripete nel tempo)</option>
              </select>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group" style={{maxWidth:'220px'}}>
              <label>Giorni di tolleranza <span style={{fontWeight:'400',color:'var(--text3)'}}>(opzionale)</span></label>
              <input type="text" inputMode="numeric" pattern="[0-9]*" placeholder="0" value={form.tolleranza} onChange={e => setForm(f => ({...f, tolleranza: e.target.value}))} />
            </div>
          </div>
          <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'10px',marginTop:'-6px'}}>
            Se dopo la scadenza è ancora possibile pagare senza penalità per un certo numero di giorni (es. Rottamazione Quater: 5 giorni), scrivilo qui: la scadenza resterà in stato 🟡 "pagabile senza rischio" invece che ⚠️ scaduta, finché non passano anche questi giorni extra.
          </div>
          {form.tipo === 'ricorrente' && (
            <>
              <div className="form-row">
                <div className="form-group" style={{maxWidth:'110px'}}>
                  <label>Ogni</label>
                  <input type="text" inputMode="numeric" pattern="[0-9]*" value={form.intervallo} onChange={e => setForm(f => ({...f, intervallo: e.target.value}))} />
                </div>
                <div className="form-group">
                  <label>Unità</label>
                  <select value={form.unita} onChange={e => setForm(f => ({...f, unita: e.target.value}))}>
                    <option value="giorni">Giorni</option>
                    <option value="mesi">Mesi</option>
                  </select>
                </div>
              </div>
              <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'10px'}}>
                Esempi: 15 giorni = quindicinale · 1 mese = mensile · 2 mesi = bimestrale · 3 mesi = trimestrale · 4 mesi = quadrimestrale · 6 mesi = semestrale · 12 mesi = annuale
              </div>
              {form.unita === 'mesi' && (
                <label style={{display:'flex',alignItems:'center',gap:'8px',fontSize:'13px',fontWeight:'500',marginBottom:'12px',cursor:'pointer'}}>
                  <input type="checkbox" checked={form.fineMese} onChange={e => setForm(f => ({...f, fineMese: e.target.checked}))} style={{width:'18px',height:'18px',cursor:'pointer',accentColor:'var(--accent)'}} />
                  Sempre l'ultimo giorno del mese (es. affitto a fine mese)
                </label>
              )}
              <div style={{fontSize:'12px',color:'var(--text2)',marginBottom:'10px'}}>
                Verranno generate automaticamente le prossime 12 occorrenze. Potrai modificarle o eliminarle singolarmente.
              </div>
              <label style={{display:'flex',alignItems:'center',gap:'8px',fontSize:'13px',fontWeight:'500',marginBottom:'12px',cursor:'pointer'}}>
                <input type="checkbox" checked={form.numera} onChange={e => setForm(f => ({...f, numera: e.target.checked}))} style={{width:'18px',height:'18px',cursor:'pointer',accentColor:'var(--accent)'}} />
                Numera le rate (Rata 1, Rata 2, Rata 3...)
              </label>
            </>
          )}
          <button className="btn primary" onClick={add}>💾 Salva</button>
        </div>
      )}

      {mesiOrdinati.length === 0 && <div className="empty">Nessuna scadenza</div>}

      {mesiOrdinati.map(chiaveMese => {
        const [meseAnno, meseNum] = chiaveMese.split('-').map(Number);
        const totMeseRiquadro = gruppiPerMese[chiaveMese].reduce((a, s) => a + Number(s.amount || 0), 0);
        return (
        <div key={chiaveMese} style={{border:'2px solid var(--accent)',borderRadius:'14px',padding:'10px',marginBottom:'16px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'2px 6px 8px'}}>
            <span style={{fontSize:'11px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'0.07em',color:'var(--accent)'}}>
              {monthLabel(meseAnno, meseNum)}
            </span>
            <span style={{fontSize:'12px',fontWeight:'700',color:'var(--accent)'}}>{formatEuro(totMeseRiquadro)}</span>
          </div>
          {gruppiPerMese[chiaveMese].map(s => {
            const st = statoBtn(s);
            const rateAperteGruppo = rateGruppoAncoraDaPagare(s);
            return (
            <div key={s.id}>
          <div className={`scad-item${s.pagato ? ' pagato' : ''}`} style={rowStyle(s)}>
            {!s.pagato && s.riaperta && (
              <span style={{position:'absolute',top:'-9px',left:'14px',background:'var(--orange)',color:'#fff',fontSize:'10px',fontWeight:'700',padding:'1px 8px',borderRadius:'10px',letterSpacing:'0.03em'}}>RIAPERTA</span>
            )}
            {isMeseCorrente(s.date) && !s.pagato && <span className="scad-dot giallo" title="Scadenza di questo mese"></span>}
            <div className="scad-info">
              <div className="scad-name">{s.nome}</div>
              {(s.numerata && s.rataNum || tipoLabel(s) || s.prioritaria) && (
                <div style={{marginTop:'2px',display:'flex',gap:'6px',flexWrap:'wrap'}}>
                  {s.prioritaria && <span style={{fontSize:'11px',color:'var(--accent-dark)',fontWeight:'700',background:'var(--accent-light)',padding:'1px 7px',borderRadius:'20px'}}>🔔 Prioritaria</span>}
                  {s.numerata && s.rataNum ? <span style={{fontSize:'11px',color:'var(--accent-dark)',fontWeight:'700'}}>Rata {s.rataNum}</span> : null}
                  {tipoLabel(s) && <span style={{fontSize:'11px',color:'var(--text3)'}}>{tipoLabel(s)}</span>}
                </div>
              )}
              {rateAperteGruppo > 0 && (

                      </div>
                      {editForm.unita === 'mesi' && (

              <div style={{display:'flex',gap:'8px'}}>
                <button className="btn primary" onClick={() => saveEdit(s)}>💾 Salva modifica</button>
                <button className="btn" onClick={cancelEdit}>✕ Annulla</button>
